<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Debt Freedom">

<title>Debt Freedom</title>
<style>
:root{
  --bg:#f8fafc; --card:#fff; --ink:#0f172a; --muted:#64748b; --line:#e2e8f0;
  --navy:#0f172a; --blue:#2563eb; --teal:#0f766e; --green:#15803d; --red:#b91c1c; --amber:#b45309;
  --softblue:#eff6ff; --softgreen:#f0fdf4; --softred:#fef2f2; --softamber:#fffbeb;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
header{position:sticky;top:0;z-index:20;background:rgba(15,23,42,.96);color:#fff;padding:16px 16px 12px}
header h1{font-size:21px;margin:0 0 4px} header p{font-size:12px;margin:0;color:#cbd5e1}
main{max-width:760px;margin:auto;padding:14px 14px 92px}
.tabs{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin:0 0 14px}
.tab{border:0;border-radius:12px;padding:10px 4px;font-size:11px;font-weight:700;background:#e2e8f0;color:#334155}
.tab.active{background:var(--navy);color:#fff}
.panel{display:none}.panel.active{display:block}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:10px;box-shadow:0 1px 2px rgba(15,23,42,.04)}
.kpi .label{font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.03em}
.kpi .value{font-size:23px;font-weight:800;margin-top:4px}
.kpi .sub{font-size:11px;color:var(--muted);margin-top:4px}
h2{font-size:17px;margin:18px 0 10px} h3{font-size:15px;margin:0 0 8px}
.badge{display:inline-block;border-radius:999px;padding:4px 8px;font-size:10px;font-weight:800}
.overdue{background:var(--softred);color:var(--red)}
.biweekly{background:var(--softblue);color:#1d4ed8}
.other{background:var(--softamber);color:var(--amber)}
.hoyes{background:var(--softgreen);color:var(--green)}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.muted{color:var(--muted);font-size:12px}
.big{font-size:19px;font-weight:800}
.progress{height:8px;border-radius:999px;background:#e2e8f0;overflow:hidden;margin-top:8px}
.progress>span{display:block;height:100%;background:var(--blue)}
button{font:inherit}
.btn{border:0;border-radius:10px;padding:10px 12px;font-weight:700;background:var(--navy);color:white}
.btn.secondary{background:#e2e8f0;color:#334155}.btn.danger{background:#fee2e2;color:#991b1b}
.btn.small{padding:7px 9px;font-size:12px}
input,select{width:100%;border:1px solid #cbd5e1;border-radius:10px;padding:10px;background:white;color:var(--ink);font-size:16px}
label{display:block;font-size:11px;color:var(--muted);font-weight:700;margin:0 0 5px}
.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
hr{border:0;border-top:1px solid var(--line);margin:12px 0}
.debt-card .actions{display:flex;gap:8px;margin-top:10px}
.paycard{border-left:4px solid var(--blue)}
.paycard.done{opacity:.6;border-left-color:var(--green)}
.alloc{font-size:12px;display:grid;grid-template-columns:1fr auto;gap:5px 12px;margin-top:10px}
.alloc b{font-variant-numeric:tabular-nums}
.note{background:var(--softblue);border:1px solid #bfdbfe;border-radius:12px;padding:11px;font-size:12px;line-height:1.4;margin-bottom:10px}
.warn{background:var(--softamber);border-color:#fde68a}
.good{background:var(--softgreen);border-color:#bbf7d0}
.footerbar{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);padding:8px 14px calc(8px + env(safe-area-inset-bottom));z-index:30}
.footerbar .inner{max-width:760px;margin:auto;display:flex;gap:8px}
.footerbar .btn{flex:1}
details summary{cursor:pointer;font-weight:700}
@media(max-width:420px){.grid{grid-template-columns:1fr 1fr}.tabs{gap:4px}.tab{font-size:10px;padding:9px 2px}.formgrid{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
  <h1>Debt Freedom</h1>
  <p>Payday → next morning • actual-balance safety check</p>
</header>

<main>
  <div class="tabs">
    <button class="tab active" data-tab="home">Home</button>
    <button class="tab" data-tab="paydays">Paydays</button>
    <button class="tab" data-tab="bills">Bills</button>
    <button class="tab" data-tab="debts">Debts</button>
    <button class="tab" data-tab="funds">Funds</button>
    <button class="tab" data-tab="settings">Settings</button>
  </div>

  <section id="home" class="panel active"></section>
  <section id="paydays" class="panel"></section>
  <section id="bills" class="panel"></section>
  <section id="debts" class="panel"></section>
  <section id="funds" class="panel"></section>
  <section id="settings" class="panel"></section>
</main>

<div class="footerbar">
  <div class="inner">
    <button class="btn secondary" onclick="exportBackup()">Export backup</button>
    <button class="btn" onclick="renderAll()">Refresh plan</button>
  </div>
</div>

<script>
const VERSION = 1;
const money = n => new Intl.NumberFormat('en-CA',{style:'currency',currency:'CAD'}).format(Math.max(0,Number(n)||0));
const moneySigned = n => new Intl.NumberFormat('en-CA',{style:'currency',currency:'CAD'}).format(Number(n)||0);
const cents = n => Math.round((Number(n)||0)*100)/100;
const activeBalance = n => Number(n||0)>0.005;
function normalizeDebtBalance(d){
  d.balance=activeBalance(d.balance)?cents(Math.max(0,Number(d.balance)||0)):0;
  return d.balance;
}
const fmtDate = s => new Date(s+'T12:00:00').toLocaleDateString('en-CA',{month:'short',day:'numeric',year:'numeric'});
const iso = d => d.toISOString().slice(0,10);
const isoLocal = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const addDays = (s,n) => { const d=new Date(s+'T12:00:00'); d.setDate(d.getDate()+n); return iso(d); };
const firstOfMonth = s => { const d=new Date(s+'T12:00:00'); return new Date(d.getFullYear(),d.getMonth(),1,12); };
const daysInMonth = (y,m) => new Date(y,m+1,0).getDate();
const deep = x => JSON.parse(JSON.stringify(x));

const defaultState = {
  version: VERSION,
  income: 0,
  firstPay: "2026-09-10",
  payEveryDays: 14,
  rent: 0,
  groceriesPerPay: 0,
  gasPerPay: 0,
  personalPerPay: 0,
  plannedPerPay: 0,
  emergencyPerPay: 0,
  emergencyTarget: 0,
  funds: {rent:0, planned:0, emergency:0, momPaid:0},
  momOwed: 0,
  processedPays: [],
  payOverrides: {},
  bills: [],
  debts: [],
  paymentHistory: [],
  undoSnapshots: []
};

let state = load();

function load(){
  try{
    const raw=localStorage.getItem("debtFreedomState");
    return raw ? Object.assign(deep(defaultState),JSON.parse(raw)) : deep(defaultState);
  }catch(e){ return deep(defaultState); }
}
function save(){ localStorage.setItem("debtFreedomState",JSON.stringify(state)); }
function normalizeState(){
  state.funds=state.funds||{};
  ['rent','planned','emergency','debtReserve','momPaid'].forEach(k=>{
    state.funds[k]=Math.max(0,Number(state.funds[k])||0);
  });

  state.accounts=state.accounts||{
    regular:{name:"Regular account"},
    rent:{name:"Rent account"},
    scotia:{name:"Scotia spending account only"}
  };
  state.startingBalances=state.startingBalances||{regular:0,rent:0,scotia:0};
  state.regularBuffer=Math.max(0,Number(state.regularBuffer===undefined?200:state.regularBuffer)||0);
  state.oneTimeItems=Array.isArray(state.oneTimeItems)?state.oneTimeItems:[];
  state.bills=Array.isArray(state.bills)?state.bills:[];
  state.debts=Array.isArray(state.debts)?state.debts:[];
  state.processedPays=Array.isArray(state.processedPays)?state.processedPays:[];
  state.paymentHistory=Array.isArray(state.paymentHistory)?state.paymentHistory:[];
  state.undoSnapshots=Array.isArray(state.undoSnapshots)?state.undoSnapshots:[];
  state.payOverrides=state.payOverrides&&typeof state.payOverrides==='object'?state.payOverrides:{};
  state.paydayStages=state.paydayStages&&typeof state.paydayStages==='object'?state.paydayStages:{};
  state.pastDueMinMeaningful=Math.max(0,Number(state.pastDueMinMeaningful===undefined?300:state.pastDueMinMeaningful)||300);

  state.bills.forEach(b=>{
    if(b.account===undefined) b.account=(b.id==="car"?"rent":"regular");
    if(b.auto===undefined) b.auto=(b.id==="car");
    b.amount=Math.max(0,Number(b.amount)||0);
  });
  state.debts.forEach(d=>{
    d.balance=cents(Math.max(0,Number(d.balance)||0));
    if(!activeBalance(d.balance)) d.balance=0;
    d.start=Math.max(d.balance,Number(d.start)||0);
    d.min=Math.max(0,Number(d.min)||0);
    if(d.interestPerPay!==undefined) d.interestPerPay=Math.max(0,Number(d.interestPerPay)||0);
    if(d.monthlyPeriodicRate!==undefined) d.monthlyPeriodicRate=Math.max(0,Number(d.monthlyPeriodicRate)||0);
    if(d.apr!==undefined) d.apr=Math.max(0,Number(d.apr)||0);
    // Past-due debts no longer use hard-coded priority numbers.
    delete d.priority;
    if(d.category==="overdue" && /priority/i.test(String(d.note||''))) d.note="Past due; no scheduled payment.";
  });

  // The current overdue ChatGPT charge is the September cycle. Do not budget a second September renewal.
  const cg=state.bills.find(b=>b.id==="chatgpt");
  if(cg && cg.start==="2026-09-19" && state.oneTimeItems.some(x=>x.id==="chatgptoverdue")) cg.start="2026-10-19";
}
normalizeState();

function dueInWindow(payDate,nextDate,dueDay,startDate){
  let start = new Date(payDate+'T12:00:00'), end = new Date(nextDate+'T12:00:00');
  let cur = new Date(start.getFullYear(),start.getMonth(),1,12);
  let finish = new Date(end.getFullYear(),end.getMonth(),1,12);
  const minStart = new Date(startDate+'T12:00:00');
  while(cur <= finish){
    const day = dueDay==="last" ? daysInMonth(cur.getFullYear(),cur.getMonth()) : Math.min(Number(dueDay),daysInMonth(cur.getFullYear(),cur.getMonth()));
    const due = new Date(cur.getFullYear(),cur.getMonth(),day,12);
    if(due >= minStart && due >= start && due < end) return true;
    cur = new Date(cur.getFullYear(),cur.getMonth()+1,1,12);
  }
  return false;
}

function dueDateInWindow(payDate,nextDate,dueDay,startDate){
  let start=new Date(payDate+'T12:00:00'), end=new Date(nextDate+'T12:00:00');
  let cur=new Date(start.getFullYear(),start.getMonth(),1,12);
  let finish=new Date(end.getFullYear(),end.getMonth(),1,12);
  const minStart=new Date((startDate||state.firstPay)+'T12:00:00');
  while(cur<=finish){
    const day=dueDay==="last"
      ? daysInMonth(cur.getFullYear(),cur.getMonth())
      : Math.min(Number(dueDay),daysInMonth(cur.getFullYear(),cur.getMonth()));
    const due=new Date(cur.getFullYear(),cur.getMonth(),day,12);
    if(due>=minStart && due>=start && due<end) return isoLocal(due);
    cur=new Date(cur.getFullYear(),cur.getMonth()+1,1,12);
  }
  return null;
}
function firstWeekdayOfMonth(year,month){
  const d=new Date(year,month,1,12);
  while(d.getDay()===0 || d.getDay()===6) d.setDate(d.getDate()+1);
  return d;
}
function billMonthlyDueDate(b,year,month){
  if(b.dueRule==="firstBusinessDay") return firstWeekdayOfMonth(year,month);
  const day=b.dueDay==="last"
    ? daysInMonth(year,month)
    : Math.min(Number(b.dueDay),daysInMonth(year,month));
  return new Date(year,month,day,12);
}
function billDueDateInWindow(payDate,nextDate,b){
  const start=new Date(payDate+'T12:00:00'), end=new Date(nextDate+'T12:00:00');
  let cur=new Date(start.getFullYear(),start.getMonth(),1,12);
  const finish=new Date(end.getFullYear(),end.getMonth(),1,12);
  const minStart=new Date((b.start||state.firstPay)+'T12:00:00');
  while(cur<=finish){
    const due=billMonthlyDueDate(b,cur.getFullYear(),cur.getMonth());
    if(due>=minStart && due>=start && due<end) return isoLocal(due);
    cur=new Date(cur.getFullYear(),cur.getMonth()+1,1,12);
  }
  return null;
}
function billDueInWindow(payDate,nextDate,b){
  return billDueDateInWindow(payDate,nextDate,b)!==null;
}
function billDueOnDate(date,b){
  return billDueInWindow(date,addDays(date,1),b);
}
function billDueLabel(b){
  if(b.dueRule==="firstBusinessDay") return "First business day of month";
  return dueDayLabel(b.dueDay);
}

function dueDayLabel(dueDay){
  if(dueDay==="last") return "Last day of month";
  const n=Number(dueDay);
  if(!Number.isFinite(n)) return "Monthly";
  const mod100=n%100;
  const suffix=(mod100>=11&&mod100<=13)?"th":({1:"st",2:"nd",3:"rd"}[n%10]||"th");
  return `${n}${suffix} of month`;
}

function payDatesInMonth(payDate){
  const d=new Date(payDate+'T12:00:00');
  const monthStart=new Date(d.getFullYear(),d.getMonth(),1,12);
  const monthEnd=new Date(d.getFullYear(),d.getMonth()+1,1,12);
  const first=new Date(state.firstPay+'T12:00:00');
  const interval=Math.max(1,Number(state.payEveryDays)||14);
  const dayMs=86400000;
  let idx=Math.floor((monthStart-first)/(interval*dayMs))-1;
  idx=Math.max(0,idx);
  const arr=[];
  for(let i=idx;i<idx+6;i++){
    const p=addDays(state.firstPay,i*interval), pd=new Date(p+'T12:00:00');
    if(pd>=monthStart && pd<monthEnd) arr.push(p);
    if(pd>=monthEnd) break;
  }
  return arr;
}
function dueOnDate(date,dueDay,startDate){
  return dueInWindow(date,addDays(date,1),dueDay,startDate||state.firstPay);
}
function rentContribution(payDate){
  if(state.payOverrides[payDate] && state.payOverrides[payDate].rent!==undefined) return Number(state.payOverrides[payDate].rent)||0;
  if(payDate < "2026-11-01") return 0;
  const pays=payDatesInMonth(payDate);
  return pays.slice(0,2).includes(payDate) ? state.rent/2 : 0;
}
function lifeForPay(payDate){
  const o=state.payOverrides[payDate]||{};
  return {
    personal:o.personal!==undefined?Number(o.personal):state.personalPerPay,
    planned:o.planned!==undefined?Number(o.planned):state.plannedPerPay,
    emergency:o.emergency!==undefined?Number(o.emergency):state.emergencyPerPay,
    note:o.note||""
  };
}

function extraTargetOrder(debts){
  const order=[], seen=new Set();
  const add=id=>{
    const d=debts.find(x=>x.id===id && activeBalance(x.balance) && x.category!=="hoyes");
    if(d && !seen.has(d.id)){order.push(d);seen.add(d.id);}
  };
  // After all past-due balances are gone: known expensive debt first, then credit card.
  add("alterfina"); add("cc");
  debts.filter(d=>activeBalance(d.balance) && d.category!=="hoyes" && d.category!=="overdue" && !seen.has(d.id))
    .sort((a,b)=>a.balance-b.balance)
    .forEach(d=>{order.push(d);seen.add(d.id);});
  return order;
}


function interestAdditionForPay(d,payDate,nextDate){
  if(!d || !activeBalance(d.balance)) return 0;
  let add=0;

  // Fixed amount added every pay cycle.
  if(Number(d.interestPerPay||0)>0) add += Number(d.interestPerPay||0);

  // Estimated monthly percentage interest. This is applied once in the
  // pay window containing the debt's due day, starting no earlier than interestStart.
  const monthlyRate=Number(d.monthlyPeriodicRate||0);
  if(monthlyRate>0 && d.dueDay!==undefined){
    const startDate=d.interestStart || state.firstPay;
    if(dueInWindow(payDate,nextDate,d.dueDay,startDate)){
      add += cents(Number(d.balance||0)*monthlyRate);
    }
  }
  return cents(add);
}
function applyInterestForPay(debts,payDate,nextDate){
  debts.forEach(d=>{
    const add=interestAdditionForPay(d,payDate,nextDate);
    if(add>0) d.balance=cents(Number(d.balance||0)+add);
  });
}

function simulate(){
  normalizeState();
  let debts=deep(state.debts);
  let rows=[], debtFreeIndex=null, extraAfter=0;
  let debtReserve=Number(state.funds.debtReserve||0);
  let emergencyFund=Number(state.funds.emergency||0);

  let startIndex=0;
  while(state.processedPays.includes(addDays(state.firstPay,startIndex*state.payEveryDays))) startIndex++;

  for(let i=startIndex;i<startIndex+40;i++){
    const payDate=addDays(state.firstPay,i*state.payEveryDays);
    const nextDate=addDays(payDate,state.payEveryDays);
    const desired=lifeForPay(payDate);
    const rentSave=rentContribution(payDate);
    const billItems=state.bills.filter(b=>billDueInWindow(payDate,nextDate,b));
    const billsTotal=billItems.reduce((s,b)=>s+Number(b.amount||0),0);
    const oneTimeItems=(state.oneTimeItems||[]).filter(x=>!x.paid && x.duePay===payDate);
    const oneTimesTotal=oneTimeItems.reduce((s,x)=>s+Number(x.amount||0),0);
    const openingRegularDeficit=payDate===state.firstPay ? Math.max(0,-Number(state.startingBalances?.regular||0)) : 0;
    const openingBufferNeed=payDate===state.firstPay ? Math.max(0,Number(state.regularBuffer||0)-Math.max(0,Number(state.startingBalances?.regular||0))) : 0;
    const openingRegularNeed=openingRegularDeficit+openingBufferNeed;
    const openingRentTopup=payDate===state.firstPay ? Math.max(0,-Number(state.startingBalances?.rent||0)) : 0;

    const allocations=[];
    let baseDebt=0;

    applyInterestForPay(debts,payDate,nextDate);

    debts.forEach(d=>{
      if(!activeBalance(d.balance)){ d.balance=0; return; }
      let due=0;
      if(d.category==="biweekly") due = (i===0 && d.firstPay) ? Number(d.firstPay) : Number(d.min||0);
      else if(d.category==="hoyes") due=Number(d.min||0);
      else if(d.category==="monthly" && dueInWindow(payDate,nextDate,d.dueDay,state.firstPay)) due=Number(d.min||0);
      else if(d.id==="bellbal" && (i===0 || i===1)) due=226.57;
      else if(d.id==="bree" && payDate==="2026-09-24") due=815.99;
      due=Math.min(d.balance,due);
      if(due>0){
        d.balance=cents(Math.max(0,d.balance-due)); if(!activeBalance(d.balance)) d.balance=0; baseDebt+=due;
        allocations.push({name:d.name,id:d.id,amount:due,type:"Required"});
      }
    });

    // Planned/emergency savings are optional. Never let them create a cash shortfall.
    const fixedBeforeSavings=billsTotal+state.groceriesPerPay+state.gasPerPay+Number(desired.personal||0)+rentSave+baseDebt+oneTimesTotal+openingRegularNeed+openingRentTopup;
    const cashShortfall=Math.max(0,fixedBeforeSavings-state.income);

    // Warning hierarchy for the forecast:
    // 1) Critical: required bills/debt payments themselves exceed the pay.
    // 2) Adjustment: the cash plan is short even before trying to establish the full buffer.
    // 3) Buffer-only: everything else fits, but the full Regular buffer does not.
    const hardRequired=billsTotal+baseDebt+openingRegularDeficit+openingRentTopup;
    const criticalBillsShortfall=Math.max(0,hardRequired-state.income);
    const fixedWithoutBuffer=fixedBeforeSavings-openingBufferNeed;
    const planAdjustmentShortfall=criticalBillsShortfall>0?0:Math.max(0,fixedWithoutBuffer-state.income);
    const bufferOnlyShortfall=(criticalBillsShortfall<=0.005 && planAdjustmentShortfall<=0.005 && cashShortfall>0.005)
      ? cashShortfall : 0;

    const availableForSavings=Math.max(0,state.income-fixedBeforeSavings);
    const plannedWanted=Math.max(0,Number(desired.planned||0));
    let emergencyWanted=Math.max(0,Number(desired.emergency||0));
    if(Number(state.emergencyTarget||0)>0) emergencyWanted=Math.min(emergencyWanted,Math.max(0,Number(state.emergencyTarget)-emergencyFund));
    const wantedSavings=plannedWanted+emergencyWanted;
    const scale=wantedSavings>0?Math.min(1,availableForSavings/wantedSavings):0;
    let planned=cents(plannedWanted*scale);
    let emergency=cents(emergencyWanted*scale);
    if(planned+emergency>availableForSavings) emergency=Math.max(0,cents(availableForSavings-planned));
    emergencyFund+=emergency;

    const debtReserveStart=debtReserve;
    const reserveAdd=cashShortfall>0?0:Math.max(0,state.income-fixedBeforeSavings-planned-emergency);
    debtReserve += reserveAdd;

    let extraUsed=0;
    if(cashShortfall<=0.005){
      const overdue=debts.filter(d=>d.category==="overdue" && activeBalance(d.balance));
      if(overdue.length){
        const chosen=allocatePastDueFastest(debtReserve,overdue);
        chosen.picks.forEach(a=>{
          const d=debts.find(x=>x.id===a.id);
          if(!d) return;
          d.balance=cents(Math.max(0,d.balance-a.amount)); if(!activeBalance(d.balance)) d.balance=0;
          debtReserve=Math.max(0,debtReserve-a.amount);
          extraUsed+=a.amount;
          allocations.push({name:d.name,id:d.id,amount:a.amount,type:"Extra",chunk:true});
        });
      }else{
        for(const d of extraTargetOrder(debts)){
          if(debtReserve<=0.005) break;
          const amt=Math.min(debtReserve,d.balance);
          d.balance=cents(Math.max(0,d.balance-amt)); if(!activeBalance(d.balance)) d.balance=0; debtReserve=cents(Math.max(0,debtReserve-amt)); extraUsed+=amt;
          allocations.push({name:d.name,id:d.id,amount:amt,type:"Extra"});
        }
      }
    }

    debts.forEach(normalizeDebtBalance);
    const remaining=cents(debts.reduce((s,d)=>s+(activeBalance(d.balance)?d.balance:0),0));
    rows.push({
      index:i,payDate,nextDate,income:state.income,billItems,billsTotal,
      groceries:state.groceriesPerPay,gas:state.gasPerPay,personal:Number(desired.personal||0),planned,emergency,note:desired.note||"",rentSave,

function allocatePastDueFastest(pool, debtsSnapshot){
  let available=Math.max(0,Number(pool)||0), picks=[];
  const minMeaningful=Math.max(0,Number(state.pastDueMinMeaningful||300));

  const overdue=debtsSnapshot
    .filter(d=>d.category==="overdue"&&activeBalance(d.balance));

  const addPick=(d,amt)=>{
    amt=cents(Math.max(0,Math.min(Number(amt)||0,Number(d.balance)||0)));
    if(amt<=0.005) return 0;
    picks.push({id:d.id,name:d.name,amount:amt,chunk:amt>=minMeaningful});
    d.balance=cents(Math.max(0,Number(d.balance)-amt));
    if(!activeBalance(d.balance)) d.balance=0;
    available=cents(Math.max(0,available-amt));
    return amt;
  };

  // GoDay and SpeedyCash are a joint top-priority pair.
  // If both are active and there is enough for two meaningful payments,
  // each gets at least $300. If there is only enough for one meaningful
  // payment, it goes to whichever currently has the larger balance.
  let pair=overdue
    .filter(d=>d.id==="goday"||d.id==="speedy")
    .sort((a,b)=>Number(b.balance)-Number(a.balance) || String(a.name).localeCompare(String(b.name)));

  if(pair.length===2){
    const [high,low]=pair;
    const bothFull=cents(Number(high.balance)+Number(low.balance));

    if(available+0.005>=bothFull){
      addPick(high,high.balance);
      addPick(low,low.balance);
    } else if(available+0.005>=minMeaningful*2){
      addPick(high,Math.min(Number(high.balance),minMeaningful));
      addPick(low,Math.min(Number(low.balance),minMeaningful));

      // Use every remaining safe dollar on whichever of the pair is
      // currently larger, re-evaluating after each payoff.
      while(available>0.005 && (activeBalance(high.balance)||activeBalance(low.balance))){
        const active=[high,low]
          .filter(d=>activeBalance(d.balance))
          .sort((a,b)=>Number(b.balance)-Number(a.balance) || String(a.name).localeCompare(String(b.name)));
        if(!active.length) break;
        addPick(active[0],Math.min(available,active[0].balance));
      }
    } else if(available+0.005>=minMeaningful){
      addPick(high,Math.min(available,high.balance));
    } else {
      // Below $300, only make a payment if it can fully close one of the pair.
      const closable=pair
        .filter(d=>activeBalance(d.balance) && available+0.005>=Number(d.balance))
        .sort((a,b)=>Number(a.balance)-Number(b.balance));
      if(closable.length) addPick(closable[0],closable[0].balance);
    }
  } else if(pair.length===1){
    const d=pair[0];
    if(available+0.005>=Number(d.balance)) addPick(d,d.balance);
    else if(available+0.005>=minMeaningful) addPick(d,available);
  }

  // Do not touch other past-due accounts until both GoDay and Speedy are cleared.
  const pairStillActive=overdue.some(
    d=>(d.id==="goday"||d.id==="speedy")&&activeBalance(d.balance)
  );

  // After the joint-priority pair is gone, close remaining past-due accounts
  // as quickly as possible (smallest remaining balance first).
  if(!pairStillActive && available>0.005){
    const rest=overdue
      .filter(d=>d.id!=="goday"&&d.id!=="speedy"&&activeBalance(d.balance))
      .sort((a,b)=>Number(a.balance)-Number(b.balance) || String(a.name).localeCompare(String(b.name)));

    for(const d of rest){
      if(available<=0.005) break;
      const balance=cents(Number(d.balance||0));

      if(available+0.005>=balance){
        addPick(d,balance);
        continue;
      }
      if(available+0.005>=minMeaningful){
        addPick(d,available);
      }
      break;
    }
  }

  return {picks,unused:available,used:Math.max(0,cents((Number(pool)||0)-available))};
}

function chooseDebtChunks(pool, debtsSnapshot){
  const overdue=debtsSnapshot.filter(d=>d.category==="overdue"&&activeBalance(d.balance));
  if(overdue.length) return allocatePastDueFastest(pool,overdue);

  let available=Math.max(0,Number(pool)||0), picks=[];
  for(const d of extraTargetOrder(debtsSnapshot)){
    if(available<=0.005) break;
    const amt=Math.min(available,d.balance);
    picks.push({id:d.id,name:d.name,amount:amt,chunk:false});
    available=cents(available-amt); d.balance=cents(Math.max(0,d.balance-amt)); if(!activeBalance(d.balance)) d.balance=0;
  }
  return {picks,unused:available,used:Math.max(0,(Number(pool)||0)-available)};
}
function debtSnapshotAfterRequired(row){
  const snap=deep(state.debts);
  applyInterestForPay(snap,row.payDate,row.nextDate);
  [...autoDebtAllocationsFor(row),...manualDebtAllocationsFor(row)].forEach(a=>{
    const d=snap.find(x=>x.id===a.id);
    if(d){ d.balance=cents(Math.max(0,d.balance-Number(a.amount||0))); if(!activeBalance(d.balance)) d.balance=0; }
  });
  return snap;
}
function morningCalculation(row, actualRegular){
  const autoLater=regularAutomaticBillsLater(row);
  const autoLaterTotal=autoLater.reduce((s,b)=>s+Number(b.amount||0),0);
  const manualBills=manualBillsFor(row);
  const manualBillsTotal=manualBills.reduce((s,b)=>s+Number(b.amount||0),0);
  const manualDebts=manualDebtAllocationsForMorning(row);
  const manualDebtsTotal=manualDebts.reduce((s,a)=>s+Number(a.amount||0),0);
  const oneTimes=dueOneTimeItems(row.payDate);
  const oneTimesTotal=oneTimes.reduce((s,x)=>s+Number(x.amount||0),0);

  const plannedWanted=Math.max(0,Number(row.planned||0));
  let emergencyWanted=Math.max(0,Number(row.emergency||0));
  if(Number(state.emergencyTarget||0)>0) emergencyWanted=Math.min(emergencyWanted,Math.max(0,Number(state.emergencyTarget)-Number(state.funds.emergency||0)));

  const bufferTarget=Number(state.regularBuffer||0);
  const coreRequired=autoLaterTotal+manualBillsTotal+manualDebtsTotal;
  const cleanupTotal=oneTimesTotal;
  const protectedRegular=bufferTarget+autoLaterTotal;
  const requiredTotal=coreRequired+cleanupTotal+bufferTarget;

  // Distinguish a true bill/debt emergency from a cleanup-item shortage
  // and from simply missing the preferred $200 Regular buffer.
  const criticalBillsShortfall=Math.max(0,coreRequired-Number(actualRegular));
  const cleanupShortfall=criticalBillsShortfall>0.005?0:Math.max(0,coreRequired+cleanupTotal-Number(actualRegular));
  const bufferShortfall=(criticalBillsShortfall<=0.005 && cleanupShortfall<=0.005)
    ? Math.max(0,requiredTotal-Number(actualRegular)) : 0;
  const requiredShortfall=Math.max(criticalBillsShortfall,cleanupShortfall,bufferShortfall);
  const availableAfterRequired=Math.max(0,Number(actualRegular)-requiredTotal);
  const desiredSavings=plannedWanted+emergencyWanted;
  const scale=desiredSavings>0?Math.min(1,availableAfterRequired/desiredSavings):0;
  let planned=cents(plannedWanted*scale);
  let emergency=cents(emergencyWanted*scale);
  if(planned+emergency>availableAfterRequired) emergency=Math.max(0,cents(availableAfterRequired-planned));
  const savingsReduced=Math.max(0,desiredSavings-planned-emergency);
  const todayFree=requiredShortfall>0?0:Math.max(0,availableAfterRequired-planned-emergency);
  const existingReserve=Number(state.funds.debtReserve||0);

  const snap=debtSnapshotAfterRequired(row);
  const chosen=requiredShortfall>0?{picks:[],used:0,unused:todayFree+existingReserve}:chooseDebtChunks(todayFree+existingReserve,snap);
  const todayUsed=Math.min(todayFree,chosen.used);
  const reserveUsed=Math.max(0,chosen.used-todayUsed);
  const newReserveFromToday=Math.max(0,todayFree-todayUsed);
  const endingReserve=Math.max(0,existingReserve-reserveUsed+newReserveFromToday);

  return {
    actualRegular:Number(actualRegular),autoLater,autoLaterTotal,manualBills,manualBillsTotal,manualDebts,manualDebtsTotal,
    oneTimes,oneTimesTotal,plannedWanted,emergencyWanted,planned,emergency,savingsReduced,
    bufferTarget,coreRequired,cleanupTotal,protectedRegular,requiredTotal,requiredShortfall,
    criticalBillsShortfall,cleanupShortfall,bufferShortfall,availableAfterRequired,todayFree,
    existingReserve,picks:chosen.picks,todayUsed,reserveUsed,newReserveFromToday,endingReserve
  };
}

            <button class="btn ${x.posted?'secondary':''} small" onclick="toggleUncertainPosted('${x.id}')">${x.posted?'Already posted ✓':'Mark if already posted'}</button>
          </div>`).join("")}
        <div class="muted" style="margin-top:8px">If it has not posted, leave it unmarked. The app will keep it in your manual-payment list.</div>
      </div>`:""}

      <div class="card">
        <h3>What is your actual Regular balance now?</h3>
        <label>Regular account balance after overnight autopays</label>
        <input id="actualRegularInput" type="number" step=".01" value="${actualSet?stage.actualRegular:""}" placeholder="e.g. 1425.30">
        <button class="btn" style="width:100%;margin-top:10px" onclick="calculateMorning('${next.payDate}')">Calculate what I can safely move/pay</button>
      </div>

      ${calc?(()=>{
        const expected=expectedRegularBalances(next).tomorrow;
        const delta=Number(stage.actualRegular)-expected;
        if(Math.abs(delta)<20) return "";
        return `<div class="note ${delta>0?'warn':''}"><b>Balance check:</b> your actual Regular balance is ${money(Math.abs(delta))} ${delta>0?'higher':'lower'} than the estimate. ${delta>0?'Confirm every listed automatic debt withdrawal has actually posted before moving extra money.':'The app will use your lower actual balance, which protects you from overspending.'}</div>`;
      })():""}

      ${calc?renderMorningResult(next,calc):""}

      ${(state.undoSnapshots||[]).length?`<button class="btn secondary" style="width:100%;margin-top:8px" onclick="undoLastPay()">Undo last completed payday</button>`:""}
    `;
    return;
  }
}

function categoryLabel(d){
  if(d.category==="overdue") return ["Past due","overdue"];
  if(d.category==="hoyes") return ["HOYES","hoyes"];
  if(d.category==="biweekly") return ["Biweekly","biweekly"];
  if(d.category==="monthly") return ["Monthly","other"];
  return ["Other","other"];
}

function renderBills(){
  const recurring=deep(state.bills||[]).sort((a,b)=>{
    const av=a.dueRule==="firstBusinessDay"?1:(a.dueDay==="last"?32:Number(a.dueDay)||99);
    const bv=b.dueRule==="firstBusinessDay"?1:(b.dueDay==="last"?32:Number(b.dueDay)||99);
    return av-bv || a.name.localeCompare(b.name);
  });
  const monthlyDebts=deep(state.debts||[]).filter(d=>d.category==="monthly" && Number(d.balance||0)>0);
  const recurringTotal=recurring.reduce((s,b)=>s+Number(b.amount||0),0);
  const monthlyDebtTotal=monthlyDebts.reduce((s,d)=>s+Math.min(Number(d.balance||0),Number(d.min||0)),0);

  const sim=simulate();
  const payRows=sim.rows.slice(0,10);

  const recurringHtml=recurring.length?recurring.map(b=>`
    <div class="card">
      <div class="row">
        <div>
          <h3>${b.name}</h3>
          <div class="muted">${billDueLabel(b)} • ${paymentMethodForBill(b)}</div>
        </div>
        <div class="big">${money(b.amount)}</div>
      </div>
      ${b.note?`<div class="muted" style="margin-top:7px">${b.note}</div>`:""}

  const monthlyDebtHtml=monthlyDebts.length?`
    <h2>Monthly debt payments</h2>
    <div class="note">These are monthly debt minimums, shown separately from household bills/subscriptions so the totals stay clear.</div>
    ${monthlyDebts.map(d=>`
      <div class="card">
        <div class="row">
          <div>
            <h3>${d.name}</h3>
            <div class="muted">${dueDayLabel(d.dueDay)} • ${paymentMethodForDebt(d)}</div>
          </div>
          <div class="big">${money(Math.min(Number(d.balance||0),Number(d.min||0)))}</div>
        </div>
      </div>`).join("")}`:"";

  const payHtml=payRows.map(r=>{
    const entries=[];

    (r.billItems||[]).forEach(b=>{
      const due=billDueDateInWindow(r.payDate,r.nextDate,b);
      entries.push({
        name:b.name,
        amount:Number(b.amount||0),
        due,
        type:"Monthly bill/subscription",
        method:paymentMethodForBill(b)
      });
    });

    (r.allocations||[]).filter(a=>a.type==="Required").forEach(a=>{
      const d=state.debts.find(x=>x.id===a.id);
      if(!d) return;
      if(d.category==="monthly"){
        const due=dueDateInWindow(r.payDate,r.nextDate,d.dueDay,state.firstPay);
        entries.push({
          name:d.name,
          amount:Number(a.amount||0),
          due,
          type:"Monthly debt minimum",
          method:paymentMethodForDebt(d)
        });
      }else if(d.id==="bellbal"){
        entries.push({
          name:d.name,
          amount:Number(a.amount||0),
          due:null,
          type:"Current Bell balance installment",
          method:paymentMethodForDebt(d)
        });
      }
    });

    // Show one-time items too, because some current subscription/bill cleanups
    // are handled from a specific paycheck even though they are not recurring.
    (r.oneTimeItems||[]).forEach(x=>{
      entries.push({
        name:x.name,
        amount:Number(x.amount||0),
        due:r.payDate,
        type:"One-time / cleanup",
        method:"Manual — Regular"
      });
    });

    entries.sort((a,b)=>(a.due||r.payDate).localeCompare(b.due||r.payDate));
    const total=entries.reduce((s,e)=>s+e.amount,0);

    return `<div class="card paycard">
      <div class="row">
        <div><div class="muted">Paycheck</div><h3>${fmtDate(r.payDate)}</h3></div>
        <div style="text-align:right"><div class="big">${money(total)}</div><div class="muted">bills/obligations shown</div></div>
      </div>
      ${entries.length?`
        <div class="alloc">
          ${entries.map(e=>`
            <span>
              <b>${e.name}</b>
              <div class="muted">${e.type}${e.due?` • due ${fmtDate(e.due)}`:""}<br>${e.method}</div>
            </span>
            <b>${money(e.amount)}</b>`).join("")}
        </div>`
      :'<div class="muted" style="margin-top:10px">No monthly/subscription bills or monthly debt minimums are assigned to this pay window.</div>'}
    </div>`;
  }).join("");

  document.getElementById("bills").innerHTML=`
    <h2>Bills & subscriptions</h2>
    <div class="note">This page is a reference view. It does not create extra payments — it shows what the existing plan already budgets and which paycheck covers each item.</div>
    ${recurring.some(b=>b.dueRule==="firstBusinessDay")?'<div class="note">Bank fees marked “first business day” are scheduled on the first Monday–Friday of the month. A bank holiday can shift the actual posting date; the paycheck allocation still keeps the money available.</div>':""}

        <div class="value">${money(recurringTotal)}</div>
        <div class="sub">${recurring.length} recurring item${recurring.length===1?"":"s"}</div>
      </div>
      <div class="card kpi">
        <div class="label">Monthly debt minimums</div>
        <div class="value">${money(monthlyDebtTotal)}</div>
        <div class="sub">Shown separately</div>
      </div>
    </div>

    <h2>Recurring monthly bills</h2>
    ${recurringHtml}
    ${monthlyDebtHtml}

    <h2>Which bills come from each pay?</h2>
    <div class="note">A bill appears under the paycheck whose 14-day window contains its due date. Automatic/manual status and the account used are shown beside each item.</div>
    ${payHtml}
  `;
}

function forecastPayoffDates(){
  const sim=simulate();
  const result={};
  (state.debts||[]).forEach(d=>{
    if(Number(d.balance||0)<=0.005){
      result[d.id]={date:null,label:"Paid"};
      return;
    }
    let found=null;
    for(const r of sim.rows){
      const b=(r.balances||[]).find(x=>x.id===d.id);
      if(b && Number(b.balance||0)<=0.005){
        found=r.payDate;
        break;
      }
    }
    result[d.id]=found?{date:found,label:fmtDate(found)}:{date:null,label:"Beyond current forecast"};
  });
  return result;
}

    return rank(a)-rank(b) || a.balance-b.balance || a.name.localeCompare(b.name);

  document.getElementById("debts").innerHTML=`<h2>Debt balances</h2>
    <div class="note"><b>Forecast payoff dates update automatically</b> as balances, interest, payments, and your debt reserve change. For now, <b>GoDay and SpeedyCash are the joint top-priority pair</b>. When at least ${money((state.pastDueMinMeaningful||300)*2)} is available, both receive at least ${money(state.pastDueMinMeaningful||300)}. If there is only enough for one meaningful payment, it goes to whichever of the two has the larger current balance. After both are cleared, the app returns to fastest payoff among the remaining past-due debts.</div>

        <div class="row" style="margin-top:9px"><span><b>Forecast payoff</b></span><b>${payoffDates[d.id]?.label||"Beyond current forecast"}</b></div>

        <div class="actions">

          <button class="btn secondary small" onclick="editDebt('${d.id}')">Edit</button>
        </div>
      </div>`
    }).join("")}`;
}

      ${state.bills.map(b=>`<div class="row" style="padding:8px 0;border-bottom:1px solid var(--line)"><div><b>${b.name}</b><div class="muted">${money(b.amount)} • due ${b.dueDay==='last'?'last day':`day ${b.dueDay}`} • ${paymentMethodForBill(b)}</div></div><button class="btn secondary small" onclick="editBill('${b.id}')">Edit</button></div>`).join("")}
    </details>

    <button class="btn danger" style="width:100%" onclick="resetApp()">Reset app completely</button>
  `;
  const el=document.getElementById("overrideList");
  el.innerHTML=Object.entries(state.payOverrides).sort().map(([d,o])=>`
    <div class="row" style="padding:8px 0;border-bottom:1px solid var(--line)">
      <div><b>${fmtDate(d)}</b><div class="muted">${o.note||""}</div></div>
      <button class="btn secondary small" onclick="addOverride('${d}')">Edit</button>
    </div>`).join("");
}

function renderAll(){
  normalizeState();
  save();
  if(!state.debts.length || !state.income){
    document.getElementById("home").innerHTML=`
      <div class="card" style="border:2px solid var(--blue)">
        <h2 style="margin-top:0">Set up your private plan</h2>
        <p>Your financial information is not built into this public app. Import your private plan file once on this device.</p>
        <label>Select <b>my_debt_freedom_plan.json</b></label>
        <input type="file" accept=".json,application/json" onchange="importBackup(event)">
        <div class="note good" style="margin-top:12px"><b>Privacy:</b> the imported plan is saved locally in this browser/web app. Do not upload the private JSON file to the public GitHub repository.</div>
      </div>`;
    ["paydays","bills","debts","funds","settings"].forEach(id=>document.getElementById(id).innerHTML='<div class="card"><p>Import your private plan from Home first.</p></div>');
    return;
  }
  renderHome(); renderPaydays(); renderBills(); renderDebts(); renderFunds(); renderSettings();
}

function recordPayment(id){
  const d=state.debts.find(x=>x.id===id); if(!d)return;
  const row=simulate().rows[0];
  if(row && row.allocations.some(a=>a.type==="Required"&&a.id===id)){
    if(!confirm(`${d.name} already has a scheduled payment in the current Home payday workflow.\n\nOnly continue here if this is an EXTRA payment or a correction. Otherwise use Home so the payment is not counted twice.`)) return;
  }
  const raw=prompt(`Payment to ${d.name}\nCurrent balance: ${money(d.balance)}\nEnter payment amount:`);
  if(raw===null)return;
  const amt=Math.max(0,Math.min(d.balance,Number(raw)||0));
  if(!amt)return;
  d.balance=cents(Math.max(0,d.balance-amt)); if(!activeBalance(d.balance)) d.balance=0;
  state.paymentHistory.push({date:isoLocal(new Date()),debtId:id,amount:amt,type:"manual"});
  if(Number(state.funds.debtReserve||0)>0 && confirm(`Did this payment use money from your Rent-account debt reserve?\n\nIf yes, the app will reduce the reserve by ${money(Math.min(amt,state.funds.debtReserve))}.`)){
    state.funds.debtReserve=Math.max(0,Number(state.funds.debtReserve||0)-amt);
  }
  save(); renderAll();
}
function editDebt(id){
  const d=state.debts.find(x=>x.id===id); if(!d)return;
  const bal=prompt(`${d.name} balance:`,d.balance); if(bal===null)return;
  const p=d.min!==undefined?prompt(`${d.name} regular payment:`,d.min):null;
  d.balance=Math.max(0,Number(bal)||0);
  if(p!==null)d.min=Math.max(0,Number(p)||0);
  if(d.balance>d.start)d.start=d.balance;
  save(); renderAll();
}

function editBill(id){
  const b=state.bills.find(x=>x.id===id); if(!b)return;
  const amount=prompt(`${b.name} amount:`,b.amount); if(amount===null)return;
  const due=prompt(`${b.name} due day (1-31 or last):`,b.dueDay); if(due===null)return;
  const start=prompt(`${b.name} next/start date (YYYY-MM-DD):`,b.start||state.firstPay); if(start===null)return;
  const auto=prompt(`Automatic payment? Enter yes or no:`,b.auto?"yes":"no"); if(auto===null)return;
  const account=prompt(`Account: regular or rent`,b.account||"regular"); if(account===null)return;
  const dueValue=String(due).trim().toLowerCase()==="last"?"last":Math.min(31,Math.max(1,Number(due)||1));
  b.amount=Math.max(0,Number(amount)||0); b.dueDay=dueValue; b.start=String(start).trim();
  b.auto=/^(y|yes|true|1)$/i.test(String(auto).trim()); b.account=String(account).trim().toLowerCase()==="rent"?"rent":"regular";
  save();renderAll();
}
function deferOneTime(id,payDate){
  const x=state.oneTimeItems.find(y=>y.id===id); if(!x)return;
  const next=addDays(payDate,state.payEveryDays);
  if(!confirm(`Move ${x.name} (${money(x.amount)}) to the ${fmtDate(next)} pay?`)) return;
  x.duePay=next; x.posted=false;
  save();renderAll();
}

function completePaydayStage(payDate){
  const row=simulate().rows[0];
  if(!row || row.payDate!==payDate) return;
  const spend=spendTransferFor(row), rentTransfer=paydayRentTransferFor(row);
  const dueToday=sameDayManualTotal(row);
  const msg=`Payday steps for ${fmtDate(payDate)}:\n\nScotia spending: ${money(spend)}\nRent account: ${money(rentTransfer)}${dueToday?`\nManual payment(s) due today: ${money(dueToday)}`:""}\n\nLeave everything else in Regular overnight.`;
  if(!confirm(msg)) return;
  const st=stageFor(payDate);
  st.paydayDone=true;
  st.sameDayManualDone=true;
  save();renderAll();
}
function calculateMorning(payDate){
  const input=document.getElementById("actualRegularInput");
  if(!input)return;
  const v=Number(input.value);
  if(!Number.isFinite(v)){alert("Enter the actual Regular-account balance after the overnight withdrawals.");return;}
  const row=simulate().rows[0];
  if(row && row.payDate===payDate){
    const expected=expectedRegularBalances(row).tomorrow;
    const delta=v-expected;
    if(delta>20 && !confirm(`Your Regular balance is ${money(delta)} HIGHER than the estimate.\n\nThat can mean an automatic withdrawal has not posted yet. Confirm every listed automatic debt payment is visible in your bank before continuing.\n\nContinue anyway?`)) return;
  }
  const st=stageFor(payDate);
  st.actualRegular=v;
  save();renderAll();
}
function completeMorningStage(payDate){
  const row=simulate().rows[0];
  const st=stageFor(payDate);
  if(!row || row.payDate!==payDate || st.actualRegular===null || st.actualRegular===undefined) return;
  const c=morningCalculation(row,st.actualRegular);
  if(c.requiredShortfall>0.005){
    if(c.criticalBillsShortfall>0.005) alert(`CRITICAL: you are ${money(c.criticalBillsShortfall)} short of the required bills/debt payments. Resolve this before completing the pay.`);
    else if(c.cleanupShortfall>0.005) alert(`Cleanup items are ${money(c.cleanupShortfall)} over what safely fits. Defer a nonessential cleanup item and recalculate.`);
    else alert(`Your Regular buffer would be ${money(c.bufferShortfall)} below the ${money(c.bufferTarget)} target. Restore the buffer and recalculate before completing this pay.`);
    return;
  }

  if(!confirm(`Finish ${fmtDate(payDate)}?\n\nManual required payments: ${money(c.oneTimesTotal+c.manualBillsTotal+c.manualDebtsTotal)}\nPlanned + emergency savings: ${money(c.planned+c.emergency)}\nMeaningful debt payments: ${money(c.picks.reduce((s,x)=>s+x.amount,0))}\nRegular buffer protected: ${money(state.regularBuffer||0)}`)) return;

  // Save undo snapshot.
  state.undoSnapshots=state.undoSnapshots||[];
  const snap=deep(state); snap.undoSnapshots=[];
  state.undoSnapshots.push(JSON.stringify(snap));
  if(state.undoSnapshots.length>5) state.undoSnapshots.shift();

  // Apply known fixed and estimated monthly interest once before this pay's debt activity.
  applyInterestForPay(state.debts,row.payDate,row.nextDate);

  // Apply automatic and manual required debt payments.
  [...autoDebtAllocationsFor(row),...manualDebtAllocationsFor(row)].forEach(a=>{
    const d=state.debts.find(x=>x.id===a.id);
    if(d){
      d.balance=cents(Math.max(0,d.balance-a.amount)); if(!activeBalance(d.balance)) d.balance=0;
      state.paymentHistory.push({date:payDate,debtId:d.id,amount:a.amount,type:"Required"});
    }
  });

  // Apply extra debt chunks.
  c.picks.forEach(a=>{
    const d=state.debts.find(x=>x.id===a.id);
    if(d){
      d.balance=cents(Math.max(0,d.balance-a.amount)); if(!activeBalance(d.balance)) d.balance=0;
      state.paymentHistory.push({date:payDate,debtId:d.id,amount:a.amount,type:"Extra"});
    }
  });

  // Mark one-time items paid, including uncertain charges confirmed as already posted.
  c.oneTimes.forEach(x=>{
    const orig=state.oneTimeItems.find(y=>y.id===x.id);
    if(orig) orig.paid=true;
    if(/^mom/i.test(String(x.id||'')) || /^mom$/i.test(String(x.name||'').trim())) state.funds.momPaid=(Number(state.funds.momPaid)||0)+Number(x.amount||0);
  });
  uncertainItemsForPay(payDate).filter(x=>x.posted).forEach(x=>{x.paid=true;});

  // Update protected savings allocations.
  state.funds.rent += Number(row.rentSave||0);
  state.funds.planned += c.planned;
  state.funds.emergency += c.emergency;
  state.funds.debtReserve = c.endingReserve;

  st.morningDone=true;
  state.processedPays.push(payDate);
  save();renderAll();
}

// Legacy function retained only for old cached buttons.
function applyPay(payDate){
  alert("This version uses the safer two-stage payday process. Open Home and complete Payday first, then Next Morning.");
}
function undoLastPay(){
  const stack=state.undoSnapshots||[];
  if(!stack.length){alert("There is no completed payday to undo.");return;}
  if(!confirm("Undo the most recently completed payday and restore the previous balances/funds?")) return;
  const raw=stack.pop();
  const restored=JSON.parse(raw);
  restored.undoSnapshots=stack;
  state=restored;
  save(); renderAll();
}
function saveFunds(){
  state.funds.rent=Math.max(0,Number(document.getElementById("fundRent").value)||0);
  state.funds.emergency=Math.max(0,Number(document.getElementById("fundEmergency").value)||0);
  state.funds.planned=Math.max(0,Number(document.getElementById("fundPlanned").value)||0);
  state.funds.debtReserve=Math.max(0,Number(document.getElementById("fundDebtReserve").value)||0);
  state.funds.momPaid=Math.max(0,Number(document.getElementById("fundMomPaid").value)||0);
  save(); renderAll();
}
function recordRentPaid(){
  const amt=Number(prompt("Rent payment to subtract from the rent fund:",state.rent));
  if(!amt || amt<0)return;
  if(amt>state.funds.rent && !confirm(`Your recorded rent fund is only ${money(state.funds.rent)}. Subtract ${money(amt)} anyway?`)) return;
  state.funds.rent=Math.max(0,state.funds.rent-amt);
  save();renderAll();
}

function saveSettings(){
  state.income=Math.max(0,Number(document.getElementById("sIncome").value)||0);
  state.rent=Math.max(0,Number(document.getElementById("sRent").value)||0);
  state.groceriesPerPay=Math.max(0,Number(document.getElementById("sGroceries").value)||0);
  state.gasPerPay=Math.max(0,Number(document.getElementById("sGas").value)||0);
  state.personalPerPay=Math.max(0,Number(document.getElementById("sPersonal").value)||0);
  state.plannedPerPay=Math.max(0,Number(document.getElementById("sPlanned").value)||0);
  state.emergencyPerPay=Math.max(0,Number(document.getElementById("sEmergency").value)||0);
  state.emergencyTarget=Math.max(0,Number(document.getElementById("sEmergencyTarget").value)||0);
  state.regularBuffer=Math.max(0,Number(document.getElementById("sRegularBuffer").value)||0);
  state.momOwed=Math.max(0,Number(document.getElementById("sMomOwed").value)||0);
  save(); renderAll();
}
function addOverride(existing){
  const d=existing||prompt("Pay date (YYYY-MM-DD):",state.firstPay); if(!d)return;
  const old=state.payOverrides[d]||{};
  const personal=prompt("Personal spending:",old.personal??state.personalPerPay); if(personal===null)return;
  const planned=prompt("Planned-expense savings:",old.planned??state.plannedPerPay); if(planned===null)return;
  const emergency=prompt("Emergency savings:",old.emergency??state.emergencyPerPay); if(emergency===null)return;
  const rent=prompt("Rent savings from this pay:",old.rent??rentContribution(d)); if(rent===null)return;
  const note=prompt("Note (optional):",old.note||"")??"";
  state.payOverrides[d]={personal:Math.max(0,Number(personal)||0),planned:Math.max(0,Number(planned)||0),emergency:Math.max(0,Number(emergency)||0),rent:Math.max(0,Number(rent)||0),note};
  save();renderAll();
}
function exportBackup(){
  const blob=new Blob([JSON.stringify(state,null,2)],{type:"application/json"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download="debt-freedom-backup.json"; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}
function applyPrivatePatch(incoming){
  if(!incoming || incoming.patchType!=="debt-freedom-plan-patch") return false;

  if(incoming.settings && typeof incoming.settings==="object"){
    Object.entries(incoming.settings).forEach(([k,v])=>{ state[k]=v; });
  }

  if(Array.isArray(incoming.debtUpdates)){
    incoming.debtUpdates.forEach(u=>{
      if(!u || !u.id) return;
      const d=state.debts.find(x=>x.id===u.id);
      if(!d) return;
      Object.entries(u).forEach(([k,v])=>{ if(k!=="id") d[k]=v; });
    });
  }

  if(Array.isArray(incoming.billUpserts)){
    incoming.billUpserts.forEach(u=>{
      if(!u || !u.id) return;
      const i=state.bills.findIndex(x=>x.id===u.id);
      if(i>=0) state.bills[i]=Object.assign({},state.bills[i],u);
      else state.bills.push(u);
    });
  }

  if(incoming.removeDebtPriorities){
    state.debts.forEach(d=>{
      delete d.priority;
      if(d.category==="overdue" && /priority/i.test(String(d.note||''))) d.note="Past due; no scheduled payment.";
    });
  }

  normalizeState(); save(); renderAll();
  alert("Your private app update was applied. Existing payment history and completed paydays were kept.");
  return true;
}
function importBackup(ev){
  const f=ev.target.files[0]; if(!f)return;
  const reader=new FileReader();
  reader.onload=()=>{try{
    const incoming=JSON.parse(reader.result);
    if(applyPrivatePatch(incoming)) return;
    if(!incoming || typeof incoming!=="object" || !Array.isArray(incoming.debts) || !Array.isArray(incoming.bills) || !Number.isFinite(Number(incoming.income)) || Number(incoming.income)<=0) throw new Error("Invalid plan");
    state=Object.assign(deep(defaultState),incoming);
    normalizeState();save();renderAll();alert("Your private budget plan is loaded on this device.");
  }catch(e){alert("Could not read that file. Make sure you selected a Debt Freedom backup, private plan, or private update JSON file.");}};
  reader.readAsText(f);
}
function resetApp(){
  if(!confirm("Reset the app completely? This removes the private plan, balances, payment history and saved progress from this device."))return;
  if(!confirm("Final confirmation: you will need to import your private plan or backup again. Continue?"))return;
  state=deep(defaultState);save();renderAll();
}

document.querySelectorAll(".tab").forEach(btn=>btn.addEventListener("click",()=>{
  document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));
  document.querySelectorAll(".panel").forEach(x=>x.classList.remove("active"));
  btn.classList.add("active");document.getElementById(btn.dataset.tab).classList.add("active");
}));

if("serviceWorker" in navigator && location.protocol!=="file:"){
  navigator.serviceWorker.register("service-worker.js",{updateViaCache:"none"}).catch(()=>{});
}
renderAll();
</script>
