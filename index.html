<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Debt Freedom">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Debt Freedom</title>
<style>
:root{
  --bg:#f8fafc; --card:#fff; --ink:#0f172a; --muted:#64748b; --line:#e2e8f0;
  --navy:#0f172a; --blue:#2563eb; --teal:#0f766e; --green:#15803d; --red:#b91c1c; --amber:#b45309;
  --softblue:#eff6ff; --softgreen:#f0fdf4; --softred:#fef2f2; --softamber:#fffbeb;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
header{position:sticky;top:0;z-index:20;background:rgba(15,23,42,.96);color:#fff;padding:16px 16px 12px}
header h1{font-size:21px;margin:0 0 4px} header p{font-size:12px;margin:0;color:#cbd5e1}
main{max-width:760px;margin:auto;padding:14px 14px 92px}
.tabs{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin:0 0 14px}
.tab{border:0;border-radius:12px;padding:10px 4px;font-size:11px;font-weight:700;background:#e2e8f0;color:#334155}
.tab.active{background:var(--navy);color:#fff}
.panel{display:none}.panel.active{display:block}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:10px;box-shadow:0 1px 2px rgba(15,23,42,.04)}
.kpi .label{font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.03em}
.kpi .value{font-size:23px;font-weight:800;margin-top:4px}
.kpi .sub{font-size:11px;color:var(--muted);margin-top:4px}
h2{font-size:17px;margin:18px 0 10px} h3{font-size:15px;margin:0 0 8px}
.badge{display:inline-block;border-radius:999px;padding:4px 8px;font-size:10px;font-weight:800}
.overdue{background:var(--softred);color:var(--red)}
.biweekly{background:var(--softblue);color:#1d4ed8}
.other{background:var(--softamber);color:var(--amber)}
.hoyes{background:var(--softgreen);color:var(--green)}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.muted{color:var(--muted);font-size:12px}
.big{font-size:19px;font-weight:800}
.progress{height:8px;border-radius:999px;background:#e2e8f0;overflow:hidden;margin-top:8px}
.progress>span{display:block;height:100%;background:var(--blue)}
button{font:inherit}
.btn{border:0;border-radius:10px;padding:10px 12px;font-weight:700;background:var(--navy);color:white}
.btn.secondary{background:#e2e8f0;color:#334155}.btn.danger{background:#fee2e2;color:#991b1b}
.btn.small{padding:7px 9px;font-size:12px}
input,select{width:100%;border:1px solid #cbd5e1;border-radius:10px;padding:10px;background:white;color:var(--ink);font-size:16px}
label{display:block;font-size:11px;color:var(--muted);font-weight:700;margin:0 0 5px}
.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
hr{border:0;border-top:1px solid var(--line);margin:12px 0}
.debt-card .actions{display:flex;gap:8px;margin-top:10px}
.paycard{border-left:4px solid var(--blue)}
.paycard.done{opacity:.6;border-left-color:var(--green)}
.alloc{font-size:12px;display:grid;grid-template-columns:1fr auto;gap:5px 12px;margin-top:10px}
.alloc b{font-variant-numeric:tabular-nums}
.note{background:var(--softblue);border:1px solid #bfdbfe;border-radius:12px;padding:11px;font-size:12px;line-height:1.4;margin-bottom:10px}
.warn{background:var(--softamber);border-color:#fde68a}
.good{background:var(--softgreen);border-color:#bbf7d0}
.footerbar{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);padding:8px 14px calc(8px + env(safe-area-inset-bottom));z-index:30}
.footerbar .inner{max-width:760px;margin:auto;display:flex;gap:8px}
.footerbar .btn{flex:1}
details summary{cursor:pointer;font-weight:700}
@media(max-width:420px){.grid{grid-template-columns:1fr 1fr}.tabs{gap:4px}.tab{font-size:10px;padding:9px 2px}.formgrid{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
  <h1>Debt Freedom <span style="font-size:11px;color:#cbd5e1;font-weight:700">v6.18.2</span></h1>
  <p>Payday → next morning • actual-balance safety check</p>
</header>

<main>
  <div class="tabs">
    <button class="tab active" data-tab="home">Home</button>
    <button class="tab" data-tab="paydays">Paydays</button>
    <button class="tab" data-tab="bills">Bills</button>
    <button class="tab" data-tab="debts">Debts</button>
    <button class="tab" data-tab="funds">Funds</button>
    <button class="tab" data-tab="settings">Settings</button>
  </div>

  <section id="home" class="panel active"></section>
  <section id="paydays" class="panel"></section>
  <section id="bills" class="panel"></section>
  <section id="debts" class="panel"></section>
  <section id="funds" class="panel"></section>
  <section id="settings" class="panel"></section>
</main>

<div class="footerbar">
  <div class="inner">
    <button class="btn secondary" onclick="exportBackup()">Export backup</button>
    <button class="btn" onclick="renderAll()">Refresh plan</button>
  </div>
</div>

<script>
const VERSION = 1;
const APP_VERSION = "6.18.2";
const money = n => new Intl.NumberFormat('en-CA',{style:'currency',currency:'CAD'}).format(Math.max(0,Number(n)||0));
const moneySigned = n => new Intl.NumberFormat('en-CA',{style:'currency',currency:'CAD'}).format(Number(n)||0);
const cents = n => Math.round((Number(n)||0)*100)/100;
const activeBalance = n => Number(n||0)>0.005;
function normalizeDebtBalance(d){
  d.balance=activeBalance(d.balance)?cents(Math.max(0,Number(d.balance)||0)):0;
  return d.balance;
}
const fmtDate = s => new Date(s+'T12:00:00').toLocaleDateString('en-CA',{month:'short',day:'numeric',year:'numeric'});
const iso = d => d.toISOString().slice(0,10);
const isoLocal = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const addDays = (s,n) => { const d=new Date(s+'T12:00:00'); d.setDate(d.getDate()+n); return iso(d); };
const firstOfMonth = s => { const d=new Date(s+'T12:00:00'); return new Date(d.getFullYear(),d.getMonth(),1,12); };
const daysInMonth = (y,m) => new Date(y,m+1,0).getDate();
const deep = x => JSON.parse(JSON.stringify(x));

const defaultState = {
  version: VERSION,
  income: 0,
  firstPay: "2026-09-10",
  payEveryDays: 14,
  rent: 0,
  groceriesPerPay: 0,
  gasPerPay: 0,
  personalPerPay: 0,
  personalTopUpPerPay: 100,
  plannedPerPay: 0,
  emergencyPerPay: 0,
  emergencyTarget: 0,
  plannedTarget: 0,
  funds: {rent:0, planned:0, emergency:0, momPaid:0},
  momOwed: 0,
  processedPays: [],
  payOverrides: {},
  bills: [],
  debts: [],
  paymentHistory: [],
  undoSnapshots: [],
  fundAdjustments: [],
  latestBankBalances: {regular:null,rent:null,scotia:null,updatedAt:null,phase:null},
  strategyPastDueFirst: true,
  strategyFinishFirst: true,
  momRepaymentEnabled: false,
  momGoalPerPay: 500,
  momMinMeaningful: 500,
  momPaymentHistory: [],
  billStatus: {},
  breeFacility: {maxAdvance:750,freeDelayDays:3,defaultRepayPays:2,expressFee:null,lastAdvance:null},
  breeAdvances: [],
  breeEmergencyOnly: true,
  lastForecastChange: null,
  creditCardLimit: 0,
  creditCardCycleGoal: 200,
  creditCardSafetyCushion: 20,
  creditCardStatement: {
    statementDate:null,
    dueDate:null,
    balanceAtUpdate:0,
    minimumDue:0,
    interestCharged:0,
    paidThisCycle:0,
    safetyFloorTotal:0,
    targetTotal:0,
    updatedAt:null
  },
  rentResponsibilityStart: "2026-11-01",
  housingRecovery: {rentShortfall:0,carShortfall:0,rentDueDate:null,carDueDate:null,lastExpectedRentAccount:null,lastActualRentAccount:null,lastReconciledAt:null,history:[]},
  lastBackupAt: null,
  lastBackupProcessedPays: 0
};

let state = load();

function load(){
  try{
    const raw=localStorage.getItem("debtFreedomState");
    return raw ? Object.assign(deep(defaultState),JSON.parse(raw)) : deep(defaultState);
  }catch(e){ return deep(defaultState); }
}
function save(){ localStorage.setItem("debtFreedomState",JSON.stringify(state)); }
function normalizeState(){
  state.funds=state.funds||{};
  ['rent','planned','emergency','debtReserve','momPaid'].forEach(k=>{
    state.funds[k]=Math.max(0,Number(state.funds[k])||0);
  });

  state.accounts=state.accounts||{
    regular:{name:"Regular account"},
    rent:{name:"Rent account"},
    scotia:{name:"Scotia spending account only"}
  };
  state.startingBalances=state.startingBalances||{regular:0,rent:0,scotia:0};
  state.regularBuffer=Math.max(0,Number(state.regularBuffer===undefined?200:state.regularBuffer)||0);
  state.personalPerPay=Math.max(0,Number(state.personalPerPay===undefined?250:state.personalPerPay)||0);
  state.personalTopUpPerPay=Math.max(0,Number(state.personalTopUpPerPay===undefined?100:state.personalTopUpPerPay)||0);
  // Debt-focus rule: no automatic Planned/Emergency contributions. Existing balances stay intact.
  state.plannedPerPay=0; state.emergencyPerPay=0; state.emergencyTarget=0; state.plannedTarget=0;
  state.oneTimeItems=Array.isArray(state.oneTimeItems)?state.oneTimeItems:[];
  state.oneTimeItems.forEach(x=>{
    x.amount=Math.max(0,Number(x.amount)||0);
    x.name=String(x.name||"One-time obligation").replace(/[<>]/g,"").slice(0,120);
    x.duePay=x.duePay||state.firstPay;
    x.dueDate=x.dueDate||x.duePay;
    x.paid=!!x.paid;
    x.userAdded=!!x.userAdded;
  });
  state.bills=Array.isArray(state.bills)?state.bills:[];
  state.debts=Array.isArray(state.debts)?state.debts:[];
  state.processedPays=Array.isArray(state.processedPays)?state.processedPays:[];
  state.paymentHistory=Array.isArray(state.paymentHistory)?state.paymentHistory:[];
  state.undoSnapshots=Array.isArray(state.undoSnapshots)?state.undoSnapshots:[];
  state.fundAdjustments=Array.isArray(state.fundAdjustments)?state.fundAdjustments:[];
  state.latestBankBalances=state.latestBankBalances&&typeof state.latestBankBalances==='object'
    ?state.latestBankBalances:{regular:null,rent:null,scotia:null,updatedAt:null,phase:null};
  state.payOverrides=state.payOverrides&&typeof state.payOverrides==='object'?state.payOverrides:{};
  Object.values(state.payOverrides).forEach(o=>{if(o&&typeof o==='object'){o.planned=0;o.emergency=0;if(o.personalTopUp===undefined)o.personalTopUp=state.personalTopUpPerPay;}});
  state.paydayStages=state.paydayStages&&typeof state.paydayStages==='object'?state.paydayStages:{};
  state.pastDueMinMeaningful=Math.max(0,Number(state.pastDueMinMeaningful===undefined?300:state.pastDueMinMeaningful)||300);
  // Core strategy rules are locked because the app relies on them throughout
  // the forecast: required obligations first, unresolved past dues before
  // ordinary extra debt, and finish an affordable balance before scattering
  // partial payments. They are no longer user-facing toggles.
  state.strategyPastDueFirst=true;
  state.strategyFinishFirst=true;
  state.momRepaymentEnabled=Math.max(0,Number(state.momOwed||0))>Number(state.funds?.momPaid||0)+0.005;
  state.momGoalPerPay=Math.max(0,Number(state.momGoalPerPay===undefined?500:state.momGoalPerPay)||500);
  state.momMinMeaningful=Math.max(0,Number(state.momMinMeaningful===undefined?500:state.momMinMeaningful)||500);
  state.momPaymentHistory=Array.isArray(state.momPaymentHistory)?state.momPaymentHistory:[];
  state.billStatus=state.billStatus&&typeof state.billStatus==="object"?state.billStatus:{};
  state.breeFacility=state.breeFacility&&typeof state.breeFacility==="object"?state.breeFacility:{maxAdvance:750,freeDelayDays:3,defaultRepayPays:2,expressFee:null,lastAdvance:null};
  state.breeFacility.maxAdvance=Math.max(0,Number(state.breeFacility.maxAdvance===undefined?750:state.breeFacility.maxAdvance)||750);
  state.breeFacility.freeDelayDays=Math.max(0,Number(state.breeFacility.freeDelayDays===undefined?3:state.breeFacility.freeDelayDays)||3);
  state.breeFacility.defaultRepayPays=[1,2].includes(Number(state.breeFacility.defaultRepayPays))?Number(state.breeFacility.defaultRepayPays):2;
  state.breeFacility.expressFee=(state.breeFacility.expressFee===null||state.breeFacility.expressFee===undefined||state.breeFacility.expressFee==="")?null:Math.max(0,Number(state.breeFacility.expressFee)||0);
  state.breeAdvances=Array.isArray(state.breeAdvances)?state.breeAdvances:[];
  state.breeAdvances.forEach(a=>{a.amount=Math.max(0,Number(a.amount)||0);a.fee=Math.max(0,Number(a.fee)||0);a.drawPay=a.drawPay||null;a.repayPay=a.repayPay||null;a.status=a.status||"active";});
  state.creditCardLimit=Math.max(0,Number(state.creditCardLimit)||0);
  state.creditCardCycleGoal=Math.max(0,Number(state.creditCardCycleGoal===undefined?200:state.creditCardCycleGoal)||200);
  state.creditCardSafetyCushion=Math.max(0,Number(state.creditCardSafetyCushion===undefined?20:state.creditCardSafetyCushion)||20);
  state.creditCardStatement=state.creditCardStatement&&typeof state.creditCardStatement==="object"
    ?state.creditCardStatement:{statementDate:null,dueDate:null,balanceAtUpdate:0,minimumDue:0,interestCharged:0,paidThisCycle:0,safetyFloorTotal:0,targetTotal:0,updatedAt:null};
  state.creditCardStatement.statementDate=state.creditCardStatement.statementDate||null;
  state.creditCardStatement.dueDate=state.creditCardStatement.dueDate||null;
  ["balanceAtUpdate","minimumDue","interestCharged","paidThisCycle","safetyFloorTotal","targetTotal"].forEach(k=>{
    state.creditCardStatement[k]=Math.max(0,Number(state.creditCardStatement[k])||0);
  });
  state.creditCardStatement.updatedAt=state.creditCardStatement.updatedAt||null;
  state.rentResponsibilityStart=state.rentResponsibilityStart||"2026-11-01";
  state.housingRecovery=state.housingRecovery&&typeof state.housingRecovery==="object"?state.housingRecovery:{rentShortfall:0,carShortfall:0,rentDueDate:null,carDueDate:null,lastExpectedRentAccount:null,lastActualRentAccount:null,lastReconciledAt:null,history:[]};
  state.housingRecovery.rentShortfall=Math.max(0,Number(state.housingRecovery.rentShortfall)||0);
  state.housingRecovery.carShortfall=Math.max(0,Number(state.housingRecovery.carShortfall)||0);
  state.housingRecovery.rentDueDate=state.housingRecovery.rentDueDate||null;
  state.housingRecovery.carDueDate=state.housingRecovery.carDueDate||null;
  state.housingRecovery.lastExpectedRentAccount=state.housingRecovery.lastExpectedRentAccount===null||state.housingRecovery.lastExpectedRentAccount===undefined?null:cents(state.housingRecovery.lastExpectedRentAccount);
  state.housingRecovery.lastActualRentAccount=state.housingRecovery.lastActualRentAccount===null||state.housingRecovery.lastActualRentAccount===undefined?null:cents(state.housingRecovery.lastActualRentAccount);
  state.housingRecovery.lastReconciledAt=state.housingRecovery.lastReconciledAt||null;
  state.housingRecovery.history=Array.isArray(state.housingRecovery.history)?state.housingRecovery.history:[];
  state.lastBackupAt=state.lastBackupAt||null;
  state.lastBackupProcessedPays=Math.max(0,Number(state.lastBackupProcessedPays)||0);
  state.plannedTarget=Math.max(0,Number(state.plannedTarget)||0);
  state.breeEmergencyOnly=true;
  state.lastForecastChange=state.lastForecastChange&&typeof state.lastForecastChange==="object"?state.lastForecastChange:null;

  state.bills.forEach(b=>{
    if(b.account===undefined) b.account=(b.id==="car"?"rent":"regular");
    if(b.auto===undefined) b.auto=(b.id==="car");
    b.amount=Math.max(0,Number(b.amount)||0);
  });
  state.debts.forEach(d=>{
    d.balance=cents(Math.max(0,Number(d.balance)||0));
    if(!activeBalance(d.balance)) d.balance=0;
    d.start=Math.max(d.balance,Number(d.start)||0);
    d.min=Math.max(0,Number(d.min)||0);
    if(d.interestPerPay!==undefined) d.interestPerPay=Math.max(0,Number(d.interestPerPay)||0);
    if(d.monthlyPeriodicRate!==undefined) d.monthlyPeriodicRate=Math.max(0,Number(d.monthlyPeriodicRate)||0);
    if(d.apr!==undefined) d.apr=Math.max(0,Number(d.apr)||0);
    if(d.autoPayment===undefined) d.autoPayment=(d.category==="biweekly" || d.category==="hoyes");
    if(d.paymentTiming===undefined) d.paymentTiming=d.autoPayment?"overnight":"manual";
    if(d.requiredSchedule && typeof d.requiredSchedule==="object"){
      Object.keys(d.requiredSchedule).forEach(k=>{d.requiredSchedule[k]=Math.max(0,Number(d.requiredSchedule[k])||0);});
    }
    if(d.requiredRecurring && typeof d.requiredRecurring==="object"){
      d.requiredRecurring.amount=Math.max(0,Number(d.requiredRecurring.amount)||0);
      d.requiredRecurring.everyDays=Math.max(1,Number(d.requiredRecurring.everyDays||state.payEveryDays||14));
      d.requiredRecurring.start=d.requiredRecurring.start||state.firstPay;
    }
    d.scheduleOnly=!!d.scheduleOnly;
    d.extraEligible=d.extraEligible===false?false:true;
    d.userAdded=!!d.userAdded;
    d.closedAt=d.closedAt||null;
    if(d.id==="speedy") d.escalationRisk=true;
    d.escalationRisk=!!d.escalationRisk;
    // Past-due debts no longer use hard-coded numeric priority numbers.
    delete d.priority;
    if(d.category==="overdue" && /priority/i.test(String(d.note||''))) d.note="Past due; no scheduled payment.";
  });

  // The current overdue ChatGPT charge is the September cycle. Do not budget a second September renewal.
  const cg=state.bills.find(b=>b.id==="chatgpt");
  if(cg && cg.start==="2026-09-19" && state.oneTimeItems.some(x=>x.id==="chatgptoverdue")) cg.start="2026-10-19";
}
normalizeState();

function dueInWindow(payDate,nextDate,dueDay,startDate){
  let start = new Date(payDate+'T12:00:00'), end = new Date(nextDate+'T12:00:00');
  let cur = new Date(start.getFullYear(),start.getMonth(),1,12);
  let finish = new Date(end.getFullYear(),end.getMonth(),1,12);
  const minStart = new Date(startDate+'T12:00:00');
  while(cur <= finish){
    const day = dueDay==="last" ? daysInMonth(cur.getFullYear(),cur.getMonth()) : Math.min(Number(dueDay),daysInMonth(cur.getFullYear(),cur.getMonth()));
    const due = new Date(cur.getFullYear(),cur.getMonth(),day,12);
    if(due >= minStart && due >= start && due < end) return true;
    cur = new Date(cur.getFullYear(),cur.getMonth()+1,1,12);
  }
  return false;
}

function dueDateInWindow(payDate,nextDate,dueDay,startDate){
  let start=new Date(payDate+'T12:00:00'), end=new Date(nextDate+'T12:00:00');
  let cur=new Date(start.getFullYear(),start.getMonth(),1,12);
  let finish=new Date(end.getFullYear(),end.getMonth(),1,12);
  const minStart=new Date((startDate||state.firstPay)+'T12:00:00');
  while(cur<=finish){
    const day=dueDay==="last"
      ? daysInMonth(cur.getFullYear(),cur.getMonth())
      : Math.min(Number(dueDay),daysInMonth(cur.getFullYear(),cur.getMonth()));
    const due=new Date(cur.getFullYear(),cur.getMonth(),day,12);
    if(due>=minStart && due>=start && due<end) return isoLocal(due);
    cur=new Date(cur.getFullYear(),cur.getMonth()+1,1,12);
  }
  return null;
}
function firstWeekdayOfMonth(year,month){
  const d=new Date(year,month,1,12);
  while(d.getDay()===0 || d.getDay()===6) d.setDate(d.getDate()+1);
  return d;
}
function billMonthlyDueDate(b,year,month){
  if(b.dueRule==="firstBusinessDay") return firstWeekdayOfMonth(year,month);
  const day=b.dueDay==="last"
    ? daysInMonth(year,month)
    : Math.min(Number(b.dueDay),daysInMonth(year,month));
  return new Date(year,month,day,12);
}
function billDueDateInWindow(payDate,nextDate,b){
  const start=new Date(payDate+'T12:00:00'), end=new Date(nextDate+'T12:00:00');
  let cur=new Date(start.getFullYear(),start.getMonth(),1,12);
  const finish=new Date(end.getFullYear(),end.getMonth(),1,12);
  const minStart=new Date((b.start||state.firstPay)+'T12:00:00');
  while(cur<=finish){
    const due=billMonthlyDueDate(b,cur.getFullYear(),cur.getMonth());
    if(due>=minStart && due>=start && due<end) return isoLocal(due);
    cur=new Date(cur.getFullYear(),cur.getMonth()+1,1,12);
  }
  return null;
}
function billDueInWindow(payDate,nextDate,b){
  return billDueDateInWindow(payDate,nextDate,b)!==null;
}
function billDueOnDate(date,b){
  return billDueInWindow(date,addDays(date,1),b);
}
function billDueLabel(b){
  if(b.dueRule==="firstBusinessDay") return "First business day of month";
  return dueDayLabel(b.dueDay);
}

function dueDayLabel(dueDay){
  if(dueDay==="last") return "Last day of month";
  const n=Number(dueDay);
  if(!Number.isFinite(n)) return "Monthly";
  const mod100=n%100;
  const suffix=(mod100>=11&&mod100<=13)?"th":({1:"st",2:"nd",3:"rd"}[n%10]||"th");
  return `${n}${suffix} of month`;
}

function payDatesInMonth(payDate){
  const d=new Date(payDate+'T12:00:00');
  const monthStart=new Date(d.getFullYear(),d.getMonth(),1,12);
  const monthEnd=new Date(d.getFullYear(),d.getMonth()+1,1,12);
  const first=new Date(state.firstPay+'T12:00:00');
  const interval=Math.max(1,Number(state.payEveryDays)||14);
  const dayMs=86400000;
  let idx=Math.floor((monthStart-first)/(interval*dayMs))-1;
  idx=Math.max(0,idx);
  const arr=[];
  for(let i=idx;i<idx+6;i++){
    const p=addDays(state.firstPay,i*interval), pd=new Date(p+'T12:00:00');
    if(pd>=monthStart && pd<monthEnd) arr.push(p);
    if(pd>=monthEnd) break;

function recalculateCreditCardTargets(){
  const cc=creditCardDebt();
  const s=state.creditCardStatement||{};
  if(!cc || !s.statementDate) return;

  const paid=Math.max(0,Number(s.paidThisCycle)||0);
  const limit=Math.max(0,Number(state.creditCardLimit)||0);
  const cushion=Math.max(0,Number(state.creditCardSafetyCushion)||0);
  const safeBalance=Math.max(0,limit-cushion);
  const estimate=Math.max(0,Number(s.interestCharged)||0);
  const currentBalance=Math.max(0,Number(cc.balance)||0);

  let safetyTotal=Math.max(0,Number(s.minimumDue)||0);
  if(limit>0){
    const remainingNeeded=Math.max(0,currentBalance+estimate-safeBalance);
    safetyTotal=Math.max(safetyTotal,roundUpStep(paid+remainingNeeded,10));
  }

  const maxPayable=cents(paid+currentBalance);
  safetyTotal=Math.min(maxPayable,safetyTotal);
  const targetTotal=Math.min(
    maxPayable,
    Math.max(Number(s.minimumDue)||0,safetyTotal,Math.max(0,Number(state.creditCardCycleGoal)||0))
  );

  s.safetyFloorTotal=cents(safetyTotal);
  s.targetTotal=cents(targetTotal);
}

function extraTargetOrder(debts){

  const add=id=>{

    if(d && !seen.has(d.id)){order.push(d);seen.add(d.id);}
  };
  // After all past-due balances are gone: known expensive debt first, then credit card.
  add("alterfina"); add("cc");
  debts.filter(d=>activeBalance(d.balance) && d.category!=="hoyes" && d.category!=="overdue" && !seen.has(d.id))
    .sort((a,b)=>a.balance-b.balance)

  return order;

function interestAdditionForPay(d,payDate,nextDate){
  if(!d || !activeBalance(d.balance)) return 0;
  let add=0;

  // Fixed amount added every pay cycle.
  if(Number(d.interestPerPay||0)>0) add += Number(d.interestPerPay||0);

  // Estimated monthly percentage interest.
  // Once a real credit-card statement is entered, future interest is estimated
  // on the statement day rather than the payment due day.
  const monthlyRate=Number(d.monthlyPeriodicRate||0);
  if(monthlyRate>0){
    if(d.id==="cc" && state.creditCardStatement?.statementDate){
      const stmtDay=new Date(state.creditCardStatement.statementDate+"T12:00:00").getDate();
      const nextStatement=creditCardNextStatementDate();
      if(nextStatement && dueInWindow(payDate,nextDate,stmtDay,nextStatement)){
        add += cents(Number(d.balance||0)*monthlyRate);
      }
    }else if(d.dueDay!==undefined){
      const startDate=d.interestStart || state.firstPay;
      if(dueInWindow(payDate,nextDate,d.dueDay,startDate)){
        add += cents(Number(d.balance||0)*monthlyRate);
      }
    }
  }
  return cents(add);
}
function applyInterestForPay(debts,payDate,nextDate){
  debts.forEach(d=>{
    const add=interestAdditionForPay(d,payDate,nextDate);
    if(add>0) d.balance=cents(Number(d.balance||0)+add);
  });

function agreementPaymentForWindow(d,payDate,nextDate){
  if(!d) return 0;
  let total=0;
  if(d.requiredSchedule && typeof d.requiredSchedule==="object"){
    Object.entries(d.requiredSchedule).forEach(([due,amount])=>{
      if(String(due)>=String(payDate) && String(due)<String(nextDate)) total+=Math.max(0,Number(amount)||0);
    });
  }
  const recur=d.requiredRecurring;
  if(recur && recur.start && Number(recur.amount||0)>0){
    const every=Math.max(1,Number(recur.everyDays||state.payEveryDays||14));
    let due=new Date(String(recur.start)+'T12:00:00');
    const from=new Date(String(payDate)+'T12:00:00');
    const to=new Date(String(nextDate)+'T12:00:00');
    if(due<from){
      const diff=Math.floor((from-due)/86400000);
      const jumps=Math.floor(diff/every);
      due.setDate(due.getDate()+jumps*every);
      while(due<from) due.setDate(due.getDate()+every);
    }
    while(due<to){
      if(due>=from) total+=Math.max(0,Number(recur.amount)||0);
      due.setDate(due.getDate()+every);
    }
  }
  return cents(total);
}
function agreementPaymentForDate(d,payDate){

}
function requiredDebtPaymentFor(d,payDate,nextDate,i,ccPaidSoFar){
  // Custom schedules can use actual due dates. Every payment whose due date
  // falls before the next paycheck is funded from the current paycheck.
  const agreementDue=agreementPaymentForWindow(d,payDate,nextDate);
  if(agreementDue>0 || (d.scheduleOnly && (d.requiredSchedule||d.requiredRecurring))) return agreementDue;
  if(d.category==='biweekly') return (payDate===state.firstPay && d.firstPay) ? Number(d.firstPay) : Number(d.min||0);
  if(d.category==='hoyes') return Number(d.min||0);
  if(d.id==="cc" && state.creditCardStatement?.statementDate){
    const s=state.creditCardStatement;
    const cycleEnd=creditCardNextStatementDate();
    const paid=Math.max(0,Number(ccPaidSoFar===undefined?s.paidThisCycle:ccPaidSoFar)||0);

    if(cycleEnd && payDate>=s.statementDate && payDate<cycleEnd && paid+0.005<Number(s.minimumDue||0)){
      return cents(Math.max(0,Number(s.minimumDue||0)-paid));
    }
    if(s.dueDate && s.dueDate>=payDate && s.dueDate<nextDate) return 0;
  }
  if(d.category==='monthly' && dueInWindow(payDate,nextDate,d.dueDay,state.firstPay)) return Number(d.min||0);
  return 0;
}

function breeBridgeAdvice(sim,rowIndex){

function preSavingsPriorityCashNeed(totalFlexible, existingReserve, debtsSnapshot, momPaidSoFar, payDate, ccPaidSoFar){

  let projectedCcPaid=Math.max(0,Number(ccPaidSoFar===undefined?state.creditCardStatement?.paidThisCycle:ccPaidSoFar)||0);

    const targets=creditCardCycleTargets(projectedCcPaid);
    const amt=cents(Math.min(left,Math.max(0,Number(targets.safetyRemaining||0)),Math.max(0,Number(d?.balance||0))));

  // amount is allowed when the full target does not fit; Bree/Debt Reserve are
  // never used to make a Mom payment.
  if(state.momRepaymentEnabled && left>0.005){

      // themselves still fit. A critical same-day hard-obligation shortage is
      // not auto-projected because it may require Express and an unknown fee.
      const needed=cents(Math.max(0,Number(r.essentialCashShortfall||0)));

function accountBillsTotal(r,account){

function accountTotalsForPay(r){

  const autoDebts=r.allocations.filter(a=>a.type==="Required").filter(a=>{

function payIndexForDate(payDate){
  return Math.round((new Date(payDate+"T12:00:00")-new Date(state.firstPay+"T12:00:00"))/(state.payEveryDays*86400000));
}
function stageFor(payDate){
  state.paydayStages=state.paydayStages||{};
  if(!state.paydayStages[payDate]) state.paydayStages[payDate]={
    paydayDone:false,morningDone:false,actualRegular:null,
    preRegular:null,preRent:null,preScotia:null,
    precheckSaved:false,sameDayAutoConfirmed:false,
    paidOccurrences:{},prePaidOccurrences:{},rentReconcileBase:null,rentReconciliation:null
  };
  const st=state.paydayStages[payDate];
  if(st.preRegular===undefined) st.preRegular=null;
  if(st.preRent===undefined) st.preRent=null;
  if(st.preScotia===undefined) st.preScotia=null;
  if(st.precheckSaved===undefined) st.precheckSaved=false;
  if(st.sameDayAutoConfirmed===undefined) st.sameDayAutoConfirmed=false;
  if(!st.paidOccurrences || typeof st.paidOccurrences!=="object") st.paidOccurrences={};
  if(!st.prePaidOccurrences || typeof st.prePaidOccurrences!=="object") st.prePaidOccurrences={};
  if(st.rentReconcileBase===undefined) st.rentReconcileBase=null;
  if(st.rentReconciliation===undefined) st.rentReconciliation=null;
  return st;
}

function occurrenceKey(kind,id){ return `${kind}:${id}`; }

function occurrenceAlreadyPaid(payDate,kind,id){

function toggleOccurrenceAlreadyPaid(payDate,kind,id){

function pendingBill(row,b){

function sameDayAutomaticOccurrenceItems(row){

function setAllSameDayAutomaticPosted(payDate,posted){

function currentPayObligations(row){

    <div class="muted" style="margin-top:8px"><b>Important:</b> for a required debt payment, do not also manually reduce the debt balance in the Debts tab. The app will record the payment when this payday is completed.</div>

function isFirstUnprocessedPay(payDate){
  const i=payIndexForDate(payDate);
  for(let x=0;x<i;x++){
    const d=addDays(state.firstPay,x*state.payEveryDays);
    if(!state.processedPays.includes(d)) return false;
  }
  return true;
}
function billsForAccount(row,account){

function billsTotalForAccount(row,account){

}
function spendTransferFor(row){

}
function carDueFor(row){

function rentTopupFor(row){

function firstPayRegularDeficit(row){

}
function paydayRentTransferFor(row){

function dueOneTimeItems(payDate){

function sameDayAutomaticBillsFor(row){
  return row.billItems.filter(b=>b.auto && b.account==="regular" && billDueOnDate(row.payDate,b));

function sameDayAutomaticBillsTotal(row){
  return sameDayAutomaticBillsFor(row).reduce((s,b)=>s+Number(b.amount||0),0);

function regularAutomaticBillsLater(row){
  // Biweekly debt autopays are expected overnight; this is for other automatic bills
  // that still need to remain in Regular until their later due date.
  const morning=new Date(row.payDate+"T12:00:00"); morning.setDate(morning.getDate()+1);
  return row.billItems.filter(b=>{
    if(!b.auto || b.account!=="regular") return false;
    const due=billDueDateInWindow(row.payDate,row.nextDate,b);

  });

function sameDayManualBillsFor(row){

function manualBillsFor(row){

function autoDebtAllocationsFor(row){

function sameDayAutoDebtAllocationsFor(row){

function sameDayManualDebtAllocationsFor(row){

function manualDebtAllocationsForMorning(row){
  const st=stageFor(row.payDate);
  if(!st.sameDayManualDone) return manualDebtAllocationsFor(row);
  const same=new Set(sameDayManualDebtAllocationsFor(row).map(a=>a.id));
  return manualDebtAllocationsFor(row).filter(a=>!same.has(a.id));

function sameDayManualTotal(row){
  return sameDayManualBillsFor(row).reduce((s,b)=>s+Number(b.amount||0),0)+sameDayManualDebtAllocationsFor(row).reduce((s,a)=>s+Number(a.amount||0),0);
}
function sameDayAutoDebtTotal(row){
  return sameDayAutoDebtAllocationsFor(row).reduce((s,a)=>s+Number(a.amount||0),0);
}
function knownCostScore(d){
  if(!d || !activeBalance(d.balance) || d.category==="hoyes" || d.id==="goday" || d.id==="speedy" || d.extraEligible===false) return 0;
  const bal=Math.max(0.01,Number(d.balance)||0.01);
  let score=0;

  // Approximate cost over one pay period so unlike cost structures can be compared.
  // Alterfina's fixed charge is measured directly against its current balance.
  if(Number(d.interestPerPay||0)>0){
    score=Math.max(score,Number(d.interestPerPay||0)/bal);
  }
  if(Number(d.monthlyPeriodicRate||0)>0){
    score=Math.max(score,Number(d.monthlyPeriodicRate||0)*(Math.max(1,Number(state.payEveryDays||14))/30.4375));
  }else if(Number(d.apr||0)>0){
    score=Math.max(score,Number(d.apr||0)*(Math.max(1,Number(state.payEveryDays||14))/365));
  }
  return score;
}
function bestFinancialDebt(debts){
  return (debts||[])
    .filter(d=>knownCostScore(d)>0)
    .sort((a,b)=>knownCostScore(b)-knownCostScore(a) || Number(b.balance)-Number(a.balance))[0] || null;
}
function unresolvedPastDueDebts(debts){
  return (debts||[])
    .filter(d=>d.category==="overdue" && d.id!=="goday" && activeBalance(d.balance));
}
function choosePastDueTarget(debts,amount){
  const overdue=unresolvedPastDueDebts(debts);
  if(!overdue.length) return null;

  // Dynamic selection, not a fixed creditor order:
  // first use a share to completely close an account if possible.
  const closable=overdue
    .filter(d=>Number(d.balance)<=Number(amount)+0.005)
    .sort((a,b)=>Number(a.balance)-Number(b.balance) || String(a.name).localeCompare(String(b.name)));
  if(closable.length) return closable[0];

  // Otherwise make the meaningful chunk where it moves an unresolved account
  // closest to being eliminated. Recalculated every payday.
  return overdue
    .slice()
    .sort((a,b)=>Number(a.balance)-Number(b.balance) || String(a.name).localeCompare(String(b.name)))[0] || null;
}
function allocateExtraStrategy(pool, debtsSnapshot){
  let available=cents(Math.max(0,Number(pool)||0)), picks=[];
  const minMeaningful=Math.max(0,Number(state.pastDueMinMeaningful||300));

  const addPick=(d,amt,reason,chunk=false)=>{
    if(!d || !activeBalance(d.balance)) return 0;
    amt=cents(Math.max(0,Math.min(Number(amt)||0,Number(d.balance)||0,available)));
    if(amt<=0.005) return 0;
    picks.push({id:d.id,name:d.name,amount:amt,chunk:!!chunk,reason:reason||""});
    d.balance=cents(Math.max(0,Number(d.balance)-amt));
    if(!activeBalance(d.balance)) d.balance=0;
    available=cents(Math.max(0,available-amt));
    return amt;
  };

  const pastDue=()=>unresolvedPastDueDebts(debtsSnapshot);

  // While unresolved past dues exist, they are the exclusive destination for
  // EXTRA debt money. A past-due account explicitly marked as escalation risk
  // is treated as a priority even when its known interest rate is zero/unknown.
  if(state.strategyPastDueFirst && pastDue().length){
    const escalation=()=>pastDue().filter(d=>d.escalationRisk);
    if(escalation().length){
      while(available>0.005 && escalation().length){
        const target=escalation().slice().sort((a,b)=>Number(a.balance)-Number(b.balance)||String(a.name).localeCompare(String(b.name)))[0];
        if(!target) break;
        const canClose=Number(target.balance)<=available+0.005;
        if(!canClose && available+0.005<minMeaningful) break;
        addPick(target,Math.min(available,Number(target.balance)),canClose?"Past-due escalation priority — payoff":"Past-due escalation priority — meaningful payment",true);
        if(!canClose) break;
      }
      // If an escalation-risk debt is still open, do not leapfrog it. If it
      // was fully cleared and money remains, continue the same payday through
      // the normal past-due waterfall instead of parking the remainder for a
      // full extra pay cycle in Debt Reserve.
      if(escalation().length){
        return {picks,unused:available,used:cents(Math.max(0,(Number(pool)||0)-available))};
      }
    }
    if(state.strategyFinishFirst){
      while(available>0.005){
        const closable=pastDue()
          .filter(d=>Number(d.balance)<=available+0.005)
          .sort((a,b)=>Number(a.balance)-Number(b.balance) || String(a.name).localeCompare(String(b.name)))[0] || null;
        if(!closable) break;
        addPick(closable,Number(closable.balance),"Past-due priority — payoff first",true);
      }
    }

    while(available+0.005>=minMeaningful && pastDue().length){
      const target=choosePastDueTarget(debtsSnapshot,available);
      if(!target) break;

      const amt=Math.min(available,Number(target.balance));
      if(amt+0.005<minMeaningful && Number(target.balance)>amt+0.005) break;

      addPick(target,amt,
        Number(target.balance)<=amt+0.005
          ?"Past-due priority — payoff"
          :"Past-due priority — concentrated meaningful payment",
        true);

      // Avoid scattering across many partial creditors. Continue only if the
      // next amount can either close an account or still be meaningful.
      if(available+0.005<minMeaningful){
        const closable=pastDue().some(d=>Number(d.balance)<=available+0.005);
        if(!closable) break;
      }
    }

    return {picks,unused:available,used:cents(Math.max(0,(Number(pool)||0)-available))};
  }

  // No unresolved past-due priority remains: accelerate remaining debts using
  // the same finish-first / meaningful-chunk discipline.
  const eligible=()=>extraTargetOrder(debtsSnapshot)
    .filter(d=>d.id!=="goday" && d.category!=="hoyes" && activeBalance(d.balance));

  if(state.strategyFinishFirst){
    while(available>0.005){
      const closable=eligible()
        .filter(d=>Number(d.balance)<=available+0.005)
        .sort((a,b)=>Number(a.balance)-Number(b.balance) || String(a.name).localeCompare(String(b.name)))[0] || null;
      if(!closable) break;
      addPick(closable,Number(closable.balance),"Debt acceleration — payoff first",true);
    }
  }

  if(available+0.005>=minMeaningful){
    const target=bestFinancialDebt(debtsSnapshot) || eligible()[0] || null;
    if(target){
      addPick(target,Math.min(available,Number(target.balance)),
        "Debt acceleration — concentrated meaningful payment",true);
    }
  }

  return {picks,unused:available,used:cents(Math.max(0,(Number(pool)||0)-available))};
}


function remainingMomOwed(momPaidSoFar){
  const owed=Math.max(0,Number(state.momOwed||0));
  if(owed<=0) return Infinity; // optional total not entered: toggle controls payments
  return Math.max(0,cents(owed-Number(momPaidSoFar||0)));
}

function momPaymentFromToday(availableToday, hasPastDue, momPaidSoFar){
  if(!state.momRepaymentEnabled) return {amount:0,reason:"Nothing is currently owed to Mom."};

  const available=cents(Math.max(0,Number(availableToday)||0));
  const goal=Math.max(0,Number(state.momGoalPerPay||500));
  const remaining=remainingMomOwed(momPaidSoFar);

  if(remaining<=0.005) return {amount:0,reason:"Recorded amount owed to Mom has been fully repaid."};
  if(available<=0.005) return {amount:0,reason:"No safe current-pay cash is available after higher-priority required obligations."};

  const candidate=cents(Math.min(goal,available,remaining));
  if(candidate<=0.005) return {amount:0,reason:"No safe Mom payment is available this pay."};

  return {
    amount:candidate,
    reason:candidate+0.005>=Math.min(goal,remaining)
      ?`Mom priority target met for this pay: ${money(candidate)}.`
      :`Partial Mom payment: ${money(candidate)} safely fits toward the ${money(Math.min(goal,remaining))} target.`
  };
}

function planPostRequiredMoney(todayFree, existingReserve, debtsSnapshot, momPaidSoFar, payDate, ccPaidSoFar, personalTopUpWanted=0){
  let today=cents(Math.max(0,Number(todayFree)||0));
  let reserve=cents(Math.max(0,Number(existingReserve)||0));
  let picks=[];
  let todayUsed=0, reserveUsed=0;
  let ccPriorityPayment=0, ccOptionalPayment=0;
  let projectedCcPaid=Math.max(0,Number(ccPaidSoFar===undefined?state.creditCardStatement?.paidThisCycle:ccPaidSoFar)||0);

  const directCardPick=(amount,reason,kind)=>{
    const d=creditCardDebt(debtsSnapshot);
    if(!d || !activeBalance(d.balance) || !creditCardCycleOpenOn(payDate)) return 0;
    amount=cents(Math.max(0,Math.min(Number(amount)||0,Number(d.balance)||0,today)));
    if(amount<=0.005) return 0;

    today=cents(Math.max(0,today-amount));
    todayUsed=cents(todayUsed+amount);
    d.balance=cents(Math.max(0,Number(d.balance)-amount));
    if(!activeBalance(d.balance)) d.balance=0;
    projectedCcPaid=cents(projectedCcPaid+amount);
    picks.push({id:d.id,name:d.name,amount,chunk:false,reason,kind});
    if(kind==="ccProtectionPriority") ccPriorityPayment=cents(ccPriorityPayment+amount);
    else ccOptionalPayment=cents(ccOptionalPayment+amount);
    return amount;
  };

  // Current-pay cash only; never use Debt Reserve for this.
  if(creditCardCycleOpenOn(payDate)){
    const targets=creditCardCycleTargets(projectedCcPaid);
    if(targets.safetyRemaining>0.005){
      directCardPick(
        targets.safetyRemaining,
        "Credit-limit protection — enough to keep the next similar interest charge from pushing the card back over its limit.",
        "ccProtectionPriority"
      );
    }
  }

  const directDebtPick=(d,amount,reason)=>{
    amount=cents(Math.max(0,Math.min(Number(amount)||0,Number(d?.balance)||0,today+reserve)));
    if(!d || amount<=0.005) return 0;

    const fromReserve=Math.min(reserve,amount);
    reserve=cents(reserve-fromReserve);
    const fromToday=cents(amount-fromReserve);
    today=cents(Math.max(0,today-fromToday));

    reserveUsed=cents(reserveUsed+fromReserve);
    todayUsed=cents(todayUsed+fromToday);

    d.balance=cents(Math.max(0,Number(d.balance)-amount));
    if(!activeBalance(d.balance)) d.balance=0;

  const hasPastDue=state.strategyPastDueFirst && unresolvedPastDueDebts(debtsSnapshot).length>0;
  const mom=momPaymentFromToday(today,hasPastDue,momPaidSoFar);
  const momPayment=cents(mom.amount||0);
  today=cents(Math.max(0,today-momPayment));
  todayUsed=cents(todayUsed+momPayment);

  // Optional personal top-up is lower priority than Mom and uses current-pay cash only.
  const topUpGoal=Math.max(0,Number(personalTopUpWanted)||0);

  const chosen=chooseDebtChunks(cents(today+reserve),debtsSnapshot);

  const chosenReserve=Math.max(0,cents(Number(chosen.used||0)-chosenToday));

  todayUsed=cents(todayUsed+chosenToday);

        Math.min(today,targets.targetRemaining),

        "ccProtectionOptional"
      );
    }
  }

  const newReserveFromToday=today;
  const endingReserve=cents(reserve+newReserveFromToday);

  return {
    momPayment,
    momReason:mom.reason||"",
    personalTopUp,
    personalTopUpWanted:topUpGoal,
    picks,
    todayUsed,
    reserveUsed,
    ccPriorityPayment,
    ccOptionalPayment,
    ccProtectionTotal:cents(ccPriorityPayment+ccOptionalPayment),
    ccPaidAfter:projectedCcPaid,

function morningCalculation(row, actualRegular){
  const autoDebts=(autoDebtAllocationsFor(row)||[]).filter(a=>pendingDebtAllocation(row,a));
  const autoDebtsTotal=cents(autoDebts.reduce((s,a)=>s+Number(a.amount||0),0));
  const autoBills=(row.billItems||[]).filter(b=>b.auto&&b.account==="regular"&&pendingBill(row,b));

  const manualBills=pendingManualBillsFor(row);
  const manualBillsTotal=manualBills.reduce((s,b)=>s+Number(b.amount||0),0);
  const manualDebts=pendingManualDebtAllocationsForMorning(row);
  const manualDebtsTotal=manualDebts.reduce((s,a)=>s+Number(a.amount||0),0);
  const oneTimes=dueOneTimeItems(row.payDate);
  const oneTimesTotal=oneTimes.reduce((s,x)=>s+Number(x.amount||0),0);

  const plannedWanted=Math.max(0,Number(row.planned||0));
  let emergencyWanted=Math.max(0,Number(row.emergency||0));
  if(Number(state.emergencyTarget||0)>0) emergencyWanted=Math.min(emergencyWanted,Math.max(0,Number(state.emergencyTarget)-Number(state.funds.emergency||0)));

  const overnightBufferTarget=Number(state.regularBuffer||0);
  const housingRecoveryTotalForPay=cents(Math.max(0,Number(row.housingRecoveryTotal||0)));
  const rentRecovery=cents(Math.max(0,Number(row.rentRecovery||0)));
  const carRecovery=cents(Math.max(0,Number(row.carRecovery||0)));
  const housingRecoveryBufferUse=cents(Math.max(0,Number(row.housingRecoveryBufferUse||0)));
  const coreRequired=housingRecoveryTotalForPay+autoDebtsTotal+autoBillsTotal+manualBillsTotal+manualDebtsTotal;
  const cleanupTotal=oneTimesTotal;
  const protectedRegular=cents(autoDebtsTotal+autoBillsTotal);
  const requiredTotal=coreRequired+cleanupTotal;

  const criticalBillsShortfall=Math.max(0,coreRequired-Number(actualRegular));
  const cleanupShortfall=criticalBillsShortfall>0.005?0:Math.max(0,requiredTotal-Number(actualRegular));
  const bufferShortfall=0;
  const requiredShortfall=Math.max(criticalBillsShortfall,cleanupShortfall);

  const rawAvailableAfterRequired=Math.max(0,cents(Number(actualRegular)-requiredTotal));
  const desiredSavings=plannedWanted+emergencyWanted;
  const scale=desiredSavings>0?Math.min(1,rawAvailableAfterRequired/desiredSavings):0;

  if(planned+emergency>rawAvailableAfterRequired) emergency=Math.max(0,cents(rawAvailableAfterRequired-planned));

  const afterSavings=Math.max(0,cents(rawAvailableAfterRequired-planned-emergency));

  // Use at most the amount the $3,600 forecast intentionally made available

  // unallocated wiggle room for discrepancies/unknown bills.

  const unallocatedActualCushion=cents(Math.max(0,afterSavings-allocatableAfterOvernight));

  const availableAfterRequired=afterSavings;
  const todayFree=requiredShortfall>0?0:allocatableAfterOvernight;
  const existingReserve=Number(state.funds.debtReserve||0);

  const snap=debtSnapshotAfterRequired(row);
  const ccRequiredThisPay=(row.allocations||[]).filter(a=>a.type==="Required"&&a.id==="cc").reduce((s,a)=>s+Number(a.amount||0),0);
  const ccPaidForPlan=creditCardCycleOpenOn(row.payDate)?cents(Number(state.creditCardStatement?.paidThisCycle||0)+ccRequiredThisPay):Number(state.creditCardStatement?.paidThisCycle||0);
  const plan=requiredShortfall>0
    ? {momPayment:0,momReason:"Required obligations are short.",personalTopUp:0,personalTopUpWanted:Number(row.personalTopUpWanted||state.personalTopUpPerPay||0),picks:[],todayUsed:0,reserveUsed:0,ccPriorityPayment:0,ccOptionalPayment:0,ccProtectionTotal:0,ccPaidAfter:ccPaidForPlan,newReserveFromToday:0,endingReserve:existingReserve}

    autoLater:autoBills,autoLaterTotal:autoBillsTotal,manualBills,manualBillsTotal,manualDebts,manualDebtsTotal,
    housingRecoveryTotal:housingRecoveryTotalForPay,rentRecovery,carRecovery,housingRecoveryBufferUse,
    oneTimes,oneTimesTotal,plannedWanted,emergencyWanted,planned,emergency,savingsReduced,
    bufferTarget:overnightBufferTarget,overnightBufferTarget,releasedBuffer,rawAvailableAfterRequired,
    modeledPostPool,allocatableAfterOvernight,unallocatedActualCushion,
    coreRequired,cleanupTotal,protectedRegular,requiredTotal,requiredShortfall,
    criticalBillsShortfall,cleanupShortfall,bufferShortfall,availableAfterRequired,todayFree,
    existingReserve,momPayment:plan.momPayment,momReason:plan.momReason,personalTopUp:plan.personalTopUp||0,personalTopUpWanted:plan.personalTopUpWanted||Number(row.personalTopUpWanted||0),
    ccPriorityPayment:plan.ccPriorityPayment||0,ccOptionalPayment:plan.ccOptionalPayment||0,ccProtectionTotal:plan.ccProtectionTotal||0,

function forecastSnapshot(){
  const sim=simulate();
  const rows=(sim.rows||[]).slice(0,6);
  return {
    mom:cents(rows.reduce((s,r)=>s+Number(r.momPayment||0),0)),
    extra:cents(rows.reduce((s,r)=>s+Number(r.extraUsed||0),0)),
    reserve:cents(rows.length?Number(rows[rows.length-1].debtReserveEnd||0):Number(state.funds.debtReserve||0))
  };
}
function rememberForecastChange(before,label){
  if(!before) return;
  const after=forecastSnapshot();
  const delta=cents((after.mom+after.extra)-(before.mom+before.extra));
  const reserveDelta=cents(after.reserve-before.reserve);
  if(Math.abs(delta)>=100 || Math.abs(reserveDelta)>=100){
    state.lastForecastChange={when:new Date().toLocaleString(),label:String(label||"Plan change"),before,after,delta,reserveDelta};
  }else state.lastForecastChange=null;
}
function renderForecastChangeNotice(){
  const n=state.lastForecastChange;if(!n)return "";
  const dir=n.delta>=0?"increased":"decreased";
  const reserveDir=n.reserveDelta>=0?"increased":"decreased";
  return `<div class="note warn"><b>Forecast changed after ${n.label}:</b> Mom + extra-debt transfers across the next 6 forecast pays ${dir} by <b>${money(Math.abs(n.delta))}</b>. Ending Debt Reserve ${reserveDir} by <b>${money(Math.abs(n.reserveDelta))}</b>. No money is hidden — review Paydays to see the new destinations.</div>`;
}

function forecastPayoffDates(){
  const sim=simulate();
  const result={};
  (state.debts||[]).forEach(d=>{
    if(Number(d.balance||0)<=0.005){
      result[d.id]={date:null,label:"Paid"};
      return;
    }
    let found=null;
    for(const r of sim.rows){
      const b=(r.balances||[]).find(x=>x.id===d.id);
      if(b && Number(b.balance||0)<=0.005){
        found=r.payDate;
        break;
      }
    }
    result[d.id]=found?{date:found,label:fmtDate(found)}:{date:null,label:"Beyond current forecast"};
  });
  return result;
}


function cleanText(v,max=120){ return String(v==null?"":v).replace(/[<>]/g,"").trim().slice(0,max); }
function yesValue(v,defaultValue=false){
  const t=String(v==null?"":v).trim().toLowerCase();
  if(!t) return !!defaultValue;
  return /^(y|yes|true|1)$/i.test(t);
}
function uniqueItemId(prefix){
  const base=cleanText(prefix||"item",30).toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"")||"item";
  let id=`user-${base}`,n=2;
  const used=new Set([...(state.debts||[]).map(x=>x.id),...(state.oneTimeItems||[]).map(x=>x.id)]);
  while(used.has(id)) id=`user-${base}-${n++}`;
  return id;
}
function parseCustomSchedule(raw){
  const result={};
  cleanText(raw,1000).split(/[,;\n]+/).map(x=>x.trim()).filter(Boolean).forEach(part=>{
    const m=part.match(/^(\d{4}-\d{2}-\d{2})\s*[:=\-]\s*\$?\s*([0-9]+(?:\.[0-9]{1,2})?)$/);
    if(m) result[m[1]]=cents(Math.max(0,Number(m[2])||0));
  });
  return result;
}
function addDebtOrObligation(){
  const kind=prompt("What are you adding?\n\n1 = Debt\n2 = One-time obligation", "1");
  if(kind===null)return;
  if(String(kind).trim()==="2") addOneTimeObligation(); else addDebtWizard();
}
function fundingPayForDueDate(dueDate){
  const scheduled=scheduledPayForDate(dueDate);
  if(!(state.processedPays||[]).includes(scheduled)) return scheduled;
  const next=simulate().rows[0]?.payDate||addDays(scheduled,Number(state.payEveryDays||14));
  return next;
}
function addOneTimeObligation(){
  const before=forecastSnapshot();
  const name=cleanText(prompt("Obligation name:","")); if(!name)return;
  const amount=cents(Math.max(0,Number(prompt("Total amount:",""))||0)); if(amount<=0){alert("Enter an amount greater than $0.");return;}
  const dueDate=cleanText(prompt("Due date (YYYY-MM-DD):",todayLocalIso()),10); if(!/^\d{4}-\d{2}-\d{2}$/.test(dueDate)){alert("Use YYYY-MM-DD.");return;}
  const duePay=fundingPayForDueDate(dueDate);
  const urgent=String(dueDate)<String(duePay);
  const note=cleanText(prompt("Note (optional):",""),300);
  state.oneTimeItems.push({id:uniqueItemId(name),name,amount,dueDate,duePay,urgent,account:"regular",auto:false,paid:false,posted:false,userAdded:true,note});
  normalizeState(); rememberForecastChange(before,`adding ${name}`); save(); renderAll();
  if(urgent) alert(`${name} is due before your next unprocessed paycheck. It has been flagged urgent and placed on the next forecast pay so it is not lost. Check whether current cash needs to cover it sooner.`);
}
function addDebtWizard(){
  const before=forecastSnapshot();
  const name=cleanText(prompt("Debt name / lender:","")); if(!name)return;
  const balance=cents(Math.max(0,Number(prompt("Current total balance:",""))||0)); if(balance<=0){alert("Enter a balance greater than $0.");return;}
  const type=String(prompt("Debt type:\n1 = Past due\n2 = Biweekly\n3 = Monthly\n4 = Payment arrangement / custom schedule\n5 = Other / no required payment", "2")||"").trim();
  const d={id:uniqueItemId(name),name,start:balance,balance,min:0,category:"other",autoPayment:false,paymentTiming:"manual",extraEligible:true,userAdded:true,note:""};

  if(type==="1"){
    d.category="overdue";
    d.escalationRisk=yesValue(prompt("Already at elevated collections/escalation risk? yes/no:","no"),false);
    d.extraEligible=yesValue(prompt("Allow extra payoff payments? yes/no:","yes"),true);
  }else if(type==="2"){
    d.category="biweekly";
    d.min=cents(Math.max(0,Number(prompt("Biweekly required payment:",""))||0));
    const nextDue=cleanText(prompt("Next due date (YYYY-MM-DD):",simulate().rows[0]?.payDate||state.firstPay),10);
    if(/^\d{4}-\d{2}-\d{2}$/.test(nextDue) && d.min>0){d.requiredRecurring={start:nextDue,everyDays:14,amount:d.min};d.scheduleOnly=true;}
    d.autoPayment=yesValue(prompt("Automatic withdrawal? yes/no:","yes"),true);
    d.paymentTiming=d.autoPayment?(yesValue(prompt("Withdraws on payday? yes/no (no = overnight):","no"),false)?"payday":"overnight"):"payday";
    const fee=cents(Math.max(0,Number(prompt("Fixed interest/fee added every 2 weeks (0 if none/unknown):","0"))||0)); if(fee>0)d.interestPerPay=fee;
  }else if(type==="3"){
    d.category="monthly";
    d.min=cents(Math.max(0,Number(prompt("Monthly minimum payment:",""))||0));
    d.dueDay=Math.min(31,Math.max(1,Number(prompt("Due day of month (1-31):","1"))||1));
    d.autoPayment=yesValue(prompt("Automatic withdrawal? yes/no:","no"),false);
    d.paymentTiming=d.autoPayment?"overnight":"manual";
    const apr=Math.max(0,Number(prompt("APR % (0 if none/unknown):","0"))||0); if(apr>0)d.apr=apr/100;
  }else if(type==="4"){
    d.category=yesValue(prompt("Is this account past due? yes/no:","yes"),true)?"overdue":"other";
    d.scheduleOnly=true;
    const mode=String(prompt("Arrangement type:\n1 = Recurring payment\n2 = Custom dated payments","1")||"").trim();
    if(mode==="2"){
      const raw=prompt("Enter payments as YYYY-MM-DD=amount, separated by commas.\nExample: 2026-11-05=300, 2026-11-19=300",""); if(raw===null)return;
      d.requiredSchedule=parseCustomSchedule(raw);
      if(!Object.keys(d.requiredSchedule).length){alert("No valid dated payments were found.");return;}
    }else{
      const amt=cents(Math.max(0,Number(prompt("Required payment amount:",""))||0));
      const every=Math.max(1,Number(prompt("Repeat every how many days?","14"))||14);
      const start=cleanText(prompt("Next due date (YYYY-MM-DD):",simulate().rows[0]?.payDate||state.firstPay),10);
      if(amt<=0||!/^\d{4}-\d{2}-\d{2}$/.test(start)){alert("Enter a valid amount and date.");return;}
      d.requiredRecurring={start,everyDays:every,amount:amt}; d.min=amt;
    }

function debtFreedPayment(d){

function todayLocalIso(){
  return isoLocal(new Date());
}
function scheduledPayForDate(dateStr){
  const first=new Date(state.firstPay+"T12:00:00");
  const d=new Date(dateStr+"T12:00:00");
  if(d<first) return state.firstPay;
  const diffDays=Math.floor((d-first)/86400000);
  const periods=Math.max(0,Math.floor(diffDays/Number(state.payEveryDays||14)));
  return addDays(state.firstPay,periods*Number(state.payEveryDays||14));
}
function billsForWindow(payDate,nextDate){
  return state.bills.filter(b=>billDueInWindow(payDate,nextDate,b));
}
function pendingBillsForAccount(account,payDate,nextDate,fromDate,automaticOnly=false){
  const from=new Date((fromDate||payDate)+"T12:00:00");
  return billsForWindow(payDate,nextDate).filter(b=>{
    if(b.account!==account) return false;
    if(automaticOnly && !b.auto) return false;
    const due=billDueDateInWindow(payDate,nextDate,b);
    if(!due) return false;
    return new Date(due+"T12:00:00")>=from;
  });
}
function bankAccountTargets(referenceDate){
  const today=referenceDate||todayLocalIso();
  const payDate=scheduledPayForDate(today);
  const nextDate=addDays(payDate,Number(state.payEveryDays||14));
  const sim=simulate();
  const row=sim.rows.find(r=>r.payDate===payDate);
  const processed=state.processedPays.includes(payDate);
  const st=(state.paydayStages&&state.paydayStages[payDate])||{paydayDone:false,morningDone:false,actualRegular:null};

  let rentFund=Number(state.funds.rent||0);
  let plannedFund=Number(state.funds.planned||0);
  let emergencyFund=Number(state.funds.emergency||0);
  let debtReserve=Number(state.funds.debtReserve||0);
  let regularBills=[], rentBills=[], scotiaBills=[];
  let scotiaGroceries=Number(state.groceriesPerPay||0);
  let scotiaGas=Number(state.gasPerPay||0);
  let scotiaPersonal=Number(lifeForPay(payDate).personal||0);
  let basis="Current recorded funds";

  if(row && !processed){
    let plannedAdd=Number(row.planned||0);
    let emergencyAdd=Number(row.emergency||0);
    let endingReserve=Number(row.debtReserveEnd||0);

    if(st.paydayDone && st.actualRegular!==null && st.actualRegular!==undefined && st.actualRegular!==""){
      const c=morningCalculation(row,Number(st.actualRegular));
      if(c.requiredShortfall<=0.005){
        plannedAdd=Number(c.planned||0);
        emergencyAdd=Number(c.emergency||0);
        endingReserve=Number(c.endingReserve||0);
        basis="Uses your entered Regular balance";
      }else{
        basis="Forecast target — resolve the Regular warning first";
      }
    }else{
      basis="Forecast after the current pay is fully settled";
    }

    rentFund=cents(rentFund+Number(row.rentSave||0));
    plannedFund=cents(plannedFund+plannedAdd);
    emergencyFund=cents(emergencyFund+emergencyAdd);
    debtReserve=cents(endingReserve);

    // Once the current pay is fully settled, only later automatic Regular
    // charges still need to remain in Regular.
    regularBills=regularAutomaticBillsLater(row);

    // Rent-account charges are funded on payday and remain there until posted.
    rentBills=pendingBillsForAccount("rent",payDate,nextDate,today,false);

    // Scotia is a start-of-pay-period spending target because the app does not
    // track each grocery/gas/personal purchase.
    scotiaBills=(row.billItems||[]).filter(b=>b.account==="scotia");
    scotiaGroceries=Number(row.groceries||0);
    scotiaGas=Number(row.gas||0);
    scotiaPersonal=Number(row.personal||0);
  }else{
    // If the current pay has already been completed, use the saved fund
    // balances plus automatic charges still due before the next pay.
    regularBills=pendingBillsForAccount("regular",payDate,nextDate,today,true);
    rentBills=pendingBillsForAccount("rent",payDate,nextDate,today,false);
    scotiaBills=billsForWindow(payDate,nextDate).filter(b=>b.account==="scotia");
    basis="Recorded funds for the current pay period";
  }

  const regularBillsTotal=cents(regularBills.reduce((s,b)=>s+Number(b.amount||0),0));
  const rentBillsTotal=cents(rentBills.reduce((s,b)=>s+Number(b.amount||0),0));
  const scotiaBillsTotal=cents(scotiaBills.reduce((s,b)=>s+Number(b.amount||0),0));

  const regularTarget=cents(regularBillsTotal);
  const rentTarget=cents(rentFund+plannedFund+emergencyFund+debtReserve+rentBillsTotal);
  const housingShortfall=housingRecoveryTotal();
  const rentExpectedPhysical=cents(Math.max(0,rentTarget-housingShortfall));
  const scotiaTarget=cents(scotiaGroceries+scotiaGas+scotiaPersonal+scotiaBillsTotal);

  return {
    today,payDate,nextDate,basis,
    regularTarget,rentTarget,rentExpectedPhysical,housingShortfall,scotiaTarget,
    regularBuffer:Number(state.regularBuffer||0),
    regularBills,regularBillsTotal,
    rentFund,plannedFund,emergencyFund,debtReserve,rentBills,rentBillsTotal,
    scotiaGroceries,scotiaGas,scotiaPersonal,scotiaBills,scotiaBillsTotal
  };
}

function recordPayment(id){
  const d=state.debts.find(x=>x.id===id); if(!d)return;
  const row=simulate().rows[0];
  if(row && row.allocations.some(a=>a.type==="Required"&&a.id===id)){
    if(!confirm(`${d.name} already has a scheduled payment in the current Home payday workflow.\n\nOnly continue here if this is an EXTRA payment or a correction. Otherwise use Home so the payment is not counted twice.`)) return;
  }
  const raw=prompt(`Payment to ${d.name}\nCurrent balance: ${money(d.balance)}\nEnter payment amount:`);
  if(raw===null)return;
  const amt=Math.max(0,Math.min(d.balance,Number(raw)||0));
  if(!amt)return;
  d.balance=cents(Math.max(0,d.balance-amt)); if(!activeBalance(d.balance)) d.balance=0;
  const paymentDate=isoLocal(new Date());
  state.paymentHistory.push({date:paymentDate,debtId:id,amount:amt,type:"manual"});
  if(id==="cc") countCreditCardCyclePayment(amt,paymentDate);
  if(Number(state.funds.debtReserve||0)>0 && confirm(`Did this payment use money from your Rent-account debt reserve?\n\nIf yes, the app will reduce the reserve by ${money(Math.min(amt,state.funds.debtReserve))}.`)){
    state.funds.debtReserve=Math.max(0,Number(state.funds.debtReserve||0)-amt);
  }
  save(); renderAll();
}

function deferOneTime(id,payDate){

function completePaydayStage(payDate){
  const row=simulate().rows[0];
  if(!row || row.payDate!==payDate) return;
  const st=stageFor(payDate);
  if(!st.precheckSaved || st.preRegular===null || st.preRegular===undefined){
    alert("Enter and save your actual Regular balance before leaving the account overnight.");
    return;
  }
  const spend=spendTransferFor(row), rentTransfer=paydayRentTransferFor(row);
  const dueToday=sameDayManualTotal(row);
  const autoToday=sameDayAutoDebtTotal(row)+sameDayAutomaticBillsTotal(row);
  const p=preWithdrawalRequirements(row,st);
  const msg=`Payday steps for ${fmtDate(payDate)}:\n\nScotia transfer: ${money(spend)}\nRent-account transfer: ${money(rentTransfer)}${autoToday?`\nAutomatic withdrawals expected today: ${money(autoToday)}`:""}${dueToday?`\nManual payment(s) to make today: ${money(dueToday)}`:""}\n\nActual Regular before overnight: ${moneySigned(st.preRegular)}\nProtected/expected amount to leave untouched: ${money(p.holdTotal)}\n\nDo not move any apparent surplus tonight. Reconcile the real balance after the automatic withdrawals post.`;
  if(!confirm(msg)) return;
  st.paydayDone=true;
  st.sameDayManualDone=true;
  save();renderAll();
}
function calculateMorning(payDate){
  const input=document.getElementById("actualRegularInput");
  if(!input)return;
  const v=Number(input.value);
  if(!Number.isFinite(v)){alert("Enter the actual Regular-account balance after the overnight withdrawals.");return;}
  const row=simulate().rows[0];
  if(row && row.payDate===payDate){
    const st=stageFor(payDate);
    const base=(st.precheckSaved && st.preRegular!==null && st.preRegular!==undefined)
      ?Number(st.preRegular)
      :expectedRegularBalances(row).afterSameDay;
    const pre=st.prePaidOccurrences||{};
    const newlyPosted=(kind,id)=>{
      const key=occurrenceKey(kind,id);
      return !!st.paidOccurrences?.[key] && !pre[key];
    };
    const postedAutoDebt=cents((autoDebtAllocationsFor(row)||[]).filter(a=>newlyPosted("debt",a.id)).reduce((sum,a)=>sum+Number(a.amount||0),0));
    const postedAutoBills=cents((row.billItems||[]).filter(b=>b.auto&&b.account==="regular"&&newlyPosted("bill",b.id)).reduce((sum,b)=>sum+Number(b.amount||0),0));
    const expected=cents(base-postedAutoDebt-postedAutoBills);
    const delta=cents(v-expected);
    st.morningCheckpoint={base:cents(base),postedAutoDebt,postedAutoBills,expected,actual:cents(v),difference:delta};
    if(delta>20 && !confirm(`Your Regular balance is ${money(delta)} HIGHER than the checkpoint explained by the automatic payments you marked posted.\n\nThat usually means another expected withdrawal has not posted yet or money came into the account. Pending automatic payments will stay protected.\n\nContinue anyway?`)) return;
    // A lower balance is allowed. The real balance remains authoritative and
    // the Stage 2 plan protects every still-pending obligation first.
  }
  const st=stageFor(payDate);
  st.actualRegular=cents(v);
  state.latestBankBalances=state.latestBankBalances||{};
  state.latestBankBalances.regular=st.actualRegular;
  state.latestBankBalances.updatedAt=new Date().toLocaleString();
  state.latestBankBalances.phase="After overnight withdrawals";
  save();renderAll();
}
function completeMorningStage(payDate){
  const row=simulate().rows[0];
  const st=stageFor(payDate);
  if(!row || row.payDate!==payDate || st.actualRegular===null || st.actualRegular===undefined) return;
  const c=morningCalculation(row,st.actualRegular);
  if(c.autoDebtsTotal>0.005){
    const names=(c.autoDebts||[]).map(a=>`${a.name} ${money(a.amount)}`).join(", ");
    alert(`Automatic debt withdrawal(s) are still marked pending: ${names}.\n\nKeep that money in Regular and wait for the transactions to post, then mark them posted and re-enter the actual balance before completing the payday.`);
    return;
  }
  if(c.requiredShortfall>0.005){
    if(c.criticalBillsShortfall>0.005) alert(`CRITICAL: you are ${money(c.criticalBillsShortfall)} short of the required bills/debt payments. Resolve this before completing the pay.`);
    else if(c.cleanupShortfall>0.005) alert(`Cleanup items are ${money(c.cleanupShortfall)} over what safely fits. Defer a nonessential cleanup item and recalculate.`);
    return;
  }

  if(!confirm(`Finish ${fmtDate(payDate)}?\n\nRent/car recovery transfer: ${money(c.housingRecoveryTotal||0)}\nManual required payments: ${money(c.oneTimesTotal+c.manualBillsTotal+c.manualDebtsTotal)}\n${state.momRepaymentEnabled?`Mom e-transfer: ${money(c.momPayment)}${c.momPayment>0?" — confirm you actually sent it":""}\n`:""}Optional personal top-up to Scotia: ${money(c.personalTopUp||0)}\nCredit-card protection: ${money(c.ccProtectionTotal||0)}\nPast-due / extra debt payments: ${money((c.picks||[]).filter(x=>!String(x.kind||"").startsWith("ccProtection")).reduce((s,x)=>s+x.amount,0))}\nOvernight safety buffer released from plan: ${money(c.releasedBuffer)}\n\nThe released buffer will not be carried into the next payday forecast.`)) return;

  // Save undo snapshot.
  state.undoSnapshots=state.undoSnapshots||[];
  const snap=deep(state); snap.undoSnapshots=[];
  state.undoSnapshots.push(JSON.stringify(snap));
  if(state.undoSnapshots.length>5) state.undoSnapshots.shift();

  // Apply known fixed and estimated monthly interest once before this pay's debt activity.
  applyInterestForPay(state.debts,row.payDate,row.nextDate);

  // Apply automatic and manual required debt payments.
  [...autoDebtAllocationsFor(row),...manualDebtAllocationsFor(row)].forEach(a=>{
    const d=state.debts.find(x=>x.id===a.id);
    if(d){
      d.balance=cents(Math.max(0,d.balance-a.amount)); if(!activeBalance(d.balance)) d.balance=0;
      state.paymentHistory.push({date:payDate,debtId:d.id,amount:a.amount,type:"Required"});
      if(d.id==="cc") countCreditCardCyclePayment(a.amount,payDate);
    }
  });

  // Apply extra debt chunks.
  c.picks.forEach(a=>{
    const d=state.debts.find(x=>x.id===a.id);
    if(d){
      d.balance=cents(Math.max(0,d.balance-a.amount)); if(!activeBalance(d.balance)) d.balance=0;
      state.paymentHistory.push({date:payDate,debtId:d.id,amount:a.amount,type:String(a.kind||"").startsWith("ccProtection")?"Credit Card Protection":"Extra"});
      if(d.id==="cc") countCreditCardCyclePayment(a.amount,payDate);
    }
  });

  // Record required bill status. Manual bills in the completed Stage 2 plan are
  // treated as paid; automatic bills remain pending until the user marks the
  // bank transaction posted on Home.
  (c.manualBills||[]).forEach(b=>{const due=billDueDateInWindow(row.payDate,row.nextDate,b);if(due)setBillStatusPosted(due,b.id,true);});
  (row.billItems||[]).filter(b=>b.auto&&occurrenceAlreadyPaid(row.payDate,"bill",b.id)).forEach(b=>{const due=billDueDateInWindow(row.payDate,row.nextDate,b);if(due)setBillStatusPosted(due,b.id,true);});

  // Mark one-time items paid, including uncertain charges confirmed as already posted.
  c.oneTimes.forEach(x=>{
    const orig=state.oneTimeItems.find(y=>y.id===x.id);
    if(orig) orig.paid=true;
    if(/^mom/i.test(String(x.id||'')) || /^mom$/i.test(String(x.name||'').trim())) state.funds.momPaid=(Number(state.funds.momPaid)||0)+Number(x.amount||0);
  });
  uncertainItemsForPay(payDate).filter(x=>x.posted).forEach(x=>{x.paid=true;});
  (state.oneTimeItems||[]).filter(x=>x.duePay===payDate && occurrenceAlreadyPaid(payDate,"one",x.id)).forEach(x=>{
    x.paid=true;
    if(/^mom/i.test(String(x.id||'')) || /^mom$/i.test(String(x.name||'').trim())){
      const alreadyCounted=(state.paymentHistory||[]).some(p=>p.kind==="one" && p.itemId===x.id && p.date===payDate);
      if(!alreadyCounted) state.funds.momPaid=(Number(state.funds.momPaid)||0)+Number(x.amount||0);
    }
  });

  // Record the flexible Mom e-transfer only when the completed Stage 2 plan
  // actually called for one. There is no Mom reserve and no borrowing for Mom.
  if(Number(c.momPayment||0)>0.005){
    state.funds.momPaid=cents(Number(state.funds.momPaid||0)+Number(c.momPayment||0));
    state.momPaymentHistory=state.momPaymentHistory||[];
    state.momPaymentHistory.push({
      date:payDate,
      amount:cents(c.momPayment),
      type:"e-transfer",
      note:c.momReason||"Mom repayment"
    });
    if(state.momPaymentHistory.length>50) state.momPaymentHistory=state.momPaymentHistory.slice(-50);
  }

  if(Number(c.rentRecovery||0)>0.005 || Number(c.carRecovery||0)>0.005){
    const h=state.housingRecovery;
    const rentApplied=cents(Math.min(Number(h.rentShortfall||0),Number(c.rentRecovery||0)));
    const carApplied=cents(Math.min(Number(h.carShortfall||0),Number(c.carRecovery||0)));
    h.rentShortfall=cents(Math.max(0,Number(h.rentShortfall||0)-rentApplied));
    h.carShortfall=cents(Math.max(0,Number(h.carShortfall||0)-carApplied));
    if(h.rentShortfall<=0.005){h.rentShortfall=0;h.rentDueDate=null;}
    if(h.carShortfall<=0.005){h.carShortfall=0;h.carDueDate=null;}
    h.history=h.history||[]; h.history.push({date:payDate,rent:rentApplied,car:carApplied,type:"recovery"});
    if(h.history.length>50)h.history=h.history.slice(-50);
  }

  // Update protected savings allocations.
  state.funds.rent += Number(row.rentSave||0);
  state.funds.planned += c.planned;
  state.funds.emergency += c.emergency;
  state.funds.debtReserve = c.endingReserve;

  st.morningDone=true;
  state.processedPays.push(payDate);
  save();renderAll();
}

function undoLastPay(){
  const stack=state.undoSnapshots||[];
  if(!stack.length){alert("There is no completed payday to undo.");return;}
  if(!confirm("Undo the most recently completed payday and restore the previous balances/funds?")) return;
  const raw=stack.pop();
  const restored=JSON.parse(raw);
  restored.undoSnapshots=stack;
  state=restored;
  save(); renderAll();
}
function fundDisplayName(key){
  return ({emergency:"Emergency",planned:"Planned expenses",debtReserve:"Debt reserve"})[key]||key;
}
function applyFundAdjustment(from,to,amount,note){
  amount=cents(Math.max(0,Number(amount)||0));
  if(!["emergency","planned","debtReserve"].includes(from)) return {ok:false,message:"Choose a valid source fund."};
  if(!["spent","emergency","planned","debtReserve"].includes(to)) return {ok:false,message:"Choose a valid destination."};
  if(to===from) return {ok:false,message:"Choose a different destination."};
  if(amount<=0) return {ok:false,message:"Enter an amount greater than $0."};

  const available=cents(Number(state.funds[from]||0));
  if(amount>available+0.005) return {ok:false,message:`Only ${money(available)} is recorded in ${fundDisplayName(from)}.`};

  state.funds[from]=cents(Math.max(0,available-amount));
  if(to!=="spent") state.funds[to]=cents(Number(state.funds[to]||0)+amount);

  const label=to==="spent"
    ? `${fundDisplayName(from)} → Spent / out of Rent`
    : `${fundDisplayName(from)} → ${fundDisplayName(to)}`;

  state.fundAdjustments=state.fundAdjustments||[];
  state.fundAdjustments.push({
    date:new Date().toLocaleString(),
    from,to,amount,label,note:String(note||"").trim()
  });
  if(state.fundAdjustments.length>50) state.fundAdjustments=state.fundAdjustments.slice(-50);
  return {ok:true,label};
}

function addOverride(existing){
  const d=existing||prompt("Pay date (YYYY-MM-DD):",state.firstPay); if(!d)return;
  const old=state.payOverrides[d]||{};
  const personal=prompt("Base personal spending:",old.personal??state.personalPerPay); if(personal===null)return;
  const personalTopUp=prompt("Optional extra personal after Mom:",old.personalTopUp??state.personalTopUpPerPay); if(personalTopUp===null)return;
  const rent=prompt("Rent savings from this pay:",old.rent??rentContribution(d)); if(rent===null)return;
  const note=prompt("Note (optional):",old.note||"")??"";
  state.payOverrides[d]={personal:Math.max(0,Number(personal)||0),personalTopUp:Math.max(0,Number(personalTopUp)||0),planned:0,emergency:0,rent:Math.max(0,Number(rent)||0),note};
  save();renderAll();
}
function exportBackup(){
  state.lastBackupAt=new Date().toLocaleString();
  state.lastBackupProcessedPays=(state.processedPays||[]).length;
  save();
  const blob=new Blob([JSON.stringify(state,null,2)],{type:"application/json"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download="debt-freedom-backup.json"; a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href); renderAll();},1000);
}
function applyPrivatePatch(incoming){
  if(!incoming || incoming.patchType!=="debt-freedom-plan-patch") return false;

  if(incoming.settings && typeof incoming.settings==="object"){
    Object.entries(incoming.settings).forEach(([k,v])=>{ state[k]=v; });
  }

  if(Array.isArray(incoming.debtUpdates)){
    incoming.debtUpdates.forEach(u=>{
      if(!u || !u.id) return;
      const d=state.debts.find(x=>x.id===u.id);
      if(!d) return;
      Object.entries(u).forEach(([k,v])=>{ if(k!=="id") d[k]=v; });
    });
  }

  if(Array.isArray(incoming.billUpserts)){
    incoming.billUpserts.forEach(u=>{
      if(!u || !u.id) return;
      const i=state.bills.findIndex(x=>x.id===u.id);
      if(i>=0) state.bills[i]=Object.assign({},state.bills[i],u);
      else state.bills.push(u);
    });
  }

  if(Array.isArray(incoming.paymentHistoryAdds)){
    incoming.paymentHistoryAdds.forEach(p=>{
      if(!p || !p.debtId || !Number(p.amount||0)) return;
      const duplicate=state.paymentHistory.some(x=>
        x.debtId===p.debtId &&
        String(x.date||"")===String(p.date||"") &&
        Math.abs(Number(x.amount||0)-Number(p.amount||0))<0.005
      );
      if(!duplicate) state.paymentHistory.push(p);
    });
  }

  if(incoming.removeDebtPriorities){
    state.debts.forEach(d=>{
      delete d.priority;
      if(d.category==="overdue" && /priority/i.test(String(d.note||''))) d.note="Past due; no scheduled payment.";
    });
  }

  normalizeState(); save(); renderAll();
  alert("Your private app update was applied. Existing payment history and completed paydays were kept.");
  return true;
}
function importBackup(ev){
  const f=ev.target.files[0]; if(!f)return;
  const reader=new FileReader();
  reader.onload=()=>{try{
    const incoming=JSON.parse(reader.result);
    if(applyPrivatePatch(incoming)) return;
    if(!incoming || typeof incoming!=="object" || !Array.isArray(incoming.debts) || !Array.isArray(incoming.bills) || !Number.isFinite(Number(incoming.income)) || Number(incoming.income)<=0) throw new Error("Invalid plan");
    state=Object.assign(deep(defaultState),incoming);
    normalizeState();save();renderAll();alert("Your private budget plan is loaded on this device.");
  }catch(e){alert("Could not read that file. Make sure you selected a Debt Freedom backup, private plan, or private update JSON file.");}};
  reader.readAsText(f);
}
function resetApp(){
  if(!confirm("Reset the app completely? This removes the private plan, balances, payment history and saved progress from this device."))return;
  if(!confirm("Final confirmation: you will need to import your private plan or backup again. Continue?"))return;
  state=deep(defaultState);save();renderAll();
}

document.querySelectorAll(".tab").forEach(btn=>btn.addEventListener("click",()=>{
  document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));
  document.querySelectorAll(".panel").forEach(x=>x.classList.remove("active"));
  btn.classList.add("active");document.getElementById(btn.dataset.tab).classList.add("active");
}));

if("serviceWorker" in navigator && location.protocol!=="file:"){
  navigator.serviceWorker.register("service-worker.js",{updateViaCache:"none"}).catch(()=>{});
}
renderAll();
</script>
