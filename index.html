<html lang="en">

<style>
:root{
  --bg:#f8fafc; --card:#fff; --ink:#0f172a; --muted:#64748b; --line:#e2e8f0;
  --navy:#0f172a; --blue:#2563eb; --green:#15803d; --red:#b91c1c; --amber:#b45309;
  --softblue:#eff6ff; --softgreen:#f0fdf4; --softred:#fef2f2; --softamber:#fffbeb;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
header{position:sticky;top:0;z-index:20;background:rgba(15,23,42,.96);color:#fff;padding:16px 16px 12px}
header h1{font-size:21px;margin:0 0 4px} header p{font-size:12px;margin:0;color:#cbd5e1}
main{max-width:760px;margin:auto;padding:14px 14px 92px}
.tabs{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:0 0 14px}
.tab{border:0;border-radius:12px;padding:10px 4px;font-size:11px;font-weight:700;background:#e2e8f0;color:#334155}
.tab.active{background:var(--navy);color:#fff}
.panel{display:none}.panel.active{display:block}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:10px;box-shadow:0 1px 2px rgba(15,23,42,.04)}
.kpi .label{font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.03em}
.kpi .value{font-size:23px;font-weight:800;margin-top:4px}
.kpi .sub{font-size:11px;color:var(--muted);margin-top:4px}
h2{font-size:17px;margin:18px 0 10px} h3{font-size:15px;margin:0 0 8px}
.badge{display:inline-block;border-radius:999px;padding:4px 8px;font-size:10px;font-weight:800}
.overdue{background:var(--softred);color:var(--red)}
.biweekly{background:var(--softblue);color:#1d4ed8}
.other{background:var(--softamber);color:var(--amber)}
.hoyes{background:var(--softgreen);color:var(--green)}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.muted{color:var(--muted);font-size:12px}
.big{font-size:19px;font-weight:800}
.progress{height:8px;border-radius:999px;background:#e2e8f0;overflow:hidden;margin-top:8px}
.progress>span{display:block;height:100%;background:var(--blue)}
button{font:inherit}
.btn{border:0;border-radius:10px;padding:10px 12px;font-weight:700;background:var(--navy);color:white}
.btn.secondary{background:#e2e8f0;color:#334155}.btn.danger{background:#fee2e2;color:#991b1b}
.btn.small{padding:7px 9px;font-size:12px}
input,select{width:100%;border:1px solid #cbd5e1;border-radius:10px;padding:10px;background:white;color:var(--ink);font-size:16px}
label{display:block;font-size:11px;color:var(--muted);font-weight:700;margin:0 0 5px}
.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
hr{border:0;border-top:1px solid var(--line);margin:12px 0}
.debt-card .actions{display:flex;gap:8px;margin-top:10px}
.paycard{border-left:4px solid var(--blue)}
.paycard.done{opacity:.6;border-left-color:var(--green)}
.alloc{font-size:12px;display:grid;grid-template-columns:1fr auto;gap:5px 12px;margin-top:10px}
.alloc b{font-variant-numeric:tabular-nums}
.note{background:var(--softblue);border:1px solid #bfdbfe;border-radius:12px;padding:11px;font-size:12px;line-height:1.4;margin-bottom:10px}
.warn{background:var(--softamber);border-color:#fde68a}
.good{background:var(--softgreen);border-color:#bbf7d0}
.footerbar{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);padding:8px 14px calc(8px + env(safe-area-inset-bottom));z-index:30}
.footerbar .inner{max-width:760px;margin:auto;display:flex;gap:8px}
.footerbar .btn{flex:1}
details summary{cursor:pointer;font-weight:700}
@media(max-width:420px){.grid{grid-template-columns:1fr 1fr}.tabs{gap:4px}.tab{font-size:10px;padding:9px 2px}.formgrid{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
  <h1>Debt Freedom</h1>
  <p>Payday → next morning • actual-balance safety check</p>
</header>

<main>
  <div class="tabs">
    <button class="tab active" data-tab="home">Home</button>
    <button class="tab" data-tab="paydays">Paydays</button>
    <button class="tab" data-tab="debts">Debts</button>
    <button class="tab" data-tab="funds">Funds</button>
    <button class="tab" data-tab="settings">Settings</button>
  </div>

  <section id="home" class="panel active"></section>
  <section id="paydays" class="panel"></section>
  <section id="debts" class="panel"></section>
  <section id="funds" class="panel"></section>
  <section id="settings" class="panel"></section>
</main>

<div class="footerbar">
  <div class="inner">
    <button class="btn secondary" onclick="exportBackup()">Export backup</button>
    <button class="btn" onclick="renderAll()">Refresh plan</button>
  </div>
</div>

<script>
const VERSION = 1;
const money = n => new Intl.NumberFormat('en-CA',{style:'currency',currency:'CAD'}).format(Math.max(0,Number(n)||0));
const fmtDate = s => new Date(s+'T12:00:00').toLocaleDateString('en-CA',{month:'short',day:'numeric',year:'numeric'});
const iso = d => d.toISOString().slice(0,10);
const addDays = (s,n) => { const d=new Date(s+'T12:00:00'); d.setDate(d.getDate()+n); return iso(d); };
const firstOfMonth = s => { const d=new Date(s+'T12:00:00'); return new Date(d.getFullYear(),d.getMonth(),1,12); };
const daysInMonth = (y,m) => new Date(y,m+1,0).getDate();
const deep = x => JSON.parse(JSON.stringify(x));

const defaultState = {
  version: VERSION,
  income: 0,
  firstPay: "2026-09-10",
  payEveryDays: 14,
  rent: 0,
  groceriesPerPay: 0,
  gasPerPay: 0,
  personalPerPay: 0,
  plannedPerPay: 0,
  emergencyPerPay: 0,
  emergencyTarget: 0,
  funds: {rent:0, planned:0, emergency:0, momPaid:0},
  momOwed: 0,
  processedPays: [],
  payOverrides: {},
  bills: [],
  debts: [],
  paymentHistory: [],
  undoSnapshots: []
};

let state = load();

function load(){
  try{
    const raw=localStorage.getItem("debtFreedomState");
    return raw ? Object.assign(deep(defaultState),JSON.parse(raw)) : deep(defaultState);
  }catch(e){ return deep(defaultState); }
}
function save(){ localStorage.setItem("debtFreedomState",JSON.stringify(state)); }
function normalizeState(){
  state.funds=state.funds||{};
  if(state.funds.rent===undefined) state.funds.rent=0;
  if(state.funds.planned===undefined) state.funds.planned=0;
  if(state.funds.emergency===undefined) state.funds.emergency=0;
  if(state.funds.debtReserve===undefined) state.funds.debtReserve=0;
  if(state.funds.momPaid===undefined) state.funds.momPaid=0;

  state.accounts=state.accounts||{
    regular:{name:"Regular account"},
    rent:{name:"Rent account"},
    scotia:{name:"Scotia spending account"}
  };
  state.startingBalances=state.startingBalances||{regular:0,rent:0,scotia:0};
  if(state.regularBuffer===undefined) state.regularBuffer=200;
  state.oneTimeItems=state.oneTimeItems||[];
  state.paydayStages=state.paydayStages||{};
  if(state.pastDueChunkFraction===undefined) state.pastDueChunkFraction=1/3;
  if(state.pastDueHalfFraction===undefined) state.pastDueHalfFraction=1/2;

  (state.bills||[]).forEach(b=>{
    if(b.account===undefined) b.account=(b.id==="car"?"rent":"regular");
    if(b.auto===undefined) b.auto=(b.id==="car");
  });
}
normalizeState();

function dueInWindow(payDate,nextDate,dueDay,startDate){
  let start = new Date(payDate+'T12:00:00'), end = new Date(nextDate+'T12:00:00');
  let cur = new Date(start.getFullYear(),start.getMonth(),1,12);
  let finish = new Date(end.getFullYear(),end.getMonth(),1,12);
  const minStart = new Date(startDate+'T12:00:00');
  while(cur <= finish){
    const day = dueDay==="last" ? daysInMonth(cur.getFullYear(),cur.getMonth()) : Math.min(Number(dueDay),daysInMonth(cur.getFullYear(),cur.getMonth()));
    const due = new Date(cur.getFullYear(),cur.getMonth(),day,12);
    if(due >= minStart && due >= start && due < end) return true;
    cur = new Date(cur.getFullYear(),cur.getMonth()+1,1,12);
  }
  return false;
}
function payDatesInMonth(payDate){
  const d=new Date(payDate+'T12:00:00'), arr=[];
  for(let i=0;i<40;i++){
    const p=addDays(state.firstPay,i*state.payEveryDays), pd=new Date(p+'T12:00:00');
    if(pd.getFullYear()===d.getFullYear() && pd.getMonth()===d.getMonth()) arr.push(p);
  }
  return arr;
}
function rentContribution(payDate){
  if(state.payOverrides[payDate] && state.payOverrides[payDate].rent!==undefined) return Number(state.payOverrides[payDate].rent)||0;
  if(payDate < "2026-11-01") return 0;
  const pays=payDatesInMonth(payDate);
  return pays.slice(0,2).includes(payDate) ? state.rent/2 : 0;
}
function lifeForPay(payDate){
  const o=state.payOverrides[payDate]||{};
  return {
    personal:o.personal!==undefined?Number(o.personal):state.personalPerPay,
    planned:o.planned!==undefined?Number(o.planned):state.plannedPerPay,
    emergency:o.emergency!==undefined?Number(o.emergency):state.emergencyPerPay,
    note:o.note||""
  };
}

function simulate(){
  normalizeState();
  let debts=deep(state.debts);
  let rows=[], debtFreeIndex=null, extraAfter=0;
  let debtReserve=Number(state.funds.debtReserve||0);

  let startIndex=0;
  while(state.processedPays.includes(addDays(state.firstPay,startIndex*state.payEveryDays))) startIndex++;

  for(let i=startIndex;i<startIndex+40;i++){
    const payDate=addDays(state.firstPay,i*state.payEveryDays);
    const nextDate=addDays(payDate,state.payEveryDays);
    const life=lifeForPay(payDate);
    const rentSave=rentContribution(payDate);
    const billItems=state.bills.filter(b=>dueInWindow(payDate,nextDate,b.dueDay,b.start));
    const billsTotal=billItems.reduce((s,b)=>s+Number(b.amount||0),0);
    const living=state.groceriesPerPay+state.gasPerPay+life.personal+life.planned+life.emergency;

    const allocations=[];
    let baseDebt=0;

    debts.forEach(d=>{
      if(d.balance>0 && Number(d.interestPerPay||0)>0) d.balance += Number(d.interestPerPay);
    });

    debts.forEach(d=>{
      if(d.balance<=0) return;
      let due=0;
      if(d.category==="biweekly") due = (i===0 && d.firstPay) ? Number(d.firstPay) : Number(d.min||0);
      else if(d.category==="hoyes") due=Number(d.min||0);
      else if(d.category==="monthly" && dueInWindow(payDate,nextDate,d.dueDay,state.firstPay)) due=Number(d.min||0);
      else if(d.id==="bellbal" && (i===0 || i===1)) due=226.57;
      else if(d.id==="bree" && payDate==="2026-09-24") due=815.99;
      due=Math.min(d.balance,due);
      if(due>0){
        d.balance-=due; baseDebt+=due;
        allocations.push({name:d.name,id:d.id,amount:due,type:"Required"});
      }
    });

    const debtReserveStart=debtReserve;
    const reserveAdd=Math.max(0,state.income-billsTotal-living-rentSave-baseDebt);
    debtReserve += reserveAdd;

    let extraUsed=0;
    const overdue=debts.filter(d=>d.category==="overdue" && d.balance>0).sort((a,b)=>a.priority-b.priority);

    if(overdue.length){
      // One meaningful chunk per overdue account per payday, in priority order.
      // Full balance if possible; otherwise half; otherwise one-third; otherwise hold the cash.
      for(const d of overdue){
        if(debtReserve<=0.005) break;
        let amt=0;
        const full=d.balance;
        const half=Math.round(d.balance*0.5*100)/100;
        const third=Math.round(d.balance/3*100)/100;
        if(debtReserve>=full) amt=full;
        else if(debtReserve>=half) amt=half;
        else if(debtReserve>=third) amt=third;
        if(amt>0){
          d.balance-=amt;
          debtReserve-=amt;
          extraUsed+=amt;
          allocations.push({name:d.name,id:d.id,amount:amt,type:"Extra",chunk:true});
          // Strict waterfall: do not move to the next past-due debt until
          // this higher-priority debt has been completely paid off.
          if(d.balance>0.005) break;
        } else {
          // Strict past-due priority: do not skip ahead to a smaller debt.
          // Hold the reserve until this higher-priority debt can receive
          // at least a meaningful one-third payment.
          break;
        }
      }
    } else {
      // Once past-due balances are gone, use the reserve aggressively.
      let order=[];
      const byId=id=>debts.find(d=>d.id===id && d.balance>0);
      ["alterfina","indebted","cc"].forEach(id=>{const d=byId(id); if(d) order.push(d);});
      const regular=debts.filter(d=>d.category==="biweekly" && d.id!=="alterfina" && d.balance>0).sort((a,b)=>a.balance-b.balance);
      order=order.concat(regular);
      for(const d of order){
        if(debtReserve<=0.005) break;
        const amt=Math.min(debtReserve,d.balance);
        d.balance-=amt; debtReserve-=amt; extraUsed+=amt;
        allocations.push({name:d.name,id:d.id,amount:amt,type:"Extra"});
      }
    }

    const remaining=debts.reduce((s,d)=>s+Math.max(0,d.balance),0);
    rows.push({
      index:i,payDate,nextDate,income:state.income,billItems,billsTotal,
      groceries:state.groceriesPerPay,gas:state.gasPerPay,...life,rentSave,
      baseDebt,reserveAdd,debtReserveStart,debtReserveEnd:debtReserve,
      extraUsed,totalDebt:baseDebt+extraUsed,cashLeft:0,
      remaining,allocations,balances:debts.map(d=>({id:d.id,name:d.name,balance:d.balance}))
    });

    if(debtFreeIndex===null && remaining<0.01) debtFreeIndex=rows.length-1;
    if(debtFreeIndex!==null){
      extraAfter++;
      if(extraAfter>=5) break;
    }
  }
  return {rows,debtFreeIndex};
}
function totalDebt(){ return state.debts.reduce((s,d)=>s+Number(d.balance||0),0); }
function overdueDebt(){ return state.debts.filter(d=>d.category==="overdue").reduce((s,d)=>s+Number(d.balance||0),0); }
function nextTarget(){
  const o=state.debts.filter(d=>d.category==="overdue"&&d.balance>0).sort((a,b)=>a.priority-b.priority);
  if(o.length) return o[0];
  return state.debts.find(d=>d.id==="alterfina"&&d.balance>0) ||
         state.debts.find(d=>d.id==="indebted"&&d.balance>0) ||
         state.debts.find(d=>d.id==="cc"&&d.balance>0) ||
         state.debts.filter(d=>d.category==="biweekly"&&d.balance>0).sort((a,b)=>a.balance-b.balance)[0] ||
         state.debts.find(d=>d.id==="hoyes"&&d.balance>0);
}

function paymentMethodForDebt(d){
  if(d.category==="biweekly" || d.category==="hoyes") return "Automatic — Regular";
  if(d.category==="monthly") return "Manual — Regular";
  if(d.category==="overdue" || d.id==="indebted") return "Manual — Scotia";
  if(d.id==="bellbal" || d.id==="bree") return "Manual — Regular";
  return "Manual — Regular";
}
function paymentMethodForBill(b){
  if(b.id==="car") return "Automatic — Rent";
  return "Manual — Regular";
}
function accountTotalsForPay(r){
  const car=r.billItems.filter(b=>b.id==="car").reduce((s,b)=>s+Number(b.amount||0),0);
  const manualBills=r.billItems.filter(b=>b.id!=="car").reduce((s,b)=>s+Number(b.amount||0),0);
  const autoDebts=r.allocations.filter(a=>a.type==="Required").filter(a=>{
    const d=state.debts.find(x=>x.id===a.id);
    return d && (d.category==="biweekly" || d.category==="hoyes");
  }).reduce((s,a)=>s+a.amount,0);
  const manualDebts=r.allocations.filter(a=>a.type==="Required").filter(a=>{
    const d=state.debts.find(x=>x.id===a.id);
    return !(d && (d.category==="biweekly" || d.category==="hoyes"));
  }).reduce((s,a)=>s+a.amount,0);
  return {
    rentTransfer:r.rentSave+car,
    scotiaTransfer:r.planned+r.emergency+r.reserveAdd,
    regularKeep:r.groceries+r.gas+r.personal+autoDebts+manualBills+manualDebts
  };
}

function payIndexForDate(payDate){
  return Math.round((new Date(payDate+"T12:00:00")-new Date(state.firstPay+"T12:00:00"))/(state.payEveryDays*86400000));
}
function stageFor(payDate){
  state.paydayStages=state.paydayStages||{};
  if(!state.paydayStages[payDate]) state.paydayStages[payDate]={paydayDone:false,morningDone:false,actualRegular:null};
  return state.paydayStages[payDate];
}
function isFirstUnprocessedPay(payDate){
  const i=payIndexForDate(payDate);
  for(let x=0;x<i;x++){
    const d=addDays(state.firstPay,x*state.payEveryDays);
    if(!state.processedPays.includes(d)) return false;
  }
  return true;
}
function spendTransferFor(row){
  return Number(row.groceries||0)+Number(row.gas||0)+Number(row.personal||0);
}
function carDueFor(row){
  return row.billItems.filter(b=>b.id==="car").reduce((s,b)=>s+Number(b.amount||0),0);
}
function rentTopupFor(row){
  if(row.payDate!==state.firstPay) return 0;
  return Math.max(0,-Number(state.startingBalances?.rent||0));
}
function firstPayRegularDeficit(row){
  return row.payDate===state.firstPay ? Math.max(0,-Number(state.startingBalances?.regular||0)) : 0;
}
function paydayRentTransferFor(row){
  return Number(row.rentSave||0)+carDueFor(row)+rentTopupFor(row);
}
function dueOneTimeItems(payDate){
  return (state.oneTimeItems||[]).filter(x=>!x.paid && !x.posted && x.duePay===payDate);
}
function regularAutomaticBillsLater(row){
  // Biweekly debt autopays are expected overnight; this is for other automatic bills
  // that still need to remain in Regular until their later due date.
  const morning=new Date(row.payDate+"T12:00:00"); morning.setDate(morning.getDate()+1);
  return row.billItems.filter(b=>{
    if(!b.auto || b.account!=="regular") return false;
    const start=new Date(row.payDate+"T12:00:00"), end=new Date(row.nextDate+"T12:00:00");
    let cur=new Date(start.getFullYear(),start.getMonth(),1,12);
    while(cur<=end){
      const day=b.dueDay==="last"?daysInMonth(cur.getFullYear(),cur.getMonth()):Math.min(Number(b.dueDay),daysInMonth(cur.getFullYear(),cur.getMonth()));
      const due=new Date(cur.getFullYear(),cur.getMonth(),day,12);
      if(due>=morning && due<end) return true;
      cur=new Date(cur.getFullYear(),cur.getMonth()+1,1,12);
    }
    return false;
  });
}
function manualBillsFor(row){
  return row.billItems.filter(b=>!b.auto && b.account==="regular");
}
function autoDebtAllocationsFor(row){
  return row.allocations.filter(a=>a.type==="Required").filter(a=>{
    const d=state.debts.find(x=>x.id===a.id);
    return d && (d.category==="biweekly" || d.category==="hoyes");
  });
}
function manualDebtAllocationsFor(row){
  const auto=autoDebtAllocationsFor(row);
  return row.allocations.filter(a=>a.type==="Required" && !auto.some(x=>x.id===a.id));
}
function chooseDebtChunks(pool, debtsSnapshot){
  let available=Math.max(0,Number(pool)||0), picks=[];
  const overdue=debtsSnapshot.filter(d=>d.category==="overdue"&&d.balance>0).sort((a,b)=>a.priority-b.priority);
  if(overdue.length){
    for(const d of overdue){
      if(available<=0.005) break;
      const full=d.balance;
      const half=Math.round(d.balance*0.5*100)/100;
      const third=Math.round(d.balance/3*100)/100;
      let amt=0;
      if(available>=full) amt=full;
      else if(available>=half) amt=half;
      else if(available>=third) amt=third;
      if(amt>0){
        picks.push({id:d.id,name:d.name,amount:amt,chunk:true});
        available-=amt;
        d.balance-=amt;
        // Strict waterfall: only advance after this priority debt is cleared.
        if(d.balance>0.005) break;
      } else {
        // Strict past-due priority: hold the reserve instead of skipping
        // to a lower-priority account that happens to be smaller.
        break;
      }
    }
  }else{
    let order=[];
    const byId=id=>debtsSnapshot.find(d=>d.id===id&&d.balance>0);
    ["alterfina","indebted","cc"].forEach(id=>{const d=byId(id);if(d)order.push(d);});
    const regular=debtsSnapshot.filter(d=>d.category==="biweekly"&&d.id!=="alterfina"&&d.balance>0).sort((a,b)=>a.balance-b.balance);
    order=order.concat(regular);
    for(const d of order){
      if(available<=0.005) break;
      const amt=Math.min(available,d.balance);
      picks.push({id:d.id,name:d.name,amount:amt,chunk:false});
      available-=amt; d.balance-=amt;
    }
  }
  return {picks,unused:available,used:Math.max(0,(Number(pool)||0)-available)};
}
function morningCalculation(row, actualRegular){
  const autoLater=regularAutomaticBillsLater(row);
  const autoLaterTotal=autoLater.reduce((s,b)=>s+Number(b.amount||0),0);
  const manualBills=manualBillsFor(row);
  const manualBillsTotal=manualBills.reduce((s,b)=>s+Number(b.amount||0),0);
  const manualDebts=manualDebtAllocationsFor(row);
  const manualDebtsTotal=manualDebts.reduce((s,a)=>s+Number(a.amount||0),0);
  const oneTimes=dueOneTimeItems(row.payDate);
  const oneTimesTotal=oneTimes.reduce((s,x)=>s+Number(x.amount||0),0);

  const planned=Number(row.planned||0), emergency=Number(row.emergency||0);
  const protectedRegular=Number(state.regularBuffer||0)+autoLaterTotal;
  const todayFree=Math.max(0,Number(actualRegular)-protectedRegular-manualBillsTotal-manualDebtsTotal-oneTimesTotal-planned-emergency);
  const existingReserve=Number(state.funds.debtReserve||0);

  // Use today's free cash first. Existing reserve is pulled from Rent only if needed.
  const pool=todayFree+existingReserve;
  const snap=deep(state.debts);
  const chosen=chooseDebtChunks(pool,snap);
  const todayUsed=Math.min(todayFree,chosen.used);
  const reserveUsed=Math.max(0,chosen.used-todayUsed);
  const newReserveFromToday=Math.max(0,todayFree-todayUsed);
  const endingReserve=Math.max(0,existingReserve-reserveUsed+newReserveFromToday);

  return {
    actualRegular:Number(actualRegular),
    autoLater,autoLaterTotal,manualBills,manualBillsTotal,manualDebts,manualDebtsTotal,
    oneTimes,oneTimesTotal,planned,emergency,protectedRegular,todayFree,
    existingReserve,picks:chosen.picks,todayUsed,reserveUsed,newReserveFromToday,endingReserve
  };
}

function expectedAutoBillsByMorning(row){
  const start=new Date(row.payDate+"T12:00:00");
  const morningEnd=new Date(row.payDate+"T12:00:00"); morningEnd.setDate(morningEnd.getDate()+2);
  return row.billItems.filter(b=>{
    if(!b.auto || b.account!=="regular") return false;
    let cur=new Date(start.getFullYear(),start.getMonth(),1,12);
    const finish=new Date(morningEnd.getFullYear(),morningEnd.getMonth(),1,12);
    while(cur<=finish){
      const day=b.dueDay==="last"?daysInMonth(cur.getFullYear(),cur.getMonth()):Math.min(Number(b.dueDay),daysInMonth(cur.getFullYear(),cur.getMonth()));
      const due=new Date(cur.getFullYear(),cur.getMonth(),day,12);
      if(due>=start && due<morningEnd) return true;
      cur=new Date(cur.getFullYear(),cur.getMonth()+1,1,12);
    }
    return false;
  });
}
function expectedRegularBalances(row){
  const starting = row.payDate===state.firstPay
    ? Number(state.startingBalances?.regular||0)
    : Number(state.regularBuffer||0);
  const afterPay = starting + Number(row.income||0);
  const afterTransfers = afterPay - spendTransferFor(row) - paydayRentTransferFor(row);
  const overnightDebts = autoDebtAllocationsFor(row).reduce((s,a)=>s+Number(a.amount||0),0);
  const overnightBills = expectedAutoBillsByMorning(row).reduce((s,b)=>s+Number(b.amount||0),0);
  const tomorrow = afterTransfers - overnightDebts - overnightBills;
  return {starting,afterPay,afterTransfers,tomorrow,overnightDebts,overnightBills};
}
function isUncertainOneTime(x){
  return !!x.checkFirst || x.id==="chatgptoverdue";
}
function uncertainItemsForPay(payDate){
  return (state.oneTimeItems||[]).filter(x=>!x.paid && isUncertainOneTime(x) && x.duePay===payDate);
}
function toggleUncertainPosted(id){
  const item=(state.oneTimeItems||[]).find(x=>x.id===id);

  if(!row || row.payDate!==payDate || st.actualRegular===null || st.actualRegular===undefined) return;
  const c=morningCalculation(row,st.actualRegular);

  if(!confirm(`Finish ${fmtDate(payDate)}?\n\nManual required payments: ${money(c.oneTimesTotal+c.manualBillsTotal+c.manualDebtsTotal)}\nPlanned + emergency savings: ${money(c.planned+c.emergency)}\nMeaningful debt payments: ${money(c.picks.reduce((s,x)=>s+x.amount,0))}\nRegular buffer protected: ${money(state.regularBuffer||0)}`)) return;

  // Save undo snapshot.
  state.undoSnapshots=state.undoSnapshots||[];
  const snap=deep(state); snap.undoSnapshots=[];
  state.undoSnapshots.push(JSON.stringify(snap));
  if(state.undoSnapshots.length>5) state.undoSnapshots.shift();

  // Apply known interest once before this pay's debt activity.
  const debtIdsTouched=new Set([...autoDebtAllocationsFor(row),...manualDebtAllocationsFor(row),...c.picks].map(x=>x.id));
  state.debts.forEach(d=>{
    if(debtIdsTouched.has(d.id)&&d.balance>0&&Number(d.interestPerPay||0)>0) d.balance+=Number(d.interestPerPay);
  });

  // Apply automatic and manual required debt payments.
  [...autoDebtAllocationsFor(row),...manualDebtAllocationsFor(row)].forEach(a=>{
    const d=state.debts.find(x=>x.id===a.id);
    if(d){
      d.balance=Math.max(0,d.balance-a.amount);
      state.paymentHistory.push({date:payDate,debtId:d.id,amount:a.amount,type:"Required"});
    }
  });

  // Apply extra debt chunks.
  c.picks.forEach(a=>{
    const d=state.debts.find(x=>x.id===a.id);
    if(d){
      d.balance=Math.max(0,d.balance-a.amount);
      state.paymentHistory.push({date:payDate,debtId:d.id,amount:a.amount,type:"Extra"});
    }
  });

  // Mark one-time items paid, including uncertain charges confirmed as already posted.
  c.oneTimes.forEach(x=>{
    const orig=state.oneTimeItems.find(y=>y.id===x.id);
    if(orig) orig.paid=true;
  });
  uncertainItemsForPay(payDate).filter(x=>x.posted).forEach(x=>{x.paid=true;});

  // Update protected savings allocations.
  state.funds.rent += Number(row.rentSave||0);
  state.funds.planned += c.planned;
  state.funds.emergency += c.emergency;
  state.funds.debtReserve = c.endingReserve;

  st.morningDone=true;
  state.processedPays.push(payDate);
  save();renderAll();
}

// Legacy function retained only for old cached buttons.
function applyPay(payDate){
  alert("This version uses the safer two-stage payday process. Open Home and complete Payday first, then Next Morning.");
}
function undoLastPay(){
  const stack=state.undoSnapshots||[];
  if(!stack.length){alert("There is no completed payday to undo.");return;}
  if(!confirm("Undo the most recently completed payday and restore the previous balances/funds?")) return;
  const raw=stack.pop();
  const restored=JSON.parse(raw);
  restored.undoSnapshots=stack;
  state=restored;
  save(); renderAll();
}
function saveFunds(){
  state.funds.rent=Number(document.getElementById("fundRent").value)||0;
  state.funds.emergency=Number(document.getElementById("fundEmergency").value)||0;
  state.funds.planned=Number(document.getElementById("fundPlanned").value)||0;
  state.funds.debtReserve=Number(document.getElementById("fundDebtReserve").value)||0;
  state.funds.momPaid=Number(document.getElementById("fundMomPaid").value)||0;
  save(); renderAll();
}
function recordRentPaid(){
  const amt=Number(prompt("Rent payment to subtract from the rent fund:",state.rent));
  if(!amt || amt<0)return;
  if(amt>state.funds.rent && !confirm(`Your recorded rent fund is only ${money(state.funds.rent)}. Subtract ${money(amt)} anyway?`)) return;
  state.funds.rent=Math.max(0,state.funds.rent-amt);
  save();renderAll();
}

function saveSettings(){
  state.income=Number(document.getElementById("sIncome").value)||0;
  state.rent=Number(document.getElementById("sRent").value)||0;
  state.groceriesPerPay=Number(document.getElementById("sGroceries").value)||0;
  state.gasPerPay=Number(document.getElementById("sGas").value)||0;
  state.personalPerPay=Number(document.getElementById("sPersonal").value)||0;
  state.plannedPerPay=Number(document.getElementById("sPlanned").value)||0;
  state.emergencyPerPay=Number(document.getElementById("sEmergency").value)||0;
  state.emergencyTarget=Number(document.getElementById("sEmergencyTarget").value)||0;
  state.regularBuffer=Number(document.getElementById("sRegularBuffer").value)||0;
  state.momOwed=Number(document.getElementById("sMomOwed").value)||0;
  save(); renderAll();
}
function addOverride(existing){
  const d=existing||prompt("Pay date (YYYY-MM-DD):",state.firstPay); if(!d)return;
  const old=state.payOverrides[d]||{};
  const personal=prompt("Personal spending:",old.personal??state.personalPerPay); if(personal===null)return;
  const planned=prompt("Planned-expense savings:",old.planned??state.plannedPerPay); if(planned===null)return;
  const emergency=prompt("Emergency savings:",old.emergency??state.emergencyPerPay); if(emergency===null)return;
  const rent=prompt("Rent savings from this pay:",old.rent??rentContribution(d)); if(rent===null)return;
  const note=prompt("Note (optional):",old.note||"")??"";
  state.payOverrides[d]={personal:Number(personal)||0,planned:Number(planned)||0,emergency:Number(emergency)||0,rent:Number(rent)||0,note};
  save();renderAll();
}
function exportBackup(){
  const blob=new Blob([JSON.stringify(state,null,2)],{type:"application/json"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download="debt-freedom-backup.json"; a.click(); URL.revokeObjectURL(a.href);
}
function importBackup(ev){
  const f=ev.target.files[0]; if(!f)return;
  const reader=new FileReader();
  reader.onload=()=>{try{state=JSON.parse(reader.result);save();renderAll();alert("Your private budget plan is loaded on this device.");}catch(e){alert("Could not read that backup.");}};
  reader.readAsText(f);
}
function resetApp(){
  if(!confirm("Reset all balances, payments and settings to the original plan?"))return;
  state=deep(defaultState);save();renderAll();
}

document.querySelectorAll(".tab").forEach(btn=>btn.addEventListener("click",()=>{
  document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));
  document.querySelectorAll(".panel").forEach(x=>x.classList.remove("active"));
  btn.classList.add("active");document.getElementById(btn.dataset.tab).classList.add("active");
}));

if("serviceWorker" in navigator && location.protocol!=="file:"){
  navigator.serviceWorker.register("service-worker.js").catch(()=>{});
}
renderAll();
</script>
