<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Debt Freedom">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Debt Freedom</title>
<style>
:root{
  --bg:#f8fafc; --card:#fff; --ink:#0f172a; --muted:#64748b; --line:#e2e8f0;
  --navy:#0f172a; --blue:#2563eb; --green:#15803d; --red:#b91c1c; --amber:#b45309;
  --softblue:#eff6ff; --softgreen:#f0fdf4; --softred:#fef2f2; --softamber:#fffbeb;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
header{position:sticky;top:0;z-index:20;background:rgba(15,23,42,.96);color:#fff;padding:16px 16px 12px}
header h1{font-size:21px;margin:0 0 4px} header p{font-size:12px;margin:0;color:#cbd5e1}
main{max-width:760px;margin:auto;padding:14px 14px 92px}
.tabs{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:0 0 14px}
.tab{border:0;border-radius:12px;padding:10px 4px;font-size:11px;font-weight:700;background:#e2e8f0;color:#334155}
.tab.active{background:var(--navy);color:#fff}
.panel{display:none}.panel.active{display:block}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:10px;box-shadow:0 1px 2px rgba(15,23,42,.04)}
.kpi .label{font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.03em}
.kpi .value{font-size:23px;font-weight:800;margin-top:4px}
.kpi .sub{font-size:11px;color:var(--muted);margin-top:4px}
h2{font-size:17px;margin:18px 0 10px} h3{font-size:15px;margin:0 0 8px}
.badge{display:inline-block;border-radius:999px;padding:4px 8px;font-size:10px;font-weight:800}
.overdue{background:var(--softred);color:var(--red)}
.biweekly{background:var(--softblue);color:#1d4ed8}
.other{background:var(--softamber);color:var(--amber)}
.hoyes{background:var(--softgreen);color:var(--green)}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.muted{color:var(--muted);font-size:12px}
.big{font-size:19px;font-weight:800}
.progress{height:8px;border-radius:999px;background:#e2e8f0;overflow:hidden;margin-top:8px}
.progress>span{display:block;height:100%;background:var(--blue)}
button{font:inherit}
.btn{border:0;border-radius:10px;padding:10px 12px;font-weight:700;background:var(--navy);color:white}
.btn.secondary{background:#e2e8f0;color:#334155}.btn.danger{background:#fee2e2;color:#991b1b}
.btn.small{padding:7px 9px;font-size:12px}
input,select{width:100%;border:1px solid #cbd5e1;border-radius:10px;padding:10px;background:white;color:var(--ink);font-size:16px}
label{display:block;font-size:11px;color:var(--muted);font-weight:700;margin:0 0 5px}
.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
hr{border:0;border-top:1px solid var(--line);margin:12px 0}
.debt-card .actions{display:flex;gap:8px;margin-top:10px}
.paycard{border-left:4px solid var(--blue)}
.paycard.done{opacity:.6;border-left-color:var(--green)}
.alloc{font-size:12px;display:grid;grid-template-columns:1fr auto;gap:5px 12px;margin-top:10px}
.alloc b{font-variant-numeric:tabular-nums}
.note{background:var(--softblue);border:1px solid #bfdbfe;border-radius:12px;padding:11px;font-size:12px;line-height:1.4;margin-bottom:10px}
.warn{background:var(--softamber);border-color:#fde68a}
.good{background:var(--softgreen);border-color:#bbf7d0}
.footerbar{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);padding:8px 14px calc(8px + env(safe-area-inset-bottom));z-index:30}
.footerbar .inner{max-width:760px;margin:auto;display:flex;gap:8px}
.footerbar .btn{flex:1}
details summary{cursor:pointer;font-weight:700}
@media(max-width:420px){.grid{grid-template-columns:1fr 1fr}.tabs{gap:4px}.tab{font-size:10px;padding:9px 2px}.formgrid{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
  <h1>Debt Freedom</h1>
  <p>Your next pay, made simple • saves on this device</p>
</header>

<main>
  <div class="tabs">
    <button class="tab active" data-tab="home">Home</button>
    <button class="tab" data-tab="paydays">Paydays</button>
    <button class="tab" data-tab="debts">Debts</button>
    <button class="tab" data-tab="funds">Funds</button>
    <button class="tab" data-tab="settings">Settings</button>
  </div>

  <section id="home" class="panel active"></section>
  <section id="paydays" class="panel"></section>
  <section id="debts" class="panel"></section>
  <section id="funds" class="panel"></section>
  <section id="settings" class="panel"></section>
</main>

<div class="footerbar">
  <div class="inner">
    <button class="btn secondary" onclick="exportBackup()">Export backup</button>
    <button class="btn" onclick="renderAll()">Refresh plan</button>
  </div>
</div>

<script>
const VERSION = 1;
const money = n => new Intl.NumberFormat('en-CA',{style:'currency',currency:'CAD'}).format(Math.max(0,Number(n)||0));
const fmtDate = s => new Date(s+'T12:00:00').toLocaleDateString('en-CA',{month:'short',day:'numeric',year:'numeric'});
const iso = d => d.toISOString().slice(0,10);
const addDays = (s,n) => { const d=new Date(s+'T12:00:00'); d.setDate(d.getDate()+n); return iso(d); };
const firstOfMonth = s => { const d=new Date(s+'T12:00:00'); return new Date(d.getFullYear(),d.getMonth(),1,12); };
const daysInMonth = (y,m) => new Date(y,m+1,0).getDate();
const deep = x => JSON.parse(JSON.stringify(x));

const defaultState = {
  version: VERSION,
  income: 0,
  firstPay: "2026-09-10",
  payEveryDays: 14,
  rent: 0,
  groceriesPerPay: 0,
  gasPerPay: 0,
  personalPerPay: 0,
  plannedPerPay: 0,
  emergencyPerPay: 0,
  emergencyTarget: 0,
  funds: {rent:0, planned:0, emergency:0, momPaid:0},
  momOwed: 0,
  processedPays: [],
  payOverrides: {},
  bills: [],
  debts: [],
  paymentHistory: [],
  undoSnapshots: []
};

let state = load();

function load(){
  try{
    const raw=localStorage.getItem("debtFreedomState");
    return raw ? Object.assign(deep(defaultState),JSON.parse(raw)) : deep(defaultState);
  }catch(e){ return deep(defaultState); }
}
function save(){ localStorage.setItem("debtFreedomState",JSON.stringify(state)); }

function dueInWindow(payDate,nextDate,dueDay,startDate){
  let start = new Date(payDate+'T12:00:00'), end = new Date(nextDate+'T12:00:00');
  let cur = new Date(start.getFullYear(),start.getMonth(),1,12);
  let finish = new Date(end.getFullYear(),end.getMonth(),1,12);
  const minStart = new Date(startDate+'T12:00:00');
  while(cur <= finish){
    const day = dueDay==="last" ? daysInMonth(cur.getFullYear(),cur.getMonth()) : Math.min(Number(dueDay),daysInMonth(cur.getFullYear(),cur.getMonth()));
    const due = new Date(cur.getFullYear(),cur.getMonth(),day,12);
    if(due >= minStart && due >= start && due < end) return true;
    cur = new Date(cur.getFullYear(),cur.getMonth()+1,1,12);
  }
  return false;
}
function payDatesInMonth(payDate){
  const d=new Date(payDate+'T12:00:00'), arr=[];
  for(let i=0;i<40;i++){
    const p=addDays(state.firstPay,i*state.payEveryDays), pd=new Date(p+'T12:00:00');
    if(pd.getFullYear()===d.getFullYear() && pd.getMonth()===d.getMonth()) arr.push(p);
  }
  return arr;
}
function rentContribution(payDate){
  if(state.payOverrides[payDate] && state.payOverrides[payDate].rent!==undefined) return Number(state.payOverrides[payDate].rent)||0;
  if(payDate < "2026-11-01") return 0;
  const pays=payDatesInMonth(payDate);
  return pays.slice(0,2).includes(payDate) ? state.rent/2 : 0;
}
function lifeForPay(payDate){
  const o=state.payOverrides[payDate]||{};
  return {
    personal:o.personal!==undefined?Number(o.personal):state.personalPerPay,
    planned:o.planned!==undefined?Number(o.planned):state.plannedPerPay,
    emergency:o.emergency!==undefined?Number(o.emergency):state.emergencyPerPay,
    note:o.note||""
  };
}

function simulate(){
  let debts=deep(state.debts);
  let rows=[], debtFreeIndex=null, extraAfter=0;

  // State balances represent reality after any paydays already marked completed.
  // Start the forecast at the first unprocessed payday so completed pays are never counted twice.
  let startIndex=0;
  while(state.processedPays.includes(addDays(state.firstPay,startIndex*state.payEveryDays))) startIndex++;

  for(let i=startIndex;i<startIndex+40;i++){
    const payDate=addDays(state.firstPay,i*state.payEveryDays);
    const nextDate=addDays(payDate,state.payEveryDays);
    const life=lifeForPay(payDate);
    const rentSave=rentContribution(payDate);
    const billItems=state.bills.filter(b=>dueInWindow(payDate,nextDate,b.dueDay,b.start));
    const billsTotal=billItems.reduce((s,b)=>s+Number(b.amount||0),0);
    const living=state.groceriesPerPay+state.gasPerPay+life.personal+life.planned+life.emergency;

    const allocations=[];
    let baseDebt=0;

    // Known recurring interest/fees.
    debts.forEach(d=>{
      if(d.balance>0 && Number(d.interestPerPay||0)>0) d.balance += Number(d.interestPerPay);
    });

    debts.forEach(d=>{
      if(d.balance<=0) return;
      let due=0;
      if(d.category==="biweekly") due = (i===0 && d.firstPay) ? Number(d.firstPay) : Number(d.min||0);
      else if(d.category==="hoyes") due=Number(d.min||0);
      else if(d.category==="monthly" && dueInWindow(payDate,nextDate,d.dueDay,state.firstPay)) due=Number(d.min||0);
      else if(d.id==="bellbal" && (i===0 || i===1)) due=226.57;
      else if(d.id==="bree" && payDate==="2026-09-24") due=815.99;
      due=Math.min(d.balance,due);
      if(due>0){
        d.balance-=due; baseDebt+=due;
        allocations.push({name:d.name,amount:due,type:"Required"});
      }
    });

    let extra=Math.max(0,state.income-billsTotal-living-rentSave-baseDebt);

    // Extra-pay strategy:
    // overdue priorities first; then costly/unscheduled debt; HOYES is never accelerated.
    let overdue=debts.filter(d=>d.category==="overdue" && d.balance>0).sort((a,b)=>a.priority-b.priority);
    let order=[];
    if(overdue.length){
      order=overdue;
    }else{
      const byId=id=>debts.find(d=>d.id===id && d.balance>0);
      ["alterfina","indebted","cc"].forEach(id=>{const d=byId(id); if(d) order.push(d);});
      const regular=debts.filter(d=>d.category==="biweekly" && d.id!=="alterfina" && d.balance>0).sort((a,b)=>a.balance-b.balance);
      order=order.concat(regular);
    }

    let extraUsed=0;
    for(const d of order){
      if(extra<=0.005) break;
      const amt=Math.min(extra,d.balance);
      d.balance-=amt; extra-=amt; extraUsed+=amt;
      allocations.push({name:d.name,amount:amt,type:"Extra"});
    }

    const remaining=debts.reduce((s,d)=>s+Math.max(0,d.balance),0);
    rows.push({
      index:i,payDate,nextDate,income:state.income,billItems,billsTotal,
      groceries:state.groceriesPerPay,gas:state.gasPerPay,...life,rentSave,
      baseDebt,extraUsed,totalDebt:baseDebt+extraUsed,cashLeft:extra,
      remaining,allocations,balances:debts.map(d=>({id:d.id,name:d.name,balance:d.balance}))
    });

    if(debtFreeIndex===null && remaining<0.01) debtFreeIndex=rows.length-1;
    if(debtFreeIndex!==null){
      extraAfter++;
      if(extraAfter>=5) break; // debt-free pay + four more
    }
  }
  return {rows,debtFreeIndex};
}
function totalDebt(){ return state.debts.reduce((s,d)=>s+Number(d.balance||0),0); }
function overdueDebt(){ return state.debts.filter(d=>d.category==="overdue").reduce((s,d)=>s+Number(d.balance||0),0); }
function nextTarget(){
  const o=state.debts.filter(d=>d.category==="overdue"&&d.balance>0).sort((a,b)=>a.priority-b.priority);
  if(o.length) return o[0];
  return state.debts.find(d=>d.id==="alterfina"&&d.balance>0) ||
         state.debts.find(d=>d.id==="indebted"&&d.balance>0) ||
         state.debts.find(d=>d.id==="cc"&&d.balance>0) ||
         state.debts.filter(d=>d.category==="biweekly"&&d.balance>0).sort((a,b)=>a.balance-b.balance)[0] ||
         state.debts.find(d=>d.id==="hoyes"&&d.balance>0);
}

function renderHome(){
  const sim=simulate(), target=nextTarget();
  const df=sim.debtFreeIndex!==null ? sim.rows[sim.debtFreeIndex].payDate : null;
  const next=sim.rows[0];
  if(!next){
    document.getElementById("home").innerHTML='<div class="card"><h3>No future paycheques found.</h3></div>';
    return;
  }
  const required=next.allocations.filter(a=>a.type==="Required");
  const extras=next.allocations.filter(a=>a.type==="Extra");
  const untilDays=Math.max(0,Math.ceil((new Date(next.payDate+"T12:00:00")-new Date())/86400000));
  const countdown=untilDays===0?"Today":untilDays===1?"Tomorrow":`${untilDays} days`;

  document.getElementById("home").innerHTML=`
    <div class="grid">
      <div class="card kpi"><div class="label">All debt</div><div class="value">${money(totalDebt())}</div><div class="sub">Includes HOYES + credit card</div></div>
      <div class="card kpi"><div class="label">Past due</div><div class="value">${money(overdueDebt())}</div><div class="sub">Priority: Speedy first</div></div>
      <div class="card kpi"><div class="label">Projected debt-free</div><div class="value" style="font-size:18px">${df?fmtDate(df):"Beyond model"}</div><div class="sub">Updates when balances change</div></div>
      <div class="card kpi"><div class="label">Next target</div><div class="value" style="font-size:18px">${target?target.name:"Done"}</div><div class="sub">${target?money(target.balance):"No balance"}</div></div>
    </div>

    <h2>Next pay: ${fmtDate(next.payDate)}</h2>
    <div class="card" style="border:2px solid var(--blue)">
      <div class="row">
        <div><div class="muted">${countdown}</div><div class="big">${money(next.income)} paycheque</div></div>
        <div style="text-align:right"><div class="muted">SAFE TO SPEND</div><div class="big" style="color:var(--green)">${money(next.personal)}</div></div>
      </div>
      <div class="muted" style="margin-top:6px">“Safe to spend” is your personal money only. Groceries, gas, planned expenses and emergency savings are protected separately.</div>
    </div>

    <div class="card">
      <h3>1. Move money out of chequing</h3>
      <div class="alloc">
        <span>Rent savings</span><b>${money(next.rentSave)}</b>
        <span>Planned-expense fund</span><b>${money(next.planned)}</b>
        <span>Emergency fund</span><b>${money(next.emergency)}</b>
      </div>
    </div>

    <div class="card">
      <h3>2. Keep for everyday essentials</h3>
      <div class="alloc">
        <span>Groceries</span><b>${money(next.groceries)}</b>
        <span>Gas</span><b>${money(next.gas)}</b>
        <span>Personal / fun — safe to spend</span><b>${money(next.personal)}</b>
      </div>
    </div>

    <div class="card">
      <h3>3. Pay bills due before next payday</h3>
      ${next.billItems.length ? next.billItems.map(b=>`<div class="row" style="margin-top:7px"><span>${b.name}</span><b>${money(b.amount)}</b></div>`).join("") : '<div class="muted">No monthly bills in this pay window.</div>'}
    </div>

    <div class="card">
      <h3>4. Make required debt payments</h3>
      ${required.length ? required.map(a=>`<div class="row" style="margin-top:7px"><span>${a.name}</span><b>${money(a.amount)}</b></div>`).join("") : '<div class="muted">No required debt payments.</div>'}
    </div>

    <div class="card">
      <h3>5. Attack debt with what is left</h3>
      ${extras.length ? extras.map(a=>`<div class="row" style="margin-top:7px"><span><b>${a.name}</b> <span class="badge overdue">EXTRA</span></span><b>${money(a.amount)}</b></div>`).join("") : '<div class="muted">No extra debt payment is available on this pay.</div>'}
      <hr>
      <div class="row"><span>Projected debt after this pay</span><b>${money(next.remaining)}</b></div>
    </div>

    ${next.note?`<div class="note"><b>This pay:</b> ${next.note}</div>`:""}

    <button class="btn" style="width:100%;padding:14px" onclick="applyPay('${next.payDate}')">I completed this payday</button>
    ${(state.undoSnapshots||[]).length?`<button class="btn secondary" style="width:100%;margin-top:8px" onclick="undoLastPay()">Undo last completed payday</button>`:""}

    <div class="note good" style="margin-top:12px"><b>Strategy:</b> HOYES stays at $275 biweekly only. Extra money goes SpeedyCash → LoanExpress → My Canada Payday → KOHO → Klarna. After the past-due balances are gone, the app attacks Alterfina, InDebted/NotchUp, the credit card and then remaining loans.</div>
    <div class="note warn"><b>One missing number:</b> your credit-card interest rate is not modeled yet. When you have it, update the balance regularly and the projection will stay conservative.</div>
  `;
}
function renderPaydays(){
  const sim=simulate();
  document.getElementById("paydays").innerHTML = `<h2>Paycheque plan</h2>${(state.undoSnapshots||[]).length?`<button class="btn secondary small" style="margin-bottom:10px" onclick="undoLastPay()">Undo last completed payday</button>`:""}` + sim.rows.map(r=>{
    const done=state.processedPays.includes(r.payDate);
    const extras=r.allocations.filter(a=>a.type==="Extra");
    const required=r.allocations.filter(a=>a.type==="Required");
    return `<div class="card paycard ${done?"done":""}">
      <div class="row">
        <div><div class="muted">Pay ${r.index+1}</div><h3>${fmtDate(r.payDate)}</h3></div>
        <div style="text-align:right"><div class="big">${money(r.income)}</div><div class="muted">${done?"Applied":"Planned"}</div></div>
      </div>
      <div class="alloc">
        <span>Monthly bills</span><b>${money(r.billsTotal)}</b>
        <span>Groceries</span><b>${money(r.groceries)}</b>
        <span>Gas</span><b>${money(r.gas)}</b>
        <span>Personal</span><b>${money(r.personal)}</b>
        <span>Planned-expense fund</span><b>${money(r.planned)}</b>
        <span>Emergency fund</span><b>${money(r.emergency)}</b>
        <span>Rent savings</span><b>${money(r.rentSave)}</b>
        <span>Required debts</span><b>${money(r.baseDebt)}</b>
        <span>Extra debt attack</span><b>${money(r.extraUsed)}</b>
      </div>
      ${extras.length?`<hr><div class="muted"><b>Extra-pay targets</b></div>${extras.map(a=>`<div class="row" style="margin-top:5px"><span>${a.name}</span><b>${money(a.amount)}</b></div>`).join("")}`:""}
      <hr>
      <div class="row"><span>Debt remaining</span><b>${money(r.remaining)}</b></div>
      ${r.note?`<div class="note" style="margin-top:10px">${r.note}</div>`:""}
      ${!done?`<button class="btn small" style="margin-top:10px;width:100%" onclick="applyPay('${r.payDate}')">I completed this payday</button>`:""}
    </div>`
  }).join("");
}

function categoryLabel(d){
  if(d.category==="overdue") return ["Past due","overdue"];
  if(d.category==="hoyes") return ["HOYES","hoyes"];
  if(d.category==="biweekly") return ["Biweekly","biweekly"];
  if(d.category==="monthly") return ["Monthly","other"];
  return ["Other","other"];
}
function renderDebts(){
  const sorted=deep(state.debts).sort((a,b)=>{
    const rank=x=>x.category==="overdue"?0:x.category==="biweekly"?1:x.category==="other"?2:x.category==="monthly"?3:x.category==="special"?4:5;
    return rank(a)-rank(b) || (a.priority||99)-(b.priority||99);
  });
  document.getElementById("debts").innerHTML=`<h2>Debt balances</h2>
    <div class="note">Tap <b>Record payment</b> whenever you make a real payment. The balance and future projection will update immediately.</div>
    ${sorted.map(d=>{
      const [label,cls]=categoryLabel(d);
      const pct=d.start>0?Math.max(0,Math.min(100,(1-d.balance/d.start)*100)):0;
      return `<div class="card debt-card">
        <div class="row"><div><h3>${d.name}</h3><span class="badge ${cls}">${label}${d.priority?` #${d.priority}`:""}</span></div><div class="big">${money(d.balance)}</div></div>
        <div class="progress"><span style="width:${pct}%"></span></div>
        <div class="muted" style="margin-top:6px">${d.min?`Regular payment: ${money(d.min)}`:"No regular payment"}${d.interestPerPay?` • +${money(d.interestPerPay)} / pay`:""}</div>
        ${d.note?`<div class="muted" style="margin-top:4px">${d.note}</div>`:""}
        <div class="actions">
          <button class="btn small" onclick="recordPayment('${d.id}')">Record payment</button>
          <button class="btn secondary small" onclick="editDebt('${d.id}')">Edit</button>
        </div>
      </div>`
    }).join("")}`;
}

function renderFunds(){
  document.getElementById("funds").innerHTML=`
    <h2>Savings & life funds</h2>
    <div class="grid">
      <div class="card kpi"><div class="label">Rent fund</div><div class="value">${money(state.funds.rent)}</div></div>
      <div class="card kpi"><div class="label">Emergency</div><div class="value">${money(state.funds.emergency)}</div><div class="sub">Target ${money(state.emergencyTarget)}</div></div>
      <div class="card kpi"><div class="label">Planned expenses</div><div class="value">${money(state.funds.planned)}</div></div>
      <div class="card kpi"><div class="label">Paid to Mom</div><div class="value">${money(state.funds.momPaid)}</div><div class="sub">${state.momOwed?`Owed entered: ${money(state.momOwed)}`:"Amount owed not entered yet"}</div></div>
    </div>
    <div class="card">
      <h3>Update fund balances</h3>
      <div class="formgrid">
        <div><label>Rent saved</label><input id="fundRent" type="number" step=".01" value="${state.funds.rent}"></div>
        <div><label>Emergency fund</label><input id="fundEmergency" type="number" step=".01" value="${state.funds.emergency}"></div>
        <div><label>Planned-expense fund</label><input id="fundPlanned" type="number" step=".01" value="${state.funds.planned}"></div>
        <div><label>Paid back to Mom</label><input id="fundMomPaid" type="number" step=".01" value="${state.funds.momPaid}"></div>
      </div>
      <button class="btn" style="margin-top:10px;width:100%" onclick="saveFunds()">Save funds</button><button class="btn secondary" style="margin-top:8px;width:100%" onclick="recordRentPaid()">Record monthly rent paid</button>
    </div>
    <div class="note">Your $500 normal life allowance is split into <b>$250 personal + $125 planned expenses + $125 emergency</b>. Planned/emergency amounts are meant to accumulate if unused; you can later redirect genuinely unused money to debt or your mom.</div>
  `;
}

function renderSettings(){
  document.getElementById("settings").innerHTML=`
    <h2>Budget settings</h2>
    <div class="card">
      <div class="formgrid">
        <div><label>Income / pay</label><input id="sIncome" type="number" step=".01" value="${state.income}"></div>
        <div><label>Monthly rent</label><input id="sRent" type="number" step=".01" value="${state.rent}"></div>
        <div><label>Groceries / pay</label><input id="sGroceries" type="number" step=".01" value="${state.groceriesPerPay}"></div>
        <div><label>Gas / pay</label><input id="sGas" type="number" step=".01" value="${state.gasPerPay}"></div>
        <div><label>Personal / pay</label><input id="sPersonal" type="number" step=".01" value="${state.personalPerPay}"></div>
        <div><label>Planned fund / pay</label><input id="sPlanned" type="number" step=".01" value="${state.plannedPerPay}"></div>
        <div><label>Emergency fund / pay</label><input id="sEmergency" type="number" step=".01" value="${state.emergencyPerPay}"></div>
        <div><label>Emergency target</label><input id="sEmergencyTarget" type="number" step=".01" value="${state.emergencyTarget}"></div>
        <div><label>Amount owed to Mom (optional)</label><input id="sMomOwed" type="number" step=".01" value="${state.momOwed}"></div>
      </div>
      <button class="btn" style="margin-top:10px;width:100%" onclick="saveSettings()">Save settings</button>
    </div>

    <details class="card"><summary>Pay-specific overrides</summary>
      <p class="muted">Use these for birthdays, Christmas, lean pay periods, or changing rent savings.</p>
      <div id="overrideList"></div>
      <button class="btn secondary small" onclick="addOverride()">Add / edit override</button>
    </details>

    <details class="card"><summary>Backup / restore</summary>
      <p class="muted">Export a backup before switching phones or clearing Safari data.</p>
      <button class="btn secondary small" onclick="exportBackup()">Export JSON backup</button>
      <label style="margin-top:10px">Import backup</label>
      <input type="file" accept=".json,application/json" onchange="importBackup(event)">
    </details>

    <button class="btn danger" style="width:100%" onclick="resetApp()">Reset app to original plan</button>
  `;
  const el=document.getElementById("overrideList");
  el.innerHTML=Object.entries(state.payOverrides).sort().map(([d,o])=>`
    <div class="row" style="padding:8px 0;border-bottom:1px solid var(--line)">
      <div><b>${fmtDate(d)}</b><div class="muted">${o.note||""}</div></div>
      <button class="btn secondary small" onclick="addOverride('${d}')">Edit</button>
    </div>`).join("");
}

function renderAll(){
  save();
  if(!state.debts.length || !state.income){
    document.getElementById("home").innerHTML=`
      <div class="card" style="border:2px solid var(--blue)">
        <h2 style="margin-top:0">Set up your private plan</h2>
        <p>Your financial information is not built into this public app. Import your private plan file once on this device.</p>
        <label>Select <b>my_debt_freedom_plan.json</b></label>
        <input type="file" accept=".json,application/json" onchange="importBackup(event)">
        <div class="note good" style="margin-top:12px"><b>Privacy:</b> the imported plan is saved locally in this browser/web app. Do not upload the private JSON file to the public GitHub repository.</div>
      </div>`;
    ["paydays","debts","funds","settings"].forEach(id=>document.getElementById(id).innerHTML='<div class="card"><p>Import your private plan from Home first.</p></div>');
    return;
  }
  renderHome(); renderPaydays(); renderDebts(); renderFunds(); renderSettings();
}

function recordPayment(id){
  const d=state.debts.find(x=>x.id===id); if(!d)return;
  const raw=prompt(`Payment to ${d.name}\nCurrent balance: ${money(d.balance)}\nEnter payment amount:`);
  if(raw===null)return;
  const amt=Math.max(0,Math.min(d.balance,Number(raw)||0));
  if(!amt)return;
  d.balance=Math.max(0,d.balance-amt);
  state.paymentHistory.push({date:iso(new Date()),debtId:id,amount:amt,type:"manual"});
  save(); renderAll();
}
function editDebt(id){
  const d=state.debts.find(x=>x.id===id); if(!d)return;
  const bal=prompt(`${d.name} balance:`,d.balance); if(bal===null)return;
  const p=d.min!==undefined?prompt(`${d.name} regular payment:`,d.min):null;
  d.balance=Math.max(0,Number(bal)||0);
  if(p!==null)d.min=Math.max(0,Number(p)||0);
  if(d.balance>d.start)d.start=d.balance;
  save(); renderAll();
}

function applyPay(payDate){
  if(state.processedPays.includes(payDate)){alert("That payday is already completed.");return;}
  const row=simulate().rows.find(r=>r.payDate===payDate); if(!row)return;
  if(!confirm(`Mark ${fmtDate(payDate)} completed?\n\nDebt payments: ${money(row.totalDebt)}\nRent savings: ${money(row.rentSave)}\nPlanned fund: ${money(row.planned)}\nEmergency fund: ${money(row.emergency)}\nSafe personal spending: ${money(row.personal)}`)) return;

  // Save a restorable snapshot first.
  state.undoSnapshots=state.undoSnapshots||[];
  const snap=deep(state);
  snap.undoSnapshots=[];
  state.undoSnapshots.push(JSON.stringify(snap));
  if(state.undoSnapshots.length>5) state.undoSnapshots.shift();

  // Apply each interest-bearing debt's charge once for this payday.
  const touched=new Set(row.allocations.map(a=>a.name));
  state.debts.forEach(d=>{
    if(touched.has(d.name) && d.balance>0 && Number(d.interestPerPay||0)>0){
      d.balance += Number(d.interestPerPay);
    }
  });

  row.allocations.forEach(a=>{
    const d=state.debts.find(x=>x.name===a.name);
    if(d){
      d.balance=Math.max(0,d.balance-a.amount);
      state.paymentHistory.push({date:payDate,debtId:d.id,amount:a.amount,type:a.type});
    }
  });
  state.funds.rent += row.rentSave;
  state.funds.planned += row.planned;
  state.funds.emergency += row.emergency;
  state.processedPays.push(payDate);
  save(); renderAll();
}

function undoLastPay(){
  const stack=state.undoSnapshots||[];
  if(!stack.length){alert("There is no completed payday to undo.");return;}
  if(!confirm("Undo the most recently completed payday and restore the previous balances/funds?")) return;
  const raw=stack.pop();
  const restored=JSON.parse(raw);
  restored.undoSnapshots=stack;
  state=restored;
  save(); renderAll();
}
function saveFunds(){
  state.funds.rent=Number(document.getElementById("fundRent").value)||0;
  state.funds.emergency=Number(document.getElementById("fundEmergency").value)||0;
  state.funds.planned=Number(document.getElementById("fundPlanned").value)||0;
  state.funds.momPaid=Number(document.getElementById("fundMomPaid").value)||0;
  save(); renderAll();
}
function recordRentPaid(){
  const amt=Number(prompt("Rent payment to subtract from the rent fund:",state.rent));
  if(!amt || amt<0)return;
  if(amt>state.funds.rent && !confirm(`Your recorded rent fund is only ${money(state.funds.rent)}. Subtract ${money(amt)} anyway?`)) return;
  state.funds.rent=Math.max(0,state.funds.rent-amt);
  save();renderAll();
}

function saveSettings(){
  state.income=Number(document.getElementById("sIncome").value)||0;
  state.rent=Number(document.getElementById("sRent").value)||0;
  state.groceriesPerPay=Number(document.getElementById("sGroceries").value)||0;
  state.gasPerPay=Number(document.getElementById("sGas").value)||0;
  state.personalPerPay=Number(document.getElementById("sPersonal").value)||0;
  state.plannedPerPay=Number(document.getElementById("sPlanned").value)||0;
  state.emergencyPerPay=Number(document.getElementById("sEmergency").value)||0;
  state.emergencyTarget=Number(document.getElementById("sEmergencyTarget").value)||0;
  state.momOwed=Number(document.getElementById("sMomOwed").value)||0;
  save(); renderAll();
}
function addOverride(existing){
  const d=existing||prompt("Pay date (YYYY-MM-DD):",state.firstPay); if(!d)return;
  const old=state.payOverrides[d]||{};
  const personal=prompt("Personal spending:",old.personal??state.personalPerPay); if(personal===null)return;
  const planned=prompt("Planned-expense savings:",old.planned??state.plannedPerPay); if(planned===null)return;
  const emergency=prompt("Emergency savings:",old.emergency??state.emergencyPerPay); if(emergency===null)return;
  const rent=prompt("Rent savings from this pay:",old.rent??rentContribution(d)); if(rent===null)return;
  const note=prompt("Note (optional):",old.note||"")??"";
  state.payOverrides[d]={personal:Number(personal)||0,planned:Number(planned)||0,emergency:Number(emergency)||0,rent:Number(rent)||0,note};
  save();renderAll();
}
function exportBackup(){
  const blob=new Blob([JSON.stringify(state,null,2)],{type:"application/json"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download="debt-freedom-backup.json"; a.click(); URL.revokeObjectURL(a.href);
}
function importBackup(ev){
  const f=ev.target.files[0]; if(!f)return;
  const reader=new FileReader();
  reader.onload=()=>{try{state=JSON.parse(reader.result);save();renderAll();alert("Your private budget plan is loaded on this device.");}catch(e){alert("Could not read that backup.");}};
  reader.readAsText(f);
}
function resetApp(){
  if(!confirm("Reset all balances, payments and settings to the original plan?"))return;
  state=deep(defaultState);save();renderAll();
}

document.querySelectorAll(".tab").forEach(btn=>btn.addEventListener("click",()=>{
  document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));
  document.querySelectorAll(".panel").forEach(x=>x.classList.remove("active"));
  btn.classList.add("active");document.getElementById(btn.dataset.tab).classList.add("active");
}));

if("serviceWorker" in navigator && location.protocol!=="file:"){
  navigator.serviceWorker.register("service-worker.js").catch(()=>{});
}
renderAll();
</script>
</body>
</html>
